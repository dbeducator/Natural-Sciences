name: Add AdSense to all pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert AdSense script
        run: find . -name "*.html" | xargs sed -i 's|</head>|<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1566975054213856" crossorigin="anonymous"></script>\n</head>|'
      - name: Ad block above tabs
        run: find . -name "*.html" | xargs sed -i 's|<div class="tabs">|<div style="text-align:center;margin:20px 0"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1566975054213856" data-ad-slot="8903445038" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle \|\| []).push({});<\/script></div><div class="tabs">|'
      - name: Ad block before lesson content
        run: find . -name "*.html" | xargs sed -i 's|<div class="lesson-content" id="lessonContent"></div>|<div style="text-align:center;margin:20px 0"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1566975054213856" data-ad-slot="2529608371" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle \|\| []).push({});<\/script></div><div class="lesson-content" id="lessonContent"></div>|'
      - name: Ad block before assessment
        run: find . -name "*.html" | xargs sed -i 's|<div id="assessment" class="content-section">|<div style="text-align:center;margin:20px 0"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1566975054213856" data-ad-slot="6054439937" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle \|\| []).push({});<\/script></div><div id="assessment" class="content-section">|'
      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Add AdSense blocks" || echo "Nothing to commit"
          git push
