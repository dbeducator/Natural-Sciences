name: Add AdSense to all pages
on: workflow_dispatch
jobs:
  add-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Insert AdSense script into every HTML head
        run: |
          find . -name "*.html" | xargs sed -i 's|</head>|<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1566975054213856" crossorigin="anonymous"></script>\n</head>|'

      - name: Insert ad block above tabs
        run: |
          find . -name "*.html" | xargs sed -i 's|<div class="tabs">|<div style="text-align:center;margin:20px 0;padding:0 20px;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1566975054213856" data-ad-slot="8903445038" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle \|\| []).push({});<\/script></div>\n<div class="tabs">|'

      - name: Insert ad block before lesson content
        run: |
          find . -name "*.html" | xargs sed -i 's|<div class="lesson-content" id="lessonContent"></div>|<div style="text-align:center;margin:20px 0;padding:0 20px;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1566975054213856" data-ad-slot="2529608371" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle \|\| []).push({});<\/script></div>\n<div class="lesson-content" id="lessonContent"></div>|'

      - name: Insert ad block before assessment
        run: |
          find . -name "*.html" | xargs sed -i 's|<div id="assessment" class="content-section">|<div style="text-align:center;margin:20px 0;padding:0 20px;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1566975054213856" data-ad-slot="6054439937" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle \|\| []).push({});<\/script></div>\n<div id="assessment" class="content-section">|'

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Add AdSense ad blocks to all pages" || echo "Nothing to commit"
          git push
