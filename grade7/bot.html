<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxi Pie - Grade 7 Science Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background:#0a1a33; height: 100vh; overflow: hidden; }

        #maxi-fab { display:none; }
        #maxi-fab img { width:85%; height:85%; border-radius:50%; object-fit: cover; }

        #chat-modal { display:block; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(7,7,12,0.95); z-index:1000; }
        .chat-container { display:flex; flex-direction:column; height:100%; width:100%; max-width:500px; margin:0 auto; background:#f0f4f8; }

        .chat-header { background:#0a1a33; padding:15px; display:flex; align-items:center; gap:12px; color:white; border-bottom:3px solid #10b981; }
        .chat-header img { width:45px; height:45px; border-radius:50%; border:2px solid #10b981; }
        .close-btn { margin-left:auto; background:#ef4444; color:white; border:none; border-radius:50%; width:35px; height:35px; font-weight:bold; cursor:pointer; font-size:18px; }

        .chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
        .msg { max-width:88%; padding:12px 16px; border-radius:18px; line-height:1.5; font-size:15px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        .bot { align-self:flex-start; background:white; color:#333; border-bottom-left-radius:2px; }
        .user { align-self:flex-end; background:#10b981; color:white; border-bottom-right-radius:2px; }

        .chat-input-area { padding:12px; background:white; display:flex; gap:8px; border-top:1px solid #ddd; flex-shrink:0; }
        .chat-input-area input { flex:1; padding:12px; border-radius:25px; border:1px solid #ccc; outline:none; font-size:16px; color:#333; }
        .send-btn { background:#10b981; color:white; border:none; padding:10px 18px; height:45px; border-radius:25px; font-weight:bold; cursor:pointer; font-size:15px; }

        .chip { display:inline-block; background:#e8f5f0; color:#0a6e50; border:1.5px solid #10b981; border-radius:16px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; margin:3px; }
        .chip-row { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }

        .topic-card { background:#f8f9fa; border-left:3px solid #10b981; border-radius:8px; padding:10px 12px; margin:4px 0; }
        .topic-card h4 { color:#0a1a33; font-size:14px; margin-bottom:4px; }
        .topic-card p { color:#555; font-size:13px; line-height:1.4; }

        .zoom-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center; flex-direction:column; }
        .zoom-modal.open { display:flex; }
        .zoom-modal img { max-width:96%; max-height:85vh; border-radius:8px; object-fit:contain; }
        .zoom-close { position:absolute; top:16px; right:16px; background:#ef4444; color:white; border:none; border-radius:50%; width:40px; height:40px; font-size:20px; font-weight:bold; cursor:pointer; z-index:2001; }

        .page-img-wrap { margin-top:8px; border-radius:8px; overflow:hidden; cursor:pointer; border:1px solid #ddd; }
        .page-img-label { font-size:11px; color:#888; padding:3px 8px; }
    </style>
</head>
<body>

<div id="maxi-fab" onclick="openChat()"><img src="cat_full.png"></div>

<div id="chat-modal">
    <div class="chat-container">
        <div class="chat-header">
            <img src="cat_full.png">
            <div>
                <h3>Maxi Pie</h3>
                <small style="color:#10b981">Grade 7 Science Chommie 🇿🇦</small>
            </div>
            <button class="close-btn" onclick="closeChat()">×</button>
        </div>
        <div id="messages" class="chat-messages">
            <div class="msg bot">Sho! I'm <strong>Maxi Pie</strong> 🐾, your Grade 7 science sidekick! Ask me about the biosphere, biodiversity, reproduction, acids, energy, electricity, and more!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask me something, chommie..." onkeypress="handleTyping(event)">
            <button onclick="handleSend()" class="send-btn">Send</button>
        </div>
    </div>
</div>

<!-- Zoom modal -->
<div id="zoom-modal" class="zoom-modal" onclick="closeZoom()">
    <button class="zoom-close" onclick="closeZoom()">×</button>
    <img id="zoom-img" src="">
</div>

<script>
    // ── State ─────────────────────────────────────────────────────────────
    let knowledgeBase = [];
    let fuse = null;
    let fuseFallback = null;
    let pdfReady = false;
    let lastQuery = '';
    let lastRawAnswer = '';
    const PAGE_IMAGES = {};
    let pdfDocRef = null;

    // ── PDF Loading ───────────────────────────────────────────────────────
    async function initResources() {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        try {
            const pdf = await pdfjsLib.getDocument('resources/logic7.pdf').promise;
            pdfDocRef = pdf;
            const total = pdf.numPages;

            for (let i = 1; i <= total; i++) {
                const page = await pdf.getPage(i);
                const tc = await page.getTextContent();
                const text = tc.items.map(s => s.str).join(' ').replace(/\s+/g, ' ');
                knowledgeBase.push({ text, page: i });

                // Progress every 30 pages
                if (i === 1 || i % 30 === 0 || i === total) {
                    showProgress(Math.round(i/total*100), i, total);
                }
            }

            fuse = new Fuse(knowledgeBase, { keys:['text'], threshold:0.3, ignoreLocation:true });
            fuseFallback = new Fuse(knowledgeBase, { keys:['text'], threshold:0.6, ignoreLocation:true });
            pdfReady = true;
            showReady();
        } catch(e) {
            addMessage('bot', 'Eish 😅 problem loading the textbook. Make sure logic7.pdf is in resources/');
            console.error('PDF load error:', e);
        }
    }

    function showProgress(pct, cur, total) {
        const box = document.getElementById('messages');
        let prog = document.getElementById('progress-msg');
        if (!prog) {
            prog = document.createElement('div');
            prog.id = 'progress-msg';
            prog.className = 'msg bot';
            box.appendChild(prog);
        }
        prog.textContent = `📖 Loading textbook... ${pct}% (${cur}/${total} pages)`;
        box.scrollTop = box.scrollHeight;
    }

    function showReady() {
        const prog = document.getElementById('progress-msg');
        if (prog) prog.remove();

        const div = document.createElement('div');
        div.className = 'msg bot';
        div.innerHTML = `Sho! 📚 Textbook loaded and ready chommie!<br><br>
<div class="chip-row">
  <span class="chip" onclick="showTopicMenu()">📋 Topic Menu</span>
  <span class="chip" onclick="showGlossary()">📚 Glossary</span>
  <span class="chip" onclick="startQuiz()">🧪 Quiz me</span>
</div>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = 99999;

        // Auto-show topics after 1s
        setTimeout(showTopicMenu, 1000);
    }

    // ── Page image rendering ──────────────────────────────────────────────
    async function renderPage(pageNum) {
        if (PAGE_IMAGES[pageNum]) return PAGE_IMAGES[pageNum];
        if (!pdfDocRef) return null;
        try {
            const page = await pdfDocRef.getPage(pageNum);
            const vp = page.getViewport({ scale: 2.0 });
            const canvas = document.createElement('canvas');
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
            const url = canvas.toDataURL('image/jpeg', 0.85);
            PAGE_IMAGES[pageNum] = url;
            return url;
        } catch { return null; }
    }

    function showPageImage(pageNum, label) {
        if (!pageNum || !pdfDocRef) return;
        const box = document.getElementById('messages');
        const wrap = document.createElement('div');
        wrap.className = 'msg bot page-img-wrap';
        wrap.innerHTML = `<div class="page-img-label">📄 Textbook p.${pageNum}${label ? ' · '+label : ''} 🔍 tap to zoom</div><div style="text-align:center;padding:8px;color:#aaa;font-size:13px;">Loading page...</div>`;
        box.appendChild(wrap);
        box.scrollTop = 99999;

        renderPage(pageNum).then(url => {
            if (!url) return;
            wrap.innerHTML = `<div class="page-img-label">📄 Textbook p.${pageNum}${label ? ' · '+label : ''} 🔍 tap to zoom</div><img src="${url}" style="width:100%;display:block;cursor:zoom-in;" onclick="openZoom('${url}')">`;
        });
    }

    function openZoom(src) {
        document.getElementById('zoom-img').src = src;
        document.getElementById('zoom-modal').classList.add('open');
    }
    function closeZoom() {
        document.getElementById('zoom-modal').classList.remove('open');
        document.getElementById('zoom-img').src = '';
    }

    // ── Topic Menu ────────────────────────────────────────────────────────
    const TOPICS = [
        { name:"The Biosphere",                          page:2,   strand:"Strand 1", keywords:["biosphere","lithosphere","hydrosphere","atmosphere","organism"] },
        { name:"Biodiversity",                           page:17,  strand:"Strand 1", keywords:["biodiversity","classification","species","adaptation","food web"] },
        { name:"Sexual Reproduction",                    page:50,  strand:"Strand 1", keywords:["reproduction","pollination","fertilisation","germination","seed"] },
        { name:"Variation",                              page:82,  strand:"Strand 1", keywords:["variation","heredity","inherited","trait","offspring"] },
        { name:"Properties of Materials",                page:94,  strand:"Strand 2", keywords:["material","property","hardness","conductor","insulator"] },
        { name:"Separating Mixtures",                    page:112, strand:"Strand 2", keywords:["mixture","filtration","distillation","evaporation","solution"] },
        { name:"Acids, Bases and Neutral Substances",    page:134, strand:"Strand 2", keywords:["acid","base","neutral","pH","indicator","litmus"] },
        { name:"The Periodic Table of Elements",         page:148, strand:"Strand 2", keywords:["periodic table","element","atom","metal","non-metal","symbol"] },
        { name:"Renewable and Non-renewable Energy",     page:168, strand:"Strand 3", keywords:["energy","renewable","non-renewable","coal","solar","wind"] },
        { name:"Potential and Kinetic Energy",           page:179, strand:"Strand 3", keywords:["kinetic energy","potential energy","joule","gravitational"] },
        { name:"Heat: Energy Transfer",                  page:204, strand:"Strand 3", keywords:["heat","conduction","convection","radiation","thermal"] },
        { name:"Heat Insulation and Energy Saving",      page:220, strand:"Strand 3", keywords:["insulation","insulator","energy saving","heat loss"] },
        { name:"Energy Transfer to Surroundings",        page:233, strand:"Strand 3", keywords:["energy transfer","surroundings","sound","light","dissipate"] },
        { name:"The National Electricity Supply System", page:242, strand:"Strand 3", keywords:["electricity","generator","turbine","transformer","Eskom"] },
        { name:"Relationship of the Earth to the Sun",   page:258, strand:"Strand 4", keywords:["earth","sun","orbit","rotation","season","axis"] },
        { name:"Relationship of the Moon to the Earth",  page:287, strand:"Strand 4", keywords:["moon","eclipse","tide","lunar","phase"] },
        { name:"Historical Development of Astronomy",    page:312, strand:"Strand 4", keywords:["astronomy","telescope","Galileo","MeerKAT","SALT","Copernicus"] }
    ];

    function showTopicMenu() {
        const strands = {};
        TOPICS.forEach(t => {
            if (!strands[t.strand]) strands[t.strand] = [];
            strands[t.strand].push(t);
        });

        let html = '<b>📋 Grade 7 Science — Topic Menu</b><br><br>';
        const colors = { 'Strand 1': '#e8f5e9', 'Strand 2': '#e3f2fd', 'Strand 3': '#fff8e1', 'Strand 4': '#f3e8ff' };

        Object.entries(strands).forEach(([strand, topics]) => {
            html += `<div style="font-weight:700;color:#0a1a33;margin:8px 0 4px;">${strand}</div>`;
            topics.forEach(t => {
                html += `<div style="background:${colors[strand]||'#f5f5f5'};border-radius:8px;padding:6px 10px;margin:2px 0;cursor:pointer;" onclick="lookupTopic('${t.name.replace(/'/g,"\\'")}')">
                    <span style="font-size:13px;font-weight:600;color:#0a1a33;">${t.name}</span>
                    <span style="font-size:11px;color:#888;margin-left:6px;">p.${t.page}</span>
                </div>`;
            });
        });
        addMessage('bot', html);
    }

    function lookupTopic(name) {
        const topic = TOPICS.find(t => t.name === name);
        if (!topic) return;
        addMessage('user', name);

        if (!pdfReady || knowledgeBase.length === 0) {
            addMessage('bot', 'Eish, still loading the textbook! Try again in a moment.');
            return;
        }

        // Pull pages from this topic's range
        const next = TOPICS[TOPICS.indexOf(topic) + 1];
        const endPage = next ? next.page - 1 : topic.page + 20;
        const pages = knowledgeBase.filter(p => p.page >= topic.page && p.page <= endPage);
        const rawText = pages.map(p => p.text).join(' ');

        lastQuery = name;
        lastRawAnswer = rawText;

        const answer = buildAnswer(name, rawText);
        addMessage('bot', answer);
        setTimeout(() => showPageImage(topic.page, name), 400);
        setTimeout(() => showActionChips(name), 600);
    }

    // ── Glossary ──────────────────────────────────────────────────────────
    const GLOSSARY = [
        { term:"biosphere",       page:2,   topic:"The Biosphere" },
        { term:"hydrosphere",     page:5,   topic:"The Biosphere" },
        { term:"atmosphere",      page:5,   topic:"The Biosphere" },
        { term:"lithosphere",     page:6,   topic:"The Biosphere" },
        { term:"biodiversity",    page:17,  topic:"Biodiversity" },
        { term:"adaptation",      page:17,  topic:"Biodiversity" },
        { term:"classification",  page:17,  topic:"Biodiversity" },
        { term:"food web",        page:17,  topic:"Biodiversity" },
        { term:"pollination",     page:50,  topic:"Sexual Reproduction" },
        { term:"fertilisation",   page:50,  topic:"Sexual Reproduction" },
        { term:"germination",     page:50,  topic:"Sexual Reproduction" },
        { term:"variation",       page:82,  topic:"Variation" },
        { term:"heredity",        page:82,  topic:"Variation" },
        { term:"filtration",      page:112, topic:"Separating Mixtures" },
        { term:"distillation",    page:112, topic:"Separating Mixtures" },
        { term:"evaporation",     page:112, topic:"Separating Mixtures" },
        { term:"acid",            page:134, topic:"Acids, Bases and Neutral Substances" },
        { term:"base",            page:134, topic:"Acids, Bases and Neutral Substances" },
        { term:"neutral",         page:134, topic:"Acids, Bases and Neutral Substances" },
        { term:"indicator",       page:134, topic:"Acids, Bases and Neutral Substances" },
        { term:"periodic table",  page:148, topic:"The Periodic Table of Elements" },
        { term:"element",         page:148, topic:"The Periodic Table of Elements" },
        { term:"atom",            page:148, topic:"The Periodic Table of Elements" },
        { term:"kinetic energy",  page:179, topic:"Potential and Kinetic Energy" },
        { term:"potential energy",page:179, topic:"Potential and Kinetic Energy" },
        { term:"conduction",      page:204, topic:"Heat: Energy Transfer" },
        { term:"convection",      page:204, topic:"Heat: Energy Transfer" },
        { term:"radiation",       page:204, topic:"Heat: Energy Transfer" },
        { term:"insulation",      page:220, topic:"Heat Insulation and Energy Saving" },
        { term:"generator",       page:242, topic:"The National Electricity Supply System" },
        { term:"Eskom",           page:242, topic:"The National Electricity Supply System" },
        { term:"orbit",           page:258, topic:"Relationship of the Earth to the Sun" },
        { term:"eclipse",         page:287, topic:"Relationship of the Moon to the Earth" },
        { term:"tide",            page:287, topic:"Relationship of the Moon to the Earth" },
        { term:"MeerKAT",         page:312, topic:"Historical Development of Astronomy" },
        { term:"telescope",       page:312, topic:"Historical Development of Astronomy" }
    ];

    function showGlossary(filter) {
        let terms = GLOSSARY;
        if (filter) terms = GLOSSARY.filter(t => t.term.toLowerCase().startsWith(filter.toLowerCase()));

        const letters = [...new Set(GLOSSARY.map(t => t.term[0].toUpperCase()))].sort();
        let html = `<b>📚 Glossary${filter ? ' — ' + filter.toUpperCase() : ''} (${terms.length} terms)</b><br><br>`;

        html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">';
        letters.forEach(l => {
            html += `<span style="background:#e8f5f0;color:#0a6e50;border:1px solid #10b981;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;" onclick="showGlossary('${l}')">${l}</span>`;
        });
        html += '</div>';

        terms.forEach(t => {
            html += `<div style="padding:6px 0;border-bottom:1px solid #eee;cursor:pointer;" onclick="lookupGlossaryTerm('${t.term.replace(/'/g,"\\'")}',${t.page})">
                <span style="font-weight:600;color:#0a6e50;">${t.term}</span>
                <span style="color:#888;font-size:12px;margin-left:6px;">p.${t.page} · ${t.topic}</span>
            </div>`;
        });

        addMessage('bot', html);
    }

    function lookupGlossaryTerm(term, page) {
        addMessage('user', `Tell me about: ${term}`);
        if (!pdfReady || knowledgeBase.length === 0) {
            addMessage('bot', 'Still loading! Try again in a moment.');
            return;
        }
        const pages = knowledgeBase.filter(p => p.page >= page && p.page <= page + 4);
        const rawText = pages.map(p => p.text).join(' ');
        lastQuery = term;
        lastRawAnswer = rawText;
        const answer = buildAnswer(term, rawText);
        addMessage('bot', answer);
        setTimeout(() => showPageImage(page, term), 400);
        setTimeout(() => showActionChips(term), 600);
    }

    // ── Core answer builder ───────────────────────────────────────────────
    function buildAnswer(query, rawText) {
        if (!rawText || rawText.length < 20) return `Eish 😅 I couldn't find info on "<b>${query}</b>". Try asking a question like "what is ${query}?"`;

        const q = query.toLowerCase();
        const junk = /^(ACTIVITY|STRAND|Figure|Keywords?|Did you|Take note|Do you|Can you|Write|Draw|Copy|Look at|Complete|Carefully|Study)/i;

        // Extract sentences
        const sents = (rawText.match(/[^.!?]{15,}[.!?]+/g) || [])
            .map(s => s.trim())
            .filter(s => s.length > 40 && !s.endsWith('?') && !junk.test(s) && !/F1le:|ckg\/|phctco/.test(s));

        // Score by keyword relevance
        const keywords = q.replace(/[^a-z\s]/g,'').split(/\s+/).filter(w => w.length > 2);
        const scored = sents.map(s => {
            const sl = s.toLowerCase();
            let score = keywords.reduce((n,kw) => n + (sl.includes(kw) ? 4 : 0), 0);
            if (/ is | are | means | refers to | defined as /i.test(s)) score += 4;
            if (keywords.some(kw => sl.startsWith(kw))) score += 5;
            if (score === 0) score = 1;
            return { s, score };
        }).sort((a,b) => b.score - a.score);

        const top = scored.slice(0,4).map(x => x.s);

        // Extract "Did you know" / "Take note"
        const dyk = rawText.match(/Did you know\??([\s\S]{20,200}?)(?=Take note|ACTIVITY|Keywords|$)/i);
        const tn  = rawText.match(/Take note([\s\S]{20,200}?)(?=Did you|ACTIVITY|Keywords|$)/i);

        const emoji = q.includes('acid')||q.includes('base') ? '🧪'
            : q.includes('biosphere')||q.includes('sphere') ? '🌍'
            : q.includes('biodiversity')||q.includes('classif') ? '🦁'
            : q.includes('repro')||q.includes('pollin') ? '🌸'
            : q.includes('energy')||q.includes('kinetic') ? '⚡'
            : q.includes('heat')||q.includes('conduct') ? '🌡️'
            : q.includes('electr')||q.includes('eskom') ? '🔌'
            : q.includes('periodic')||q.includes('element')||q.includes('atom') ? '⚛️'
            : q.includes('moon')||q.includes('eclipse') ? '🌕'
            : q.includes('sun')||q.includes('orbit') ? '☀️'
            : q.includes('telescope')||q.includes('astro') ? '🔭'
            : '📖';

        let html = `Sho chommie! ${emoji} Here's what the textbook says:<br><br>`;
        if (top.length > 0) {
            html += top.map(s => `📌 ${s}`).join('<br><br>');
        } else {
            html += `📌 The textbook covers this topic — see the page image below, or ask: <b>what is ${query}?</b>`;
        }

        if (dyk) {
            html += `<br><br><div style="background:#e8f5e9;border-left:3px solid #10b981;padding:10px 12px;border-radius:8px;">
                <strong>💡 Did you know?</strong><br>${dyk[1].trim()}</div>`;
        }
        if (tn) {
            html += `<br><div style="background:#fff8e1;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:8px;">
                <strong>📝 Take note</strong><br>${tn[1].trim()}</div>`;
        }

        return html;
    }

    // ── Action chips ──────────────────────────────────────────────────────
    function showActionChips(topic) {
        const div = document.createElement('div');
        div.className = 'msg bot';
        div.innerHTML = `<div class="chip-row">
            <span class="chip" onclick="doExplain()">📖 Explain simply</span>
            <span class="chip" onclick="doExample()">💡 SA example</span>
            <span class="chip" onclick="doDeeper()">🔍 Go deeper</span>
            <span class="chip" onclick="startQuiz()">🧪 Quiz me</span>
        </div>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = 99999;
    }

    function doExplain() {
        if (!lastRawAnswer) { addMessage('bot', 'Ask me a topic first chommie!'); return; }
        const junk = /^(ACTIVITY|STRAND|Figure|Keywords?|Did you|Take note|Do you|Can you|Write|Draw|Copy|Look at)/i;
        const sents = (lastRawAnswer.match(/[^.!?]{15,}[.!?]+/g)||[]).map(s=>s.trim()).filter(s => s.length>40 && !s.endsWith('?') && !junk.test(s)).slice(0,3);
        const saExamples = {
            'acid': 'SA mines produce sulfuric acid from gold processing. Your stomach also uses hydrochloric acid to digest food!',
            'biosphere': "SA has 9 biomes — from the lush Garden Route to the dry Karoo. The biosphere here is incredibly rich!",
            'biodiversity': "The Cape Floral Kingdom has more plant species per km² than the Amazon — SA biodiversity is world-class!",
            'energy': "SA's Eskom crisis shows why renewable energy matters — the Karoo has some of the best solar potential on Earth!",
            'periodic': "SA mines gold (Au), platinum (Pt) and manganese (Mn) — all real periodic table elements from SA soil!",
            'moon': "SA's coastlines get tides twice daily — the Moon's gravity pulling the Indian and Atlantic Oceans!",
            'telescope': "The SALT telescope in Sutherland and MeerKAT in the Karoo make SA a world astronomy leader!"
        };
        const q = lastQuery.toLowerCase();
        const sa = Object.keys(saExamples).find(k => q.includes(k));
        let html = `📘 <b>Simple breakdown:</b><br><br>`;
        if (sents.length > 0) html += sents.map(s=>`📌 ${s}`).join('<br><br>');
        html += `<br><br>👀 <b>SA Connection:</b> ${sa ? saExamples[sa] : 'In South Africa you can see this everywhere — from the Karoo to Soweto. Science is all around us! 🌍'}`;
        addMessage('bot', html);
        setTimeout(() => showActionChips(lastQuery), 400);
    }

    function doExample() {
        const examples = {
            'acid': 'Vinegar is a weak acid — it has a sour taste. Lemon juice, baking soda dissolved in water (a base) and neutralise each other. 🧪',
            'biosphere': 'The ocean, soil, and air around Table Mountain are all parts of the biosphere working together. 🌍',
            'biodiversity': 'The Kruger National Park has over 500 bird species, 147 mammal species — incredible biodiversity! 🦁',
            'energy': 'The Gariep Dam converts gravitational potential energy into electricity for thousands of SA homes. ⚡',
            'atom': 'Iron atoms in SA steel are arranged in patterns that make it strong enough to build bridges. ⚛️',
            'moon': 'During a lunar eclipse, the Moon moves into Earth\'s shadow — you can see this from anywhere in SA! 🌕',
            'heat': 'Joburg\'s Highveld thunderstorms are caused by convection — hot air rising rapidly from the warm ground. 🌡️'
        };
        const q = lastQuery.toLowerCase();
        const ex = Object.keys(examples).find(k => q.includes(k));
        addMessage('bot', `💡 <b>Real-life SA example — ${lastQuery}:</b><br><br>${ex ? examples[ex] : 'In South Africa you can see this everywhere — from the Karoo to the ocean! 🌍'}`);
        setTimeout(() => showActionChips(lastQuery), 400);
    }

    function doDeeper() {
        if (!lastQuery || !pdfReady) { addMessage('bot', 'Ask me a topic first chommie!'); return; }
        // Pull more pages for deeper content
        const topic = TOPICS.find(t => lastQuery.toLowerCase().includes(t.name.toLowerCase().split(' ')[0]));
        let results = [];
        if (topic) {
            const next = TOPICS[TOPICS.indexOf(topic)+1];
            const endPage = next ? next.page - 1 : topic.page + 20;
            results = knowledgeBase.filter(p => p.page >= topic.page && p.page <= endPage);
        }
        if (results.length === 0) {
            // Exact substring search
            const qL = lastQuery.toLowerCase();
            results = knowledgeBase.filter(p => p.text.toLowerCase().includes(qL)).slice(0,8);
        }
        if (results.length === 0 && fuse) results = fuse.search(lastQuery, {limit:8}).map(r=>r.item);
        if (results.length === 0) { addMessage('bot', `Eish 😅 couldn't find more on "${lastQuery}". Try a different question!`); return; }

        const rawText = results.map(p => p.text).join(' ');
        addMessage('bot', `🔍 <b>Going deeper on "${lastQuery}"...</b><br><br>` + buildAnswer(lastQuery, rawText));
        setTimeout(() => showActionChips(lastQuery), 500);
    }

    // ── Quiz ──────────────────────────────────────────────────────────────
    let quizMode = false;
    let quizAnswer = '';

    function startQuiz() {
        if (!pdfReady || knowledgeBase.length === 0) {
            addMessage('bot', 'Eish, still loading! Try again in a sec.'); return;
        }
        // Find a good question from Key questions sections
        const sample = knowledgeBase[Math.floor(Math.random() * Math.min(knowledgeBase.length, 100))];
        const qMatch = sample.text.match(/[•*]\s*([A-Z][^?]{15,60}\?)/g);
        if (qMatch && qMatch.length > 0) {
            const q = qMatch[0].replace(/^[•*]\s*/, '').trim();
            quizMode = true;
            quizAnswer = q;
            addMessage('bot', `🧠 <b>Quiz time chommie!</b><br><br><b>${q}</b><br><br><em style="color:#888;font-size:13px;">Type your answer — I'll show you what the textbook says!</em>`);
        } else {
            // Fallback question
            const fallbacks = [
                {q:'What is the biosphere?', a:'The biosphere is the place where all life exists on planet Earth.'},
                {q:'Name the three components of the biosphere.', a:'The biosphere consists of the lithosphere (rocks and soil), hydrosphere (all water), and atmosphere (all gases).'},
                {q:'What is biodiversity?', a:'Biodiversity is a term used to describe the great variety of living organisms on Earth and their varied habitats.'},
                {q:'What is the difference between an acid and a base?', a:'Acids taste sour and turn litmus red. Bases taste bitter, feel slippery and turn litmus blue.'},
                {q:'What is kinetic energy?', a:'Kinetic energy is the energy an object has because it is moving.'}
            ];
            const pick = fallbacks[Math.floor(Math.random()*fallbacks.length)];
            quizMode = true;
            quizAnswer = pick.a;
            addMessage('bot', `🧠 <b>Quiz time chommie!</b><br><br><b>${pick.q}</b><br><br><em style="color:#888;font-size:13px;">Type your answer!</em>`);
        }
    }

    // ── Main search ───────────────────────────────────────────────────────
    function searchPDF(query) {
        if (!pdfReady || knowledgeBase.length === 0) {
            addMessage('bot', "Eish chommie, still loading the textbook! 📚 Ask me again in a moment."); return;
        }
        const qL = query.toLowerCase();

        // Check topic names
        const matchedTopic = TOPICS.find(t => t.name.toLowerCase().includes(qL) || qL.includes(t.name.toLowerCase().split(' ')[0].toLowerCase()));
        if (matchedTopic) { lookupTopic(matchedTopic.name); return; }

        // Check glossary terms
        const matchedGlossary = GLOSSARY.find(g => qL.includes(g.term.toLowerCase()) || g.term.toLowerCase().includes(qL));
        if (matchedGlossary) { lookupGlossaryTerm(matchedGlossary.term, matchedGlossary.page); return; }

        // 4-strategy search
        let results = [];
        // 1. Exact substring
        results = knowledgeBase.filter(p => p.text.toLowerCase().includes(qL)).slice(0,6);
        // 2. All words
        if (results.length === 0) {
            const words = qL.split(/\s+/).filter(w=>w.length>3);
            if (words.length > 1) results = knowledgeBase.filter(p => words.every(w=>p.text.toLowerCase().includes(w))).slice(0,6);
        }
        // 3. Fuse
        if (results.length === 0 && fuse) results = fuse.search(query, {limit:6}).map(r=>r.item);
        // 4. Loose Fuse
        if (results.length === 0 && fuseFallback) results = fuseFallback.search(query, {limit:4}).map(r=>r.item);

        if (results.length > 0) {
            const rawText = results.map(p=>p.text).join(' ');
            lastQuery = query;
            lastRawAnswer = rawText;
            addMessage('bot', buildAnswer(query, rawText));
            const bestPage = results[0].page;
            if (bestPage) setTimeout(() => showPageImage(bestPage, query), 400);
            setTimeout(() => showActionChips(query), 600);
        } else {
            // Show glossary as helpful fallback
            let html = `Eish 😅 I couldn't find "<b>${query}</b>" in the textbook. Try one of these:<br><br><div class="chip-row">`;
            GLOSSARY.slice(0,8).forEach(g => {
                html += `<span class="chip" onclick="lookupGlossaryTerm('${g.term.replace(/'/g,"\\'")}',${g.page})">${g.term}</span>`;
            });
            html += `</div><br><span class="chip" onclick="showTopicMenu()">📋 Topic Menu</span>`;
            addMessage('bot', html);
        }
    }

    // ── handleSend — the core (UNCHANGED structure from working base) ─────
    function handleSend() {
        const input = document.getElementById('userInput');
        const query = input.value.trim();
        if (!query) return;

        addMessage('user', query);
        input.value = '';

        setTimeout(() => {
            const q = query.toLowerCase();

            // Quiz mode — accept any answer
            if (quizMode) {
                quizMode = false;
                addMessage('bot', `Thanks for trying! 💪 Here's what the textbook says:<br><br><em>${quizAnswer}</em><br><br>Ask me another topic or say <b>quiz me</b> for another one!`);
                return;
            }

            // Greetings
            if (['hi','hello','hey','aweh','heita','howzit','sho'].some(g => q === g || q.startsWith(g+' '))) {
                addMessage('bot', "Heita chommie! 👋 Ready to learn some Grade 7 science? Ask me anything or tap <b>Topic Menu</b> to browse!");
                return;
            }

            // How are you
            if (q.includes('how are you') || q.includes("how's it")) {
                addMessage('bot', "I'm buzzing! 🔥 Let's get into some science. What topic chommie?");
                return;
            }

            // Navigation
            if (['topics','topic','menu','index','contents'].includes(q) || q.includes('topic menu')) { showTopicMenu(); return; }
            if (q === 'glossary' || q.includes('show glossary') || q.includes('all terms')) { showGlossary(); return; }
            if (q.includes('quiz') || q.includes('test me')) { startQuiz(); return; }

            // People
            if (q.includes('leslee')) {
                addMessage('bot', "Yoh 😄 Leslee is not just anyone — she's the <b>visionary behind everything</b> you see here. Coach L Academy, this bot, the radio station — all from her belief that young people deserve better. 🌱");
                return;
            }
            if (q.includes('sadee')) {
                addMessage('bot', "Yoh Sadee 🙏 She's spiritually grounded and deeply compassionate. Makes the whole room calmer just by being there. Sweet soul — we appreciate her around here! 💛");
                return;
            }

            // Search the PDF
            searchPDF(query);

        }, 300);
    }

    // ── Utilities — IDENTICAL to working base ─────────────────────────────
    function handleTyping(event) {
        if (event.key === 'Enter') handleSend();
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = text;
        const box = document.getElementById('messages');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function openChat() { document.getElementById('chat-modal').style.display = 'block'; }
    function closeChat() { document.getElementById('chat-modal').style.display = 'none'; }

    // ── Start ─────────────────────────────────────────────────────────────
    window.onload = initResources;
</script>
