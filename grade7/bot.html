<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxi Pie - Grade 7 Science Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background:#0a1a33; margin:0; height: 100%; overflow:hidden; visibility:hidden; }
        #chat-modal { display:flex; flex-direction:column; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(7, 7, 12, 0.95); z-index:1000; }
        .chat-container { display:flex; flex-direction:column; flex:1; max-width:500px; margin:0 auto; background:#f0f4f8; visibility:visible; }
        .chat-header { background:#0a1a33; padding:15px; display:flex; align-items:center; gap:12px; color:white; border-bottom:3px solid #10b981; }
        .chat-header img { width:45px; height:45px; border-radius:50%; border:2px solid #10b981; }
        .close-btn { margin-left:auto; background:#ef4444; color:white; border:none; border-radius:50%; width:35px; height:35px; cursor:pointer; }
        .chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:15px; }
        .msg { max-width:85%; padding:12px 16px; border-radius:18px; line-height:1.4; font-size:16px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        .bot { align-self:flex-start; background:white; color:#333; }
        .user { align-self:flex-end; background:#10b981; color:white; }
        .chat-input-area { padding:15px; background:white; display:flex; gap:10px; border-top:1px solid #ddd; }
        .chat-input-area input { flex:1; padding:12px; border-radius:25px; border:1px solid #ccc; outline:none; font-size:16px; }
        .send-btn { background:#10b981; color:white; border:none; padding:10px; height:45px; border-radius:25px; cursor:pointer; }
        #maxi-fab { position:fixed; bottom:25px; left:25px; width:60px; height:60px; background:#10b981; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:999; }
        #maxi-fab img { width:85%; }
    </style>
</head>
<body>

<div id="maxi-fab" onclick="openChat()"><img src="cat_full.png" alt="Chat with Maxi Pie"></div>

<div id="chat-modal" style="display: none;">
    <div class="chat-container">
        <div class="chat-header">
            <img src="cat_full.png">
            <div><h3>Maxi Pie</h3><small>Science Chommie 🇿🇦</small></div>
            <button class="close-btn" onclick="closeChat()">×</button>
        </div>
        <div id="messages" class="chat-messages">
            <div class="msg bot">Sho! I'm your science sidekick! Ask me anything!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask me something, chommie..." onkeypress="if(event.key==='Enter') handleSend()">
            <button onclick="handleSend()" class="send-btn">Send</button>
        </div>
    </div>
</div>

<script>
    let pdfDocRef = null; // PDF reference
    let pdfContent = []; // To store PDF text
    let fuse; // Fuse.js instance for searching

    function openChat() {
        document.getElementById('chat-modal').style.display = 'flex';
        document.body.style.visibility = 'visible';
        // Load PDF and greet the user, if not already loaded
        if (!pdfDocRef) {
            addMessage('bot', 'Loading the science book, please wait...');
            loadPDF('resources/logic7.pdf');
        } else {
            addMessage('bot', 'Sho! I\'m Maxi Pie 🐾! Ask me anything about science!');
        }
    }

    function closeChat() {
        document.getElementById('chat-modal').style.display = 'none';
        document.body.style.visibility = 'hidden';
    }

    function addMessage(type, content) {
        const messagesContainer = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.textContent = content;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function handleSend() {
        const userInput = document.getElementById('userInput');
        const query = userInput.value.trim();
        if (query) {
            addMessage('user', query);
            userInput.value = '';
            processQuery(query);
        }
    }

    async function processQuery(query) {
        const results = fuse.search(query); // Use Fuse.js to search
        let response = results.length > 0 
            ? `I found: "${results[0].item}".` 
            : "Sorry, I couldn't find any information.";
        
        addMessage('bot', response);
    }

    async function loadPDF(url) {
        const loadingTask = pdfjsLib.getDocument(url);
        loadingTask.promise.then(pdf => {
            pdfDocRef = pdf;
            const totalPages = pdf.numPages;
            const promises = [];

            for (let i = 1; i <= totalPages; i++) {
                promises.push(pdf.getPage(i).then(page => {
                    return page.getTextContent().then(textContent => {
                        const text = textContent.items.map(item => item.str).join(' ');
                        pdfContent.push(text);
                    });
                }));
            }
            return Promise.all(promises);
        }).then(() => {
            fuse = new Fuse(pdfContent, { includeScore: true, threshold: 0.3 });
            addMessage('bot', 'The science book is ready! Ask me anything!');
        }).catch(() => {
            addMessage('bot', 'Could not load the science book. Please try again later.');
        });
    }
</script>

</body>
</html>
