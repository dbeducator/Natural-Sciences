<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Maxi Pie - Grade 7 Science Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background: #0a1a33; }
        #maxi-fab { position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px; background: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.5); z-index: 999; }
        #maxi-fab img { width: 85%; height: 85%; border-radius: 50%; object-fit: cover; }
        #chat-modal { display: flex; flex-direction: column; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(7, 7, 12, 0.95); z-index: 1000; }
        .chat-container { display: flex; flex-direction: column; flex: 1; width: 100%; max-width: 500px; margin: 0 auto; background: #f0f4f8; }
        .chat-header { background: #0a1a33; padding: 15px; display: flex; align-items: center; gap: 12px; color: white; border-bottom: 3px solid #10b981; }
        .close-btn { margin-left: auto; background: #ef4444; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .bot { align-self: flex-start; background: white; color: #333; }
        .user { align-self: flex-end; background: #10b981; color: white; }
        .chat-input-area { padding: 15px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; font-size: 16px; }
        .send-btn { background: #10b981; color: white; border: none; padding: 10px; height: 45px; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div id="maxi-fab" onclick="openChat()">
    <img src="cat_full.png" alt="Maxi Pie Icon">
</div>

<div id="chat-modal">
    <div class="chat-container">
        <div class="chat-header">
            <img src="cat_full.png" alt="Maxi Pie">
            <div>
                <h3>Maxi Pie</h3>
                <small style="color:#10b981">Grade 7 Science Chommie 🇿🇦</small>
            </div>
            <button class="close-btn" onclick="closeChat()">×</button>
        </div>
        <div id="messages" class="chat-messages">
            <div class="msg bot">Sho! I'm <strong>Maxi Pie</strong> 🐾, your Grade 7 science sidekick! Ask me about cells, atoms, reactions, electricity, magnetism, the atmosphere, and more!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask me something, chommie..." onkeypress="if(event.key==='Enter') handleSend()">
            <button onclick="handleSend()" class="send-btn">Send</button>
        </div>
    </div>
</div>

<script>
// ─────────────────────────────────────────
// GLOBALS
let knowledgeBase = [];
let fuse = null;
let pdfReady = false;
let pdfDocRef = null;     // Keep reference to loaded PDF
let USER_MEMORY = {       // Memory system for topics
    topicsAsked: {},
    weakTopics: {},
    lastTopic: null
};

// ─────────────────────────────────────────
// EXPANDED PERSONALITY
const EXTRA_PERSONALITY = {
    praise: [
        "🔥 That’s it!",
        "💯 Nailed it chommie!",
        "Aweh 😎 you’re getting sharp now!",
        "Yoh that’s clever hey!"
    ],
    encouragement: [
        "Don’t stress chommie 💪 we build it step by step",
        "You’re close 👀 adjust it slightly",
        "Eish 😅 this one confuses everyone"
    ],
    hints: [
        "📚 Try asking about <b>rocks</b>, <b>fossils</b>, <b>electricity</b>",
        "📘 You can ask for definitions or examples",
        "🧪 Say <b>quiz me</b> to test yourself",
        "📖 Ask anything from the textbook 😎"
    ]
};

// ─────────────────────────────────────────
// PDF LOAD
async function initPDF() {
    const url = "resources/logic7.pdf"; // Updated PDF reference
    try {
        const pdf = await pdfjsLib.getDocument(url).promise;
        pdfDocRef = pdf;

        for (let i = 1; i <= pdf.numPages; i++) {
            let page = await pdf.getPage(i);
            let txt = await page.getTextContent();
            let str = txt.items.map(s => s.str).join(" ");

            knowledgeBase.push({ text: str });

            // Show loading message for each page
            addMessage('bot', `📖 Loading page ${i} of ${pdf.numPages}...`);
        }

        fuse = new Fuse(knowledgeBase, { keys: ["text"], threshold: 0.3 });

        pdfReady = true;

        // Final message when loading is complete
        addMessage('bot', "📚 Textbook loaded! Ask me anything 🔬");
    } catch (error) {
        console.error("Error loading PDF:", error);
        addMessage('bot', "An error occurred while loading the textbook 😅");
    }
}

// ─────────────────────────────────────────
// ADD MESSAGE FUNCTION
function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = text;

    const box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// ─────────────────────────────────────────
// HANDLE USER INPUT
function handleSend() {
    const input = document.getElementById("userInput");
    const query = input.value.trim();
    if (!query) return;

    addMessage('user', query);
    input.value = "";

    if (!pdfReady) {
        addMessage('bot', "Still loading 😅");
        return;
    }

    setTimeout(() => route(query), 300);
}

// ─────────────────────────────────────────
// ROUTE USER QUERY
function route(query) {
    trackTopic(query); // Track the topics asked
    const results = fuse.search(query);

    if (results.length > 0) {
        const response = results[0].item.text; // Get the best matching text
        addMessage('bot', response);
    } else {
        addMessage('bot', "Eish 😅 I couldn't find anything on that. Try asking about cells, reactions, or electricity!");
    }

    // Personality inserts
    if (Math.random() < 0.5) {
        setTimeout(() => addMessage('bot', rand(EXTRA_PERSONALITY.praise)), 800);
    }
}

// ─────────────────────────────────────────
// MEMORY TRACKING FUNCTION
function trackTopic(query) {
    const topics = ["rock", "fossil", "electric", "cell", "reaction", "atom"];

    topics.forEach(t => {
        if (query.includes(t)) {
            USER_MEMORY.topicsAsked[t] = (USER_MEMORY.topicsAsked[t] || 0) + 1;
            USER_MEMORY.lastTopic = t;
        }
    });
}

// ─────────────────────────────────────────
// HELPER FUNCTION FOR RANDOM ITEMS
function rand(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

// ─────────────────────────────────────────
// INITIALIZATION
window.onload = initPDF; // Initialize PDF on window load
</script>

</body>
</html>
