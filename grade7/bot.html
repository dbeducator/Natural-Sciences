// ================================================================
// PDF LOADING
// ================================================================
async function renderPage(bookPage, scale) {
    scale = scale || 1.8;
    const cacheKey = bookPage + '_' + scale;
    if (PAGE_CACHE[cacheKey]) return PAGE_CACHE[cacheKey];
    if (!pdfDocRef) return null;
    const pdfPage = bookPageToPdf(bookPage);
    if (pdfPage < 1 || pdfPage > pdfDocRef.numPages) return null;
    try {
        const page   = await pdfDocRef.getPage(pdfPage);
        const vp     = page.getViewport({ scale: scale });
        const canvas = document.createElement('canvas');
        canvas.width  = vp.width;
        canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        PAGE_CACHE[cacheKey] = dataUrl;
        return dataUrl;
    } catch(e) {
        console.warn('Render failed p.' + bookPage, e);
        return null;
    }
}

}

async function loadPDF() {
    const url = 'resources/logic7.pdf';
    let pdf;
    try {
        pdf = await pdfjsLib.getDocument(url).promise;
    } catch(e) {
        addMessage('bot', '&#x26A0;&#xFE0F; Could not load <b>resources/logic7.pdf</b>. Make sure the file is in the right folder and the path is correct.');
        return;
    }
    pdfDocRef = pdf;
    pdfReady  = true;

    // Background pre-render first page of each topic at low res
    setTimeout(function() {
        var topics = Object.values(TOPIC_PAGE_MAP);
        topics.forEach(function(r, i) {
            setTimeout(function() { renderPage(r.start, 1.0); }, i * 1000);
        });
    }, 4000);

    // Ready message
    const rm = document.createElement('div');
    rm.className = 'msg bot';
    rm.innerHTML =
        'Sho! &#x1F4DA; Textbook ready! <b>' + pdf.numPages + ' pages</b> loaded. Tap a topic to start chommie!<br><br>' +
        '<span data-action="menu"     class="chip" style="display:inline-block;margin:3px;">&#x1F4CB; Topic Menu</span>' +
        '<span data-action="glossary" class="chip" style="display:inline-block;margin:3px;">&#x1F4DA; Glossary</span>' +
        '<span data-action="quiz"     class="chip" style="display:inline-block;margin:3px;">&#x1F9EA; Quiz me</span>';
    msgBox.appendChild(rm);
    msgBox.scrollTop = msgBox.scrollHeight;

    setTimeout(showTopicMenu, 700);

    if (pendingQuery) {
        var q = pendingQuery; pendingQuery = null;
        setTimeout(function() { handlePDFQuery(q, 'answer'); }, 500);
    }
}

            imageBlocks.push({
                type: 'image',
                source: { type: 'base64', media_type: 'image/jpeg', data: dataUrl.split(',')[1] }
            });
        }
    }

    if (imageBlocks.length === 0) {
        return 'Eish &#x1F605; I could not render the textbook pages. Check that <b>resources/logic7.pdf</b> is correct and try again chommie!';
    }

    var content = imageBlocks.concat([{ type: 'text', text: question || 'Explain what is on these textbook pages.' }]);

    try {
        var response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1024,
                system: systemMap[mode] || systemMap.answer,
                messages: [{ role: 'user', content: content }]
            })
        });
        var data = await response.json();
        if (data.content && data.content[0] && data.content[0].text) {
            return data.content[0].text;
        }
        if (data.error) {
            console.error('API error:', data.error);
            if (data.error.type === 'authentication_error') {
                return '&#x1F511; <b>API key error.</b> Please check your Anthropic API key in the code. Get one free at <b>console.anthropic.com</b>';
            }
            return 'API error: ' + data.error.message;
        }
        return 'Eish &#x1F605; something went wrong. Try again chommie!';
    } catch(e) {
        console.error('Fetch error:', e);
        return 'Eish, could not reach the AI &#x1F4F5; Check your internet connection and try again!';
    }
}

// ================================================================
// FIND PAGES FOR A QUERY
// ================================================================
function findPagesForQuery(q) {
    var qLower = q.toLowerCase();

    // Direct topic name match
    for (var topic in TOPIC_PAGE_MAP) {
        var tLower = topic.toLowerCase();
        if (qLower.includes(tLower) || tLower.includes(qLower)) {
            return { pages: [TOPIC_PAGE_MAP[topic].start, TOPIC_PAGE_MAP[topic].start + 1], topic: topic };
        }
    }

    // Keyword table match (longest match wins)
    var best = null;
    var bestLen = 0;
    for (var i = 0; i < KEYWORD_TOPIC.length; i++) {
        var entry = KEYWORD_TOPIC[i];
        if (qLower.includes(entry.key) && entry.key.length > bestLen) {
            best = entry.topic;
            bestLen = entry.key.length;
        }
    }
    if (best) {
        return { pages: [TOPIC_PAGE_MAP[best].start, TOPIC_PAGE_MAP[best].start + 1], topic: best };
    }

    return null;
}

// ================================================================
// MAIN QUERY HANDLER
// ================================================================
async function handlePDFQuery(q, mode) {
    mode = mode || 'answer';

    if (!pdfReady || !pdfDocRef) {
        if (!pendingQuery) pendingQuery = q;
        addMessage('bot', "Eish, still loading the textbook &#x1F4DA; I'll answer as soon as it's ready chommie!");
        return;
    }

    var found = findPagesForQuery(q);
    if (!found) {
        addMessage('bot',
            "Eish &#x1F605; I'm not sure which part of the textbook covers that. Try asking about a specific topic like <b>biosphere</b>, <b>acids</b>, <b>periodic table</b>, <b>energy</b> or <b>biodiversity</b>. " +
            "Or tap <b>Topic Menu</b> to browse all topics chommie!"
        );
        showChips(q);
        return;
    }

    lastTopic = found.topic;
    lastPages = found.pages;

    // Show page images
    found.pages.forEach(function(pg, idx) {
        setTimeout(function() { showPageInChat(pg, found.topic); }, idx * 400);
    });

    // Thinking indicator
    var thinkEl = addThinking();
    sendBtn.disabled = true;

    // Ask Claude
    var answer = await askClaude(q, found.pages, mode);

    thinkEl.remove();
    sendBtn.disabled = false;

    var ansDiv = document.createElement('div');
    ansDiv.className = 'msg bot';
    ansDiv.innerHTML =
        '<div class="answer-box">' + answer + '</div>' +
        '<div class="page-ref">&#x1F4C4; ' + found.topic + ' &nbsp;&#x2022;&nbsp; pp. ' + found.pages.join(', ') + '</div>';
    msgBox.appendChild(ansDiv);
    msgBox.scrollTop = msgBox.scrollHeight;

    setTimeout(function() { showChips(q); }, 300);
}

// ================================================================
// CHIP ACTIONS
// ================================================================
async function chipAction(action, topic) {
    var labels = { explain:'Explain it simply', example:'Give a real-life example', deeper:'Go deeper', quiz:'Quiz me' };
    addMessage('user', labels[action] || action);

    if (action === 'quiz') { await doQuiz(); return; }

    if (!lastTopic || lastPages.length === 0) {
        addMessage('bot', "Eish &#x1F605; ask me a topic question first chommie, then I can do that!");
        return;
    }

    sendBtn.disabled = true;
    var thinkEl = addThinking();

    var contextQ = 'Topic: ' + lastTopic;
    var answer = await askClaude(contextQ, lastPages, action);

    thinkEl.remove();
    sendBtn.disabled = false;

    addMessage('bot', '<div class="answer-box">' + answer + '</div>');
    setTimeout(function() { showChips(topic); }, 300);
}

// ================================================================
// QUIZ
// ================================================================
async function doQuiz() {
    var topicForQuiz = lastTopic;
    var pagesForQuiz = lastPages.slice();

    if (!topicForQuiz) {
        // Pick random topic
        var topics = Object.keys(TOPIC_PAGE_MAP);
        topicForQuiz = topics[Math.floor(Math.random() * topics.length)];
        pagesForQuiz = [TOPIC_PAGE_MAP[topicForQuiz].start];
    }

    sendBtn.disabled = true;
    var thinkEl = addThinking('Generating a quiz question from the textbook... &#x1F9EA;');
    var answer = await askClaude('Create a quiz question about ' + topicForQuiz, pagesForQuiz, 'quiz');
    thinkEl.remove();
    sendBtn.disabled = false;

    addMessage('bot', '<div class="answer-box">' + answer + '</div>');
    setTimeout(function() { showChips(topicForQuiz); }, 300);
}

// ================================================================
// GLOSSARY
// ================================================================
function showGlossary() {
    var letters = {};
    Object.entries(TOPIC_OVERVIEWS).forEach(function(pair) {
        var topic = pair[0]; var ov = pair[1];
        ov.keywords.forEach(function(kw) {
            var l = kw[0].toUpperCase();
            if (!letters[l]) letters[l] = [];
            if (!letters[l].find(function(e){ return e.kw === kw; })) {
                letters[l].push({ kw:kw, topic:topic, page:TOPIC_PAGE_MAP[topic].start });
            }
        });
    });

    var sortedLetters = Object.keys(letters).sort();
    var html = '&#x1F4DA; <b>Key Terms - Grade 7 Science</b><br><br>';

    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;">';
    sortedLetters.forEach(function(l) {
        html += '<span style="background:#e8f5f0;color:#0a6e50;border:1px solid #10b981;border-radius:10px;padding:3px 9px;font-size:12px;cursor:pointer;font-weight:600;">' + l + '</span>';
    });
    html += '</div>';

    sortedLetters.forEach(function(l) {
        html += '<b style="color:#10b981;font-size:14px;">' + l + '</b><br>';
        letters[l].sort(function(a,b){ return a.kw.localeCompare(b.kw); }).forEach(function(e) {
            html += '<span onclick="handleTopicClick(\'' + e.topic.replace(/'/g,"\\'") + '\')" ' +
                'style="display:inline-block;padding:3px 10px;margin:2px 2px 2px 0;background:#f0f4f8;border-radius:10px;font-size:13px;cursor:pointer;color:#0a6e50;">' +
                e.kw + ' <span style="color:#aaa;font-size:11px;">p.' + e.page + '</span></span>';
        });
        html += '<br>';
    });
    addMessage('bot', html);
}

// ================================================================
// TOPIC CLICK
// ================================================================
async function handleTopicClick(topic) {
    addMessage('user', topic);
    var ov  = TOPIC_OVERVIEWS[topic];
    var rng = TOPIC_PAGE_MAP[topic];
    if (!ov || !rng) { handlePDFQuery(topic, 'answer'); return; }

    // Show topic intro with clickable keywords
    var html = ov.emoji + ' <b>' + topic + '</b> <span style="font-size:11px;color:#888;">' + ov.strand + '</span><br><br>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:5px;">';
    ov.keywords.forEach(function(kw) {
        html += '<span onclick="handlePDFQuery(\'' + kw.replace(/'/g,"\\'") + '\',\'answer\')" ' +
            'style="background:#e8f5f0;color:#0a6e50;border:1.5px solid #10b981;border-radius:14px;padding:4px 11px;font-size:12px;cursor:pointer;font-weight:600;">' + kw + '</span>';
    });
    html += '</div>';
    addMessage('bot', html);

    lastTopic = topic;
    lastPages = [rng.start, rng.start + 1];

    // Show first page
    showPageInChat(rng.start, topic);

    sendBtn.disabled = true;
    var thinkEl = addThinking('Reading the textbook about <b>' + topic + '</b>... &#x1F4D6;');

    var answer = await askClaude(
        'Give me a clear overview of ' + topic + ' as shown on these textbook pages. Include the main concepts and key terms.',
        lastPages, 'answer'
    );
    thinkEl.remove();
    sendBtn.disabled = false;

    var ansDiv = document.createElement('div');
    ansDiv.className = 'msg bot';
    ansDiv.innerHTML = '<div class="answer-box">' + answer + '</div>';
    msgBox.appendChild(ansDiv);
    msgBox.scrollTop = msgBox.scrollHeight;

    setTimeout(function() { showChips(topic); }, 300);
}

const SA_GREETINGS = ["hi","hello","hey","aweh","heita","howzit","sho","yo","sup"];
const CHAT_WORDS   = new Set(["ok","okay","cool","nice","good","great","wow","sure","yes","no","nah","maybe","thanks","thank you","lol","haha","lekker","alright","yebo","sharp","eish","hayi","yoh","sho","ready","got it","makes sense","i see"]);

const REPLIES_GREET   = ["Aweh chommie! &#x1F44B; What topic are we tackling today?","Heita! &#x1F60E; Ready to learn? Pick a topic from the menu!","Yoh sharp! &#x1F525; What are we studying today?","Howzit! &#x1F603; Brain switched on? Let's go!"];
const REPLIES_HOWRU   = ["Sharp sharp! &#x1F4AA; Brain fully charged and ready!","Lekker chommie &#x1F60E; better than Eskom on a good day!","Yoh I'm buzzing &#x26A1; ready to help you smash this science!"];
const REPLIES_CHAT    = ["Lekker! &#x1F4AA; Tap a topic from the menu above or ask me anything!","Sharp! &#x1F525; What topic shall we cover?","Aweh &#x1F60E; what are we learning today?"];

function handleSend() {
    var input = document.getElementById('userInput');
    var query = input.value.trim();
    if (!query || sendBtn.disabled) return;
    input.value = '';
    addMessage('user', query);

    var ql = query.toLowerCase().trim();

    // Menu / glossary / quiz
    if (['menu','topics','topic menu','show topics','contents'].includes(ql)) { showTopicMenu(); return; }
    if (['glossary','words','terms','terminology','show glossary'].includes(ql)) { showGlossary(); return; }
    if (ql.includes('quiz') || ql.includes('test me') || ql.includes('ask me a question')) { doQuiz(); return; }

    // Named people
    if (ql.includes('leslee')) {
        addMessage('bot', "Yoh &#x1F604; Leslee is the <b>visionary behind this whole platform</b> - Coach L Academy, this bot, all of it built from her belief that young people deserve better. &#x1F331;");
        return;
    }
    if (ql.includes('linda'))              { addMessage('bot', "Yoh Linda &#x1F604; he's the one who'll remind you to focus! If you slack, he'll call you out &#x1F602;"); return; }
    if (ql.includes('lexi')||ql.includes('alexis')) { addMessage('bot', "Lexi &#x1F604; sharp as anything - reads once and just <em>gets</em> it. First to finish, always helps the next person. Good energy! &#x26A1;"); return; }
    if (ql.includes('sadee'))              { addMessage('bot', "Yoh Sadee &#x1F64F; spiritually grounded, deeply compassionate. Makes the whole room calmer. Sweet soul. &#x1F49B;"); return; }

    // Greetings
    if (SA_GREETINGS.some(function(g){ return ql === g || ql.startsWith(g+' ') || ql.startsWith(g+'!'); })) {
        addMessage('bot', rand(REPLIES_GREET)); return;
    }
    if (ql.includes('how are you') || ql.includes("how's it") || ql === 'howzit') {
        addMessage('bot', rand(REPLIES_HOWRU)); return;
    }
    if (CHAT_WORDS.has(ql)) {
        addMessage('bot', rand(REPLIES_CHAT)); return;
    }

    // Science question - use Claude Vision
    handlePDFQuery(query, 'answer');
}

document.addEventListener('click', function(e) {
    var el = e.target;
    for (var i = 0; i < 6; i++) {
        if (!el || el === document.body) break;
        if (el.dataset && el.dataset.action) {
            if (el.dataset.action === 'menu')     { showTopicMenu(); return; }
            if (el.dataset.action === 'glossary') { showGlossary();  return; }
            if (el.dataset.action === 'quiz')     { doQuiz();        return; }
        }
        el = el.parentElement;
    }
});
