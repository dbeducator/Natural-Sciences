<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxi Pie - Grade 7 Science Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0a1a33;
            margin: 0;
            height: 100%;
            overflow: hidden;
            visibility: hidden;
        }
        #chat-modal {
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(7, 7, 12, 0.95);
            z-index: 1000;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            max-width: 500px;
            margin: auto;
            background: #f0f4f8;
            visibility: hidden;
        }
        .chat-header {
            background: #0a1a33;
            padding: 15px;
            display: flex;
            align-items: center;
            color: white;
            border-bottom: 3px solid #10b981;
        }
        .close-btn {
            margin-left: auto;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 16px;
        }
        .bot {
            background: white;
            color: #333;
            align-self: flex-start;
        }
        .user {
            background: #10b981;
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: white;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 25px;
            border: 1px solid #ccc;
            outline: none;
        }
        .send-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px;
            height: 45px;
            border-radius: 25px;
            cursor: pointer;
        }
        #maxi-fab {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
        }
        #maxi-fab img {
            width: 85%;
        }
    </style>
</head>
<body>

<div id="maxi-fab" onclick="openChat()"><img src="cat_full.png" alt="Chat with Maxi Pie"></div>

<div id="chat-modal" style="display: none;">
    <div class="chat-container">
        <div class="chat-header">
            <h3>Maxi Pie</h3>
            <button class="close-btn" onclick="closeChat()">×</button>
        </div>
        <div id="messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask me something, chommie..." onkeypress="if(event.key==='Enter') handleSend()">
            <button onclick="handleSend()" class="send-btn">Send</button>
        </div>
    </div>
</div>

<script>
    let conversationMemory = [];
    let pdfDocRef = null; // Reference to the loaded PDF document
    let pdfContent = []; // Array to store extracted text from the PDF
    let fuse; // Fuse.js instance for searching

    // Open chat
    function openChat() {
        document.getElementById('chat-modal').style.display = 'flex';
        document.querySelector('.chat-container').style.visibility = 'visible';
        document.body.style.visibility = 'visible'; // Show the body once the chat opens
        addMessage('bot', 'Sho! I\'m Maxi Pie 🐾! Ask me anything about cells, atoms, reactions, or just say hi, chommie!');
    }

    // Close chat
    function closeChat() {
        document.getElementById('chat-modal').style.display = 'none';
        document.body.style.visibility = 'hidden'; // Hide the body once the chat closes
    }

    // Add message to chat
    function addMessage(type, content) {
        const messagesContainer = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.textContent = content;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight; // Scroll to the bottom
    }

    // Handle message sending
    function handleSend() {
        const userInput = document.getElementById('userInput');
        const query = userInput.value.trim();
        if (query) {
            addMessage('user', query);
            userInput.value = '';
            processQuery(query);
        }
    }

    // Process user query
    async function processQuery(query) {
        const intent = detectIntent(query);
        let response = '';

        // Customized responses for greetings
        if (/(hi|hello|how are you|sup)/i.test(query)) {
            response = "Hey there, chommie! 🇿🇦 How can I help you with science today?";
        } else if (/(thank you|thanks)/i.test(query)) {
            response = "You’re welcome, chommie! If you have more questions, just ask!";
        } else {
            response = await searchPDF(query);
        }

        addMessage('bot', response);
        remember(query, response);
    }

    // Detect intent of the user's query
    function detectIntent(query) {
        const lowerQuery = query.toLowerCase();
        if (/(define|what is|what are)/.test(lowerQuery)) return "definition";
        if (/(explain|how does|how is)/.test(lowerQuery)) return "explanation";
        if (/(example|give me an)/.test(lowerQuery)) return "example";
        if (/quiz/.test(lowerQuery)) return "quiz";
        return "general";
    }

    // Remember conversation history
    function remember(query, answer) {
        conversationMemory.push({ query, answer });
        if (conversationMemory.length > 5) conversationMemory.shift(); // Keep last 5
    }

    // Load PDF and prepare for queries
    async function loadPDF(url) {
        try {
            const pdfDoc = await pdfjsLib.getDocument(url).promise;
            const totalPages = pdfDoc.numPages;

            for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                const page = await pdfDoc.getPage(pageNum);
                const textContent = await page.getTextContent();
                let text = textContent.items.map(item => item.str).join(' ');
                pdfContent.push(text);
            }

            fuse = new Fuse(pdfContent, { 
                includeScore: true,
                threshold: 0.3, // Adjust threshold for matching relevance
            });

            addMessage('bot', 'The science book is ready! You can ask me questions about its content.');
        } catch (error) {
            addMessage('bot', 'Unfortunately, I could not load the science book. Please try again later.');
            console.error('Error loading PDF:', error);
        }
    }

    // Search PDF content for the user's query
    async function searchPDF(query) {
        const results = fuse.search(query); // Use Fuse.js to search the extracted text
        if (results.length > 0) {
            return `I found some information: "${results[0].item}".`;
        } else {
            return "Sorry, I couldn't find any relevant information in the science book.";
        }
    }

    // Load the specific PDF from the resources folder
    document.addEventListener('DOMContentLoaded', () => {
        document.body.style.visibility = 'visible';
        loadPDF('resources/logic7.pdf'); // Load the PDF from the specified path
    });

    // Touch handling
    document.addEventListener('touchend', function(e) {
        const touch = e.changedTouches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && el.dataset) {
            if (el.dataset.kwsearch) {
                handleSend();
            }
        }
    });

</script>

</body>
</html>
