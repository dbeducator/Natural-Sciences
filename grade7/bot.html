<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxi Pie - Grade 7 Science Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0a1a33;
            margin: 0;
            height: 100%;
            overflow: hidden;
            visibility: hidden;
        }
        #chat-modal {
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(7, 7, 12, 0.95);
            z-index: 1000;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            max-width: 500px;
            margin: auto;
            background: #f0f4f8;
            visibility: hidden;
        }
        .chat-header {
            background: #0a1a33;
            padding: 15px;
            display: flex;
            align-items: center;
            color: white;
            border-bottom: 3px solid #10b981;
        }
        .close-btn {
            margin-left: auto;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 16px;
        }
        .bot {
            background: white;
            color: #333;
            align-self: flex-start;
        }
        .user {
            background: #10b981;
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: white;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 25px;
            border: 1px solid #ccc;
            outline: none;
        }
        .send-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px;
            height: 45px;
            border-radius: 25px;
            cursor: pointer;
        }
        #maxi-fab {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
        }
        #maxi-fab img {
            width: 85%;
        }
    </style>
</head>
<body>

<div id="maxi-fab" onclick="openChat()"><img src="cat_full.png" alt="Chat with Maxi Pie"></div>

<div id="chat-modal" style="display: none;">
    <div class="chat-container">
        <div class="chat-header">
            <h3>Maxi Pie</h3>
            <button class="close-btn" onclick="closeChat()">×</button>
        </div>
        <div id="messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask me something, chommie..." onkeypress="if(event.key==='Enter') handleSend()">
            <button onclick="handleSend()" class="send-btn">Send</button>
        </div>
    </div>
</div>

<script>
    let conversationMemory = [];

    function openChat() {
        document.getElementById('chat-modal').style.display = 'flex';
        document.querySelector('.chat-container').style.visibility = 'visible';
        document.body.style.visibility = 'visible'; // Show the body once the chat opens
    }

    function closeChat() {
        document.getElementById('chat-modal').style.display = 'none';
        document.body.style.visibility = 'hidden'; // Hide the body once the chat closes
    }

    function addMessage(type, content) {
        const messagesContainer = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.textContent = content;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight; // Scroll to the bottom
    }

    function handleSend() {
        const userInput = document.getElementById('userInput');
        const query = userInput.value.trim();
        if (query) {
            addMessage('user', query);
            userInput.value = '';
            processQuery(query);
        }
    }

    function processQuery(query) {
        const intent = detectIntent(query);
        let response = '';

        // Implement responses based on detected intent
        switch (intent) {
            case 'definition':
                response = `Definition of "${query}": [insert definition here]`;
                break;
            case 'explanation':
                response = `Explanation for "${query}": [insert explanation here]`;
                break;
            case 'example':
                response = `Example related to "${query}": [insert example here]`;
                break;
            case 'quiz':
                response = `Quiz on "${query}": [insert quiz here]`;
                break;
            default:
                response = `I can't help with "${query}" right now.`;
                break;
        }

        addMessage('bot', response);
        remember(query, response);
    }

    function detectIntent(query) {
        const lowerQuery = query.toLowerCase();
        if (/(define|what is|what are)/.test(lowerQuery)) return "definition";
        if (/(explain|how does|how is)/.test(lowerQuery)) return "explanation";
        if (/(example|give me an)/.test(lowerQuery)) return "example";
        if (/quiz/.test(lowerQuery)) return "quiz";
        return "general";
    }

    function remember(query, answer) {
        conversationMemory.push({ query, answer });
        if (conversationMemory.length > 5) conversationMemory.shift(); // Keep last 5
    }

    // Touch handling
    document.addEventListener('touchend', function(e) {
        const touch = e.changedTouches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && el.dataset) {
            if (el.dataset.kwsearch) {
                handleSend();
            }
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        document.body.style.visibility = 'visible';
    });
</script>

</body>
</html>
