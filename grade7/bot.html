<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Maxi Pie - Grade 7 Science Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker immediately — must happen before any getDocument() call
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
        .page-img { width:100%; border-radius:10px; margin-top:8px; border:1px solid #ddd; display:block; cursor:zoom-in; }
        .page-img-wrap { position:relative; background:#f5f5f5; border-radius:10px; margin-top:8px; min-height:60px; }
        .page-img-label { font-size:11px; color:#aaa; text-align:right; padding:2px 6px; }
        /* Image zoom modal */
        #img-zoom-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        #img-zoom-modal.open { display:flex; }
        #img-zoom-modal img { max-width:96%; max-height:85vh; border-radius:8px; object-fit:contain; touch-action:pinch-zoom; }
        #img-zoom-close { position:absolute; top:16px; right:16px; background:#ef4444; color:white; border:none; border-radius:50%; width:40px; height:40px; font-size:20px; font-weight:bold; cursor:pointer; z-index:10000; }
        #img-zoom-label { color:#ccc; font-size:13px; margin-top:10px; }
    </style>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        html { height: 100%; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background:#0a1a33; height: 100%; margin:0; overflow:hidden; }

        #maxi-fab { position:fixed; bottom:25px; left:25px; width:60px; height:60px; background:#10b981; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.5); z-index:999; border:3px solid #fff; transition:opacity 0.2s; }
        #maxi-fab img { width:85%; height:85%; border-radius:50%; object-fit: cover; }
        #maxi-fab.hidden { opacity:0; pointer-events:none; }

        #chat-modal { display:flex; flex-direction:column; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(7, 7, 12, 0.95); z-index:1000; }
        .chat-container { display:flex; flex-direction:column; flex:1; width:100%; max-width:500px; margin:0 auto; background:#f0f4f8; visibility:visible; min-height:0; overflow:hidden; }

        .chat-header { background:#0a1a33; padding:15px; display:flex; align-items:center; gap:12px; color:white; border-bottom:3px solid #10b981; }
        .chat-header img { width:45px; height:45px; border-radius:50%; border:2px solid #10b981; }
        .close-btn { margin-left:auto; background:#ef4444; color:white; border:none; border-radius:50%; width:35px; height:35px; font-weight:bold; cursor:pointer; }

        .chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:15px; min-height:0; }
        .msg { max-width:85%; padding:12px 16px; border-radius:18px; line-height:1.4; font-size:16px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        .bot { align-self:flex-start; background:white; color:#333; border-bottom-left-radius:2px; }
        .user { align-self:flex-end; background:#10b981; color:white; border-bottom-right-radius:2px; }

        .chat-input-area { padding:15px; background:white; display:flex; gap:10px; border-top:1px solid #ddd; flex-shrink:0; }
        .chat-input-area input { flex:1; padding:12px; border-radius:25px; border:1px solid #ccc; outline:none; font-size:16px; color:#333; background:#fff; -webkit-text-fill-color:#333; }
        .send-btn { background:#10b981; color:white; border:none; padding:10px; height:45px; border-radius:25px; font-weight:bold; cursor:pointer; }

        /* Suggestion chips */
        .chip-row { display:flex; flex-wrap:wrap; gap:8px; padding:6px 0 2px; }
        .chip {
            background:#e8f5f0; color:#0a6e50; border:1.5px solid #10b981;
            border-radius:20px; padding:7px 16px; font-size:14px; font-weight:600;
            cursor:pointer; transition:background 0.15s, transform 0.1s; white-space:nowrap;
        }
        .chip:hover { background:#10b981; color:white; transform:scale(1.04); }
        .chip:active { transform:scale(0.97); }


    </style>
</head>
<body>

<div id="maxi-fab" onclick="openChat()"><img src="cat_full.png"></div>

<div id="chat-modal">
    <div class="chat-container">
        <div class="chat-header">
            <img src="cat_full.png">
            <div><h3>Maxi Pie</h3><small style="color:#10b981">Grade 7 Science Chommie 🇿🇦</small></div>
            <button class="close-btn" onclick="closeChat()">×</button>
        </div>
        <div id="messages" class="chat-messages">
            <div class="msg bot">Sho! I'm <strong>Maxi Pie</strong> 🐾, your Grade 7 science sidekick! Ask me about the biosphere, biodiversity, reproduction, acids, energy, electricity, and more!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask me something, chommie..."
                onkeypress="if(event.key==='Enter') handleSend()"
                onfocus="setTimeout(function(){ document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight; }, 400)">
            <button onclick="handleSend()" class="send-btn">Send</button>
        </div>
    </div>
</div>

<!-- Image zoom modal -->
<div id="img-zoom-modal" onclick="closeZoom(event)">
    <button id="img-zoom-close" onclick="closeZoom()">×</button>
    <img id="img-zoom-src" src="">
    <div id="img-zoom-label"></div>
</div>



<script>
    let knowledgeBase = [];
    let fuse = null;
    let personalInquiryCount = 0;
    let pdfReady = false;
    let pendingQuery = null;   // Queue one question asked before PDF is ready

    // Page image cache — rendered lazily from PDF
    const PAGE_IMAGES = {};   // page number → base64 data URL
    let pdfDocRef = null;     // keep reference to loaded PDF

    async function renderPageImage(pageNum) {
        if (PAGE_IMAGES[pageNum]) return PAGE_IMAGES[pageNum];
        if (!pdfDocRef) return null;
        try {
            const page = await pdfDocRef.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
            PAGE_IMAGES[pageNum] = dataUrl;
            return dataUrl;
        } catch(e) {
            console.warn('Page render failed for page', pageNum, e);
            return null;
        }
    }

    // Show a page image in the chat for a given page number
    function showPageImage(pageNum, label) {
        if (!pageNum || pageNum < 1 || !pdfDocRef) return;
        const uid = 'pg' + pageNum + '_' + Date.now();  // unique ID avoids collisions
        const lbl = `📄 Textbook p.${pageNum}${label ? ' · ' + label : ''}`;

        const div = document.createElement('div');
        div.className = 'msg bot';
        div.innerHTML = `<div class="page-img-wrap" id="${uid}">
            <div class="page-img-label">${lbl}</div>
            <div style="padding:10px;color:#aaa;font-size:13px;">⏳ Rendering p.${pageNum}...</div>
        </div>`;
        const box = document.getElementById('messages');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;

        renderPageImage(pageNum).then(dataUrl => {
            const wrap = document.getElementById(uid);
            if (!wrap) return;
            if (dataUrl) {
                // Store in cache and use page number reference — avoids large data attributes
                PAGE_IMAGES[pageNum] = dataUrl;
                const imgEl = document.createElement('img');
                imgEl.src = dataUrl;
                imgEl.className = 'page-img';
                imgEl.title = 'Tap to zoom';
                imgEl.dataset.zoompage = pageNum;
                imgEl.dataset.zoomlabel = `p.${pageNum}${label ? ' · '+label : ''}`;
                wrap.innerHTML = `<div class="page-img-label">${lbl} <span style="color:#10b981;font-size:11px;">🔍 tap to zoom</span></div>`;
                wrap.appendChild(imgEl);
            } else {
                wrap.innerHTML = `<div class="page-img-label" style="color:#e88;">📄 ${lbl} — image unavailable</div>`;
            }
            box.scrollTop = box.scrollHeight;
        });
    }

    // ── Chip state ────────────────────────────────────────────────────────
    let lastQuery = '';
    let lastRawAnswer = '';

    // Teacher-mode breakdown (called by chip only)
    function teacherExplain(rawText, query) {
        const sections = extractTextbookSections(rawText);
        let html = `📘 <b>Let's break it down chommie 👇</b><br><br>`;

        // Use paragraph extraction (works on flat PDF text)
        const kws = (query||lastQuery).toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w=>w.length>2);
        const best = sections.paragraphs
            .filter(p => kws.some(k => p.toLowerCase().includes(k)))
            .slice(0, 3);
        const display = best.length > 0 ? best : sections.paragraphs.slice(0, 2);
        if (display.length > 0) {
            html += `🧠 <b>What the textbook says:</b><br><br>`;
            html += display.map(s => `📌 ${s}`).join('<br><br>') + '<br><br>';
        }
        // Topic-aware SA example
        const tq = (query || lastQuery || '').toLowerCase();
        const saTeach = tq.includes('rock') || tq.includes('sediment') ? "In the <b>Karoo</b>, flat-topped koppies are layers of sediment compressed over millions of years — sedimentary rocks right there! 🪨"
            : tq.includes('fossil') ? "The <b>Cradle of Humankind</b> near Joburg and the <b>Karoo</b> are world-famous SA fossil sites — ancient life right under our feet! 🦕"
            : tq.includes('electr') || tq.includes('circuit') || tq.includes('battery') ? "The <b>Eskom power grid</b> is one giant circuit — electricity flows from coal stations through pylons and cables to your home! ⚡"
            : tq.includes('skeleton') || tq.includes('bone') || tq.includes('ligament') ? "Feel your own spine, ribs and skull right now — that's your endoskeleton doing its job! 🦴"
            : tq.includes('metal') || tq.includes('iron') || tq.includes('steel') ? "SA is one of the world's top mining countries — gold, platinum, iron ore, coal. Metals literally built this country! 🔩"
            : tq.includes('fuel') || tq.includes('coal') || tq.includes('energy') || tq.includes('solar') || tq.includes('renewable') ? "SA gets most power from <b>coal</b> at Medupi and Kusile, but solar farms in the Northern Cape are growing fast! ☀️🔥"
            : tq.includes('food chain') || tq.includes('producer') || tq.includes('consumer') ? "In <b>Kruger National Park</b> — grass → impala → lion → vulture. That's a real SA food chain! 🌿"
            : tq.includes('season') || tq.includes('rotation') || tq.includes('earth move') ? "When it's summer in Joburg ☀️, it's winter in London ❄️ — Earth's tilt causes this every year!"
            : tq.includes('soil') || tq.includes('topsoil') || tq.includes('bedrock') ? "Dig in any SA garden — dark topsoil first, then orange-red subsoil, then hard bedrock. Layers just like the textbook! 🌍"
            : tq.includes('life cycle') || tq.includes('metamorpho') || tq.includes('frog') ? "Watch frogs near any SA dam — egg → tadpole → froglet → frog. A full life cycle in one season! 🐸"
            : tq.includes('plant') || tq.includes('photosyn') ? "Every tree lining a SA street is doing photosynthesis right now — turning sunlight into food and oxygen for free! 🌳"
            : "In South Africa you can see this everywhere — from the Karoo to Soweto to the ocean. Science is all around us! 🌍";
        html += `👀 <b>Real-life SA example:</b> ${saTeach}`;

        if (sections.keyQuestions.length > 0) {
            html += `<br><br><div style="background:#fff8e1;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:8px;">`;
            html += `<strong>🔑 Key Questions to Think About</strong><br>`;
            html += sections.keyQuestions.map(q=>`• ${q}`).join('<br>');
            html += `</div>`;
        }
        if (sections.keyConcepts.length > 0) {
            html += `<br><div style="background:#e8f5e9;border-left:3px solid #10b981;padding:10px 12px;border-radius:8px;">`;
            html += `<strong>💡 Key Concepts</strong><br>`;
            html += sections.keyConcepts.map(c=>`• ${c}`).join('<br>');
            html += `</div>`;
        }
        if (sections.newWords.length > 0) {
            html += buildNewWordsHTML(sections.newWords);
        }
        return html;
    }

    // Show clickable suggestion chips
    // Build green chip row for New Words — uses data attributes, no inline onclick
    function buildNewWordsHTML(words) {
        if (!words || words.length === 0) return '';
        let html = `<br><div style="background:#f3e8ff;border-left:3px solid #a855f7;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
        html += `<strong>📝 New Words</strong><br><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">`;
        words.forEach(w => {
            const entry = GLOSSARY[w] || GLOSSARY[w.toLowerCase()] || GLOSSARY[w.charAt(0).toUpperCase() + w.slice(1)];
            const pg = entry ? entry.page : 0;
            // Green chip with data attributes — event delegation handles the tap
            html += `<span data-term="${w.replace(/"/g,'&quot;')}" data-page="${pg}" style="background:#e8f5f0;color:#0a6e50;border:1.5px solid #10b981;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;">${w}${pg ? '<span style=\"color:#10b981;font-size:11px;\"> p.'+pg+'</span>' : ''}</span>`;
        });
        html += `</div></div>`;
        return html;
    }

    function showChips(topic) {
        const chips = [
            { label:"📖 Explain it simply", action:"explain" },
            { label:"💡 Give an example",   action:"example" },
            { label:"🔍 Go deeper",         action:"deeper"  },
            { label:"🧪 Quiz me on this",   action:"quiz"    }
        ];
        const box = document.getElementById('messages');
        const row = document.createElement('div');
        row.className = 'chip-row';
        chips.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'chip';
            btn.textContent = c.label;
            btn.onclick = () => chipAction(c.action, topic);
            row.appendChild(btn);
        });
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
    }

    function chipAction(action, topic) {
        const labels = { explain:"Explain it simply", example:"Give an example", deeper:"Go deeper", quiz:"Quiz me on this" };
        addMessage('user', labels[action]);

        setTimeout(() => {
            if (action === 'quiz') { startQuiz(); return; }

            if (!lastRawAnswer) {
                addMessage('bot', "Eish 😅 ask me a topic question first, then I can do that for you!");
                setTimeout(() => showChips(topic), 600);
                return;
            }

            if (action === 'explain') {
                addMessage('bot', teacherExplain(lastRawAnswer, lastQuery));

            } else if (action === 'example') {
                const lq = lastQuery.toLowerCase();
                const saContext = lq.includes('rock') || lq.includes('sediment')
                    ? "You can see sedimentary rocks all over the <b>Karoo</b> — those flat-topped koppies are compressed layers of sediment! 🪨"
                    : lq.includes('fossil')
                    ? "South Africa's <b>Cradle of Humankind</b> near Joburg is one of the world's richest fossil sites — right in our backyard! 🦕"
                    : lq.includes('electr') || lq.includes('circuit') || lq.includes('battery') || lq.includes('cell')
                    ? "Think of the <b>Eskom power grid</b> — electricity travels from power stations through cables to your home, just like a giant circuit! ⚡"
                    : lq.includes('skeleton') || lq.includes('bone') || lq.includes('ligament') || lq.includes('joint')
                    ? "Your own body is the example — feel your spine, ribs, skull. That's your endoskeleton at work! 🦴"
                    : lq.includes('metal') || lq.includes('iron') || lq.includes('copper') || lq.includes('steel')
                    ? "Your pots, spoons, coins, and roof sheets — all processed metals used every day in SA homes! 🔩"
                    : lq.includes('erosion') || lq.includes('weathering')
                    ? "Look at any school step that's been walked on for years — that worn surface is physical weathering happening right there! 🪨"
                    : lq.includes('potential') || lq.includes('stored energy') || lq.includes('catapult') || lq.includes('spring') || lq.includes('elastic')
                    ? "Think of a stretched rubber band on a <b>catapult</b> — that's stored (potential) energy waiting to become movement! 🏹"
                    : lq.includes('food chain') || lq.includes('producer') || lq.includes('consumer')
                    ? "Picture a <b>Kruger Park</b> food chain — grass → impala → lion → vulture. Energy flows from one to the next! 🌿"
                    : lq.includes('plant') || lq.includes('photosyn') || lq.includes('oxygen')
                    ? "Every tree lining a SA street is doing photosynthesis right now — turning sunlight into food and giving us oxygen for free! 🌳"
                    : lq.includes('life cycle') || lq.includes('metamorpho')
                    ? "Watch a <b>frog</b> near any SA dam — egg → tadpole → froglet → frog. That's a complete life cycle! 🐸"
                    : lq.includes('fuel') || lq.includes('coal') || lq.includes('energy source') || lq.includes('sources of energy') || lq.includes('renewable') || lq.includes('solar') || lq.includes('nuclear') || lq.includes('wind energy') || lq.includes('hydro')
                    ? "South Africa gets most of its electricity from <b>coal power stations</b> like Medupi and Kusile — but solar and wind farms are growing fast! ☀️🔥"
                    : lq.includes('soil') || lq.includes('topsoil') || lq.includes('bedrock')
                    ? "Dig in any SA garden — topsoil first (dark), then subsoil (orange-red), then bedrock deep below. Layers just like the textbook! 🌍"
                    : lq.includes('season') || lq.includes('earth move') || lq.includes('tilt')
                    ? "SA has opposite seasons to Europe — when it's summer in Joburg ☀️, it's winter in London ❄️. Earth's tilt in action!"
                    : "In South Africa you can see this everywhere — from the Karoo to Soweto to the ocean. Science is all around us! 🌍";
                

                const sections = extractTextbookSections(lastRawAnswer);
                let html = `💡 <b>Real-life example — ${lastQuery}</b><br><br>🇿🇦 <b>SA Connection:</b><br>${saContext}`;
                if (sections.questions.length > 0) {
                    html += `<br><br><div style="background:#e8f0fe;border-left:3px solid #6366f1;padding:10px 12px;border-radius:8px;">`;
                    html += `<strong>❓ Think About It</strong><br>`;
                    html += sections.questions.slice(0,3).map(q=>`• ${q}`).join('<br>');
                    html += `</div>`;
                }
                addMessage('bot', html);

            } else if (action === 'deeper') {
                if (fuse) {
                    const results = fuse.search(lastQuery, { limit: 6 });
                    if (results.length > 0) {
                        const rawText = results.map(r => r.item.text).join(' ');
                        const deepAnswer = formatAnswer(lastQuery, rawText);
                        addMessage('bot', `🔍 <b>Going deeper on "${lastQuery}" 👇</b><br><br>${deepAnswer}`);
                    } else {
                        addMessage('bot', "Eish 😅 I couldn't find more detail on that. Try rephrasing chommie!");
                    }
                }
            }
            setTimeout(() => showChips(topic), 700);
        }, 350);
    }

    // ── PDF chunk search system ───────────────────────────────────────────
    let PDF_CHUNKS = [];

    const SYNONYMS = {
        electricity: ["current","power","voltage","electric","electrical energy"],
        rocks: ["stone","mineral","rock","geology","igneous","metamorphic"],
        fossils: ["fossil","prehistoric","fossilized","fossilised","remains"],
        skeleton: ["backbone","spine","skull","rib","vertebrae","endoskeleton"],
        metal: ["iron","copper","steel","aluminium","gold","silver","zinc","rust"],
        food: ["eat","feed","nutrition","diet","predator","prey"],
        plant: ["tree","flower","leaf","photosynthesis","seed","root","stem"],
        animal: ["creature","organism","mammal","reptile","bird","fish"],
        circuit: ["electrical circuit","series circuit","parallel circuit","conductor","switch","bulb"],
        fuel: ["coal","petrol","diesel","gas","fossil fuel","burn","combustion"],
        structure: ["frame","shell","support","beam","column","strut","load"],
        surface: ["crust","layer","mantle","core","ground","soil","lithosphere"],
        sediment: ["sedimentary","sand","mud","gravel","deposit","compacted","layer"],
        material: ["substance","raw material","processed","natural","manufactured"],
        ligament: ["joint","tendon","connective","tissue","bone connection"],
        amphibian: ["frog","toad","salamander","newt","tadpole","metamorphosis"],
        reptile: ["snake","lizard","crocodile","tortoise","scales","cold blooded"],
        photosynthesis: ["chlorophyll","sunlight","carbon dioxide","oxygen","glucose","leaves"],
        producer: ["plant","photosynthesis","makes food","autotroph","green plant"],
        consumer: ["herbivore","carnivore","omnivore","eats","feeds on","heterotroph"],
        vertebrate: ["backbone","spine","fish","amphibian","reptile","bird","mammal"],
        invertebrate: ["no backbone","insect","worm","crab","snail","spider"],
        weathering: ["erosion","breaking down","wind","water","rock fragments"],
        conductor: ["copper","metal","allows electricity","low resistance"],
        insulator: ["rubber","plastic","wood","prevents electricity","high resistance"],
        potential: ["stored energy","elastic","spring","compressed","stretched","catapult","movement energy"],
        movement: ["kinetic energy","motion","speed","force","work","input","output"],
        gravity: ["weight","mass","pull","fall","drop","earth pulls"],
        lifecycle: ["egg","larva","pupa","adult","metamorphosis","reproduce","offspring"],
        habitat: ["ecosystem","biome","environment","forest","ocean","grassland","species"],
        season: ["summer","winter","spring","autumn","solstice","equinox","earth tilts"],
        mantle: ["crust","core","lithosphere","tectonic","plate","lava","magma"],
        subsoil: ["topsoil","bedrock","humus","soil layers","underground"]
    };

    function normalizePDF(text) {
        return text.toLowerCase().replace(/[^\w\s]/g, "").trim();
    }

    function getKeywords(q) {
        const words = normalizePDF(q).split(" ").filter(w => w.length > 2);
        const expanded = [...words];
        words.forEach(w => {
            if (SYNONYMS[w]) expanded.push(...SYNONYMS[w]);
        });
        return [...new Set(expanded)];
    }

    function scoreChunk(chunk, keywords) {
        const text = normalizePDF(chunk);
        const raw = chunk.toLowerCase();

        // Penalise question chunks — they contain keywords but aren't answers
        const trimmed = chunk.trim();
        if (trimmed.endsWith('?')) return -5;
        if (/^(what |how |why |which |give |list |name |describe |explain |below is|now we are|show where|carefully study)/i.test(trimmed)) return -8;

        // Penalise activity/instruction chunks heavily
        const isJunk = /^(now give|do not tell|use the knife|tap gently|cut out|paste|tick|fill in|write the names|perhaps an adult|as such the|they are designed|enabling activities|learners will have|if possible combine|hint what other|indb 20)/i.test(trimmed);
        if (isJunk) return -10;

        let score = 0;
        keywords.forEach(k => { if (text.includes(k)) score += 2; });

        // Bonus: exact phrase
        const joined = keywords.slice(0, 3).join(" ");
        if (joined.length > 3 && text.includes(joined)) score += 5;

        // Bonus: definitive sentences (starts with topic word)
        if (keywords.some(k => raw.startsWith(k))) score += 3;

        // Bonus: contains a definition pattern ("X is..." or "X are...")
        if (/ is | are | means | refers to /i.test(chunk)) score += 2;

        // Bonus: shorter = more precise (but not too short)
        if (chunk.length > 60 && chunk.length < 300) score += 2;

        // Penalise list-like chunks (components, materials lists)
        if (/^[A-Z][a-z]+,\s|,\s[a-z]+ [a-z]+,/i.test(chunk)) score -= 3;

        // Penalise teacher/activity language
        if (/teacher|learner|activity|exercise book|instruction|materials:|question:/i.test(raw)) score -= 3;

        return score;
    }

    function searchPDFChunks(q) {
        if (PDF_CHUNKS.length === 0) return null;
        const keywords = getKeywords(q);
        let bestScore = 0;
        let bestIndex = 0;

        PDF_CHUNKS.forEach((chunk, i) => {
            const score = scoreChunk(chunk, keywords);
            if (score > bestScore) { bestScore = score; bestIndex = i; }
        });

        if (bestScore === 0) return null;

        // Return context window: best chunk + neighbours
        return [
            PDF_CHUNKS[bestIndex - 1] || "",
            PDF_CHUNKS[bestIndex],
            PDF_CHUNKS[bestIndex + 1] || ""
        ].join(" ").trim();
    }

    function preparePDFChunks(fullText) {
        PDF_CHUNKS = fullText
            .split(/(?<=[.!?])\s+/)   // split on sentence boundaries
            .map(t => t.replace(/\s+/g, ' ').trim())
            .filter(t => t.length > 40 && t.length < 600);
    }

    // ── Lookup a single glossary term ─────────────────────────────────────
    function lookupTerm(term, page) {
        addMessage('user', `Tell me about: ${term}`);
        const entry = GLOSSARY[term];
        const pageHint = page || (entry ? entry.page : 0);
        const topicHint = entry ? entry.topic : '';

        // Pull pages around the known page number — most reliable
        if (pageHint && knowledgeBase.length > 0) {
            const nearby = knowledgeBase.filter(p => p.page >= pageHint && p.page <= pageHint + 4);
            if (nearby.length > 0) {
                const rawText = nearby.map(p => p.text).join(' ');
                lastQuery = term;
                lastRawAnswer = rawText;
                const answer = formatAnswer(term, rawText);
                const actualPage = nearby[0].page || pageHint;
                addMessage('bot', `<div style="color:#888;font-size:12px;margin-bottom:4px;">📄 p.${actualPage}${topicHint ? ' · ' + topicHint : ''}</div>` + answer);
                setTimeout(() => showPageImage(actualPage, term), 400);
                setTimeout(() => showChips(term), 700);
                return;
            }
        }

        // Fallback: Fuse search
        if (fuse) {
            const tLower = term.toLowerCase();
            // Exact substring across all pages
            let results = knowledgeBase.filter(p => p.text.toLowerCase().includes(tLower)).slice(0, 6).map(p => ({ item: p }));
            if (results.length === 0) results = fuse.search(term, { limit: 6 });
            if (results.length === 0 && term.includes(' ')) {
                const main = term.split(' ').sort((a,b) => b.length - a.length)[0];
                results = knowledgeBase.filter(p => p.text.toLowerCase().includes(main.toLowerCase())).slice(0, 4).map(p => ({ item: p }));
            }

    function isLikelyLearningIntent(q) {
        q = q.toLowerCase();
        // Must start with a question word AND have a science-like noun
        const questionStarters = ["what","how","why","when","where","which","name","list","define","explain","describe"];
        const startsAsQuestion = questionStarters.some(s => q.startsWith(s));
        if (!startsAsQuestion) return false;
        // Must be more than 2 words to avoid "what?" or "how?"
        if (q.split(' ').length < 2) return false;
        return true;
    }

    // ── PDF query handler ─────────────────────────────────────────────────
    function handlePDFQuery(q) {
        userState.inLearningMode = true;

        if (!fuse) {
            // Queue only the FIRST question asked — don't overwrite with later ones
            if (!pendingQuery) pendingQuery = q;
            addMessage('bot', "Eish chommie, I'm still loading the textbook 📚 Hold on — I'll answer that the moment it's ready! 🔄");
            // Show a typing indicator so they know something is happening
            setTimeout(() => {
                if (!pdfReady) {
                    addMessage('bot', "Still loading... 📖 Hang tight chommie, big textbook! While you wait — try asking about <b>biosphere</b>, <b>acids</b>, or <b>energy</b> once I'm ready.");
                }
            }, 4000);
            return;
        }

        // Skip words guard
        const skipWords = new Set(['nice','good','ok','okay','cool','yes','no','wow','great','lol','haha','sure','thanks','fine','ready','go']);
        if (q.split(' ').length <= 2 && skipWords.has(q.replace(/[^a-z]/g,''))) {
            addMessage('bot', mergedRand('encouragement'));
            return;
        }

        let response;
        const qLower = q.toLowerCase();
        let results = [];

        // Strategy 1: exact substring on any page
        const exact = knowledgeBase.filter(p => p.text.toLowerCase().includes(qLower));
        if (exact.length > 0) results = exact.slice(0, 6).map(p => ({ item: p }));

        // Strategy 2: all words present on same page
        if (results.length === 0) {
            const words = qLower.split(/\s+/).filter(w => w.length > 3);
            if (words.length > 1) {
                const allW = knowledgeBase.filter(p => words.every(w => p.text.toLowerCase().includes(w)));
                results = allW.slice(0, 6).map(p => ({ item: p }));
            }
        }

        // Strategy 3: Fuse fuzzy
        if (results.length === 0) results = fuse.search(q, { limit: 6 });

        // Strategy 4: longest word
        if (results.length === 0) {
            const longest = qLower.split(/\s+/).sort((a,b) => b.length-a.length)[0];
            if (longest && longest.length > 3) {
                results = knowledgeBase.filter(p => p.text.toLowerCase().includes(longest)).slice(0, 4).map(p => ({ item: p }));
            }
        }

        if (results.length > 0) {
            const rawText = results.map(r => r.item.text).join(' ');
            lastQuery = q;
            lastRawAnswer = rawText;
            response = formatAnswer(q, rawText);
        } else {

    function handleDelegatedTap(target) {
        if (!target) return;

        for (let i = 0; i < 5; i++) {

    function startQuiz() {

            if (matches) {
                matches.forEach(m => {
                    const parts = m.match(/^([^?]+[?])\s*(.+)$/s);
                    if (parts && parts[1] && parts[2]) {
                        const q = parts[1].trim();
                        const a = parts[2].trim().substring(0, 400);

                        const skip = /^(Do you|Can you|Look at|Think about|Draw|After you|Consider|Which cheek|Which direction|Stand facing|Turn to your|ACTIVITY|NatSci)/i.test(q);
                        // Must be a proper science question with substance
                        const hasContent = q.length > 20 && a.length > 30;
                        if (!skip && hasContent) {
                            qaPairs.push({ question: q, answer: a });
                        }
                    }
                });
            }
        });

    }
    // ── Extract structured textbook sections from raw PDF text ────────────
    function extractTextbookSections(rawText) {
        const sections = { keyQuestions: [], keyConcepts: [], questions: [], newWords: [], paragraphs: [] };

        // PDF.js produces flat text (no newlines) — all patterns must work on space-separated text

        // ── Keywords ─────────────────────────────────────────────────────
        const kwM = rawText.match(/Keywords?(.*?)(?=Did you know|Take note|Key questions?|ACTIVITY|\d+\.\d+\s+[A-Z]|$)/is);
        if (kwM) {
            const bullets = kwM[1].match(/[•*]\s*([a-zA-Z][a-zA-Z\s\-]{1,30})/g) || [];
            sections.newWords = bullets.map(s => s.replace(/^[•*]\s*/, '').trim()).filter(s => s.length > 1 && s.length < 40);
        }

        // ── Did you know / Take note ──────────────────────────────────────
        const dykM = rawText.match(/Did you know\??(.*?)(?=Take note|Key questions?|ACTIVITY|Keywords?|\d+\.\d+\s+[A-Z]|$)/is);
        if (dykM && dykM[1].trim().length > 20) sections.keyConcepts.push('💡 ' + dykM[1].trim().substring(0, 300));
        const tnM = rawText.match(/Take note(.*?)(?=Did you know|Key questions?|ACTIVITY|Keywords?|\d+\.\d+\s+[A-Z]|$)/is);
        if (tnM && tnM[1].trim().length > 20) sections.keyConcepts.push('📝 ' + tnM[1].trim().substring(0, 300));

        // ── Key questions ─────────────────────────────────────────────────
        const kqM = rawText.match(/Key questions?(.*?)(?=\d+\.\d+\s+[A-Z]|ACTIVITY|Over time|In this unit|$)/is);
        if (kqM) {
            const bullets = kqM[1].match(/[•*]\s*([^•*]{10,}\?)/g) || [];
            sections.keyQuestions = bullets.map(s => s.replace(/^[•*]\s*/, '').trim()).filter(s => s.length > 10);
        }

        // ── Explanatory paragraphs ────────────────────────────────────────
        // PDF text is flat (one long string). Split on sentence endings.
        const isJunk = s => /^(ACTIVITY|STRAND|Unit \d|Figure|Keywords?|Did you|Take note|Key questions?|REVISION|Materials?|Instructions?|Hypothesis|Do you|Can you|Look at|Write|Draw|Copy|Complete|Carefully|Study|Answer|Work in|Your teacher|Identify|What do|What are|What is|How can|How do|Why can|Why do|Are there|Is there)/i.test(s.trim()) || s.trim().endsWith('?');
        const isFileRef = s => /F1le:|ckg\/|phctco|\/photos\/|indb \d/.test(s);

        const sentences = (rawText.match(/[^.!?]{15,}[.!?]+/g) || [])
            .map(s => s.trim())
            .filter(s => s.length > 35 && !isJunk(s) && !isFileRef(s));

        // Group sentences into paragraphs of ~150-400 chars
        let buf = '';
        sentences.forEach(s => {
            buf += (buf ? ' ' : '') + s;
            if (buf.length >= 150) {
                sections.paragraphs.push(buf);
                buf = '';
            }
        });
        if (buf.length >= 60) sections.paragraphs.push(buf);

        sections.keyConcepts = [...new Set(sections.keyConcepts)].slice(0, 4);
        sections.keyQuestions = [...new Set(sections.keyQuestions)].slice(0, 5);
        sections.newWords     = [...new Set(sections.newWords)].slice(0, 10);
        sections.paragraphs   = sections.paragraphs.slice(0, 6);
        return sections;
    }

    function formatAnswer(query, rawText) {
        const q = query.toLowerCase();

        // ── Step 1: Extract structured sections BEFORE cleaning ──────────
        const sections = extractTextbookSections(rawText);

        // ── Step 2: Score paragraphs by keyword relevance ──────────────────
        const keywords = q.replace(/[^a-z\s]/g, '').split(/\s+/).filter(w => w.length > 2);
        const scoredParas = sections.paragraphs.map(p => {
            const pl = p.toLowerCase();
            let score = keywords.reduce((n, kw) => n + (pl.includes(kw) ? 4 : 0), 0);
            if (/ is | are | means | refers to | defined as | consists of | describes /i.test(p)) score += 4;
            if (keywords.some(kw => pl.startsWith(kw))) score += 5;
            if (score === 0) score = 1; // always show something
            return { p, score };
        }).sort((a, b) => b.score - a.score);

        // Always show top 3 paragraphs
        let topParas = scoredParas.slice(0, 3).map(x => x.p);

        // If paragraphs empty, build from raw sentences directly
        if (topParas.length === 0) {
            const junkRe = /^(ACTIVITY|STRAND|Figure|Keywords?|Did you|Take note|Do you|Can you|Write|Draw|Copy|Look at|What is|What are|How can|Are there)/i;
            const fallbackSents = (rawText.match(/[^.!?]{20,}[.!?]+/g) || [])
                .map(s => s.trim())
                .filter(s => s.length > 50 && !s.endsWith('?') && !junkRe.test(s) && !/F1le:|ckg\/|phctco/.test(s));
            if (fallbackSents.length > 0) topParas = [fallbackSents.slice(0, 4).join(' ')];
        }

        // ── Step 3: Emoji ─────────────────────────────────────────────────
        const emoji = q.includes('acid') || q.includes('base') || q.includes('neutral') ? '🧪'
            : q.includes('biosphere') || q.includes('atmosphere') || q.includes('hydrosphere') ? '🌍'
            : q.includes('biodiversity') || q.includes('species') || q.includes('classif') ? '🦁'
            : q.includes('reproduct') || q.includes('pollinat') || q.includes('fertilisa') ? '🌸'
            : q.includes('energy') || q.includes('kinetic') || q.includes('potential') ? '⚡'
            : q.includes('heat') || q.includes('conduction') || q.includes('thermal') ? '🌡️'
            : q.includes('electr') || q.includes('generator') || q.includes('eskom') ? '🔌'
            : q.includes('periodic') || q.includes('element') || q.includes('atom') ? '⚗️'
            : q.includes('moon') || q.includes('eclipse') || q.includes('tide') ? '🌕'
            : q.includes('sun') || q.includes('season') || q.includes('orbit') ? '☀️'
            : q.includes('astronomy') || q.includes('telescope') || q.includes('meerkat') ? '🔭'
            : q.includes('mixture') || q.includes('separat') || q.includes('filter') ? '🔬'
            : '📖';

        // ── Step 4: Build response ────────────────────────────────────────
        let html = `Sho chommie! ${emoji} Here's what the textbook says:<br><br>`;

        if (topParas.length > 0) {
            html += topParas.map(p => `📌 ${p}`).join('<br><br>');
        } else {
            html += `📌 The textbook covers this topic — tap the page image above to zoom in, or ask me a specific question like <b>"what is ${q}?"</b>`;
        }

        if (sections.keyQuestions.length > 0) {
            html += `<br><br><div style="background:#fff8e1;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
            html += `<strong>🔑 Key Questions</strong><br>`;
            html += sections.keyQuestions.map(kq => `• ${kq}`).join('<br>');
            html += `</div>`;
        }

        if (sections.keyConcepts.length > 0) {
            html += `<br><div style="background:#e8f5e9;border-left:3px solid #10b981;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
            html += `<strong>💡 Did you know / Take note</strong><br>`;
            html += sections.keyConcepts.map(c => `• ${c}`).join('<br><br>');
            html += `</div>`;
        }

        if (sections.newWords.length > 0) {
            html += buildNewWordsHTML(sections.newWords);
        }
        return html;
    }

    (function startLoading() {
        // Hide FAB since chat opens immediately
        const fab = document.getElementById('maxi-fab');
        if (fab) fab.classList.add('hidden');
        // Configure worker (belt-and-suspenders — also done above)
        if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
        initResources();
    })();
    // Fallbacks in case the IIFE ran too early
    document.addEventListener('DOMContentLoaded', function() { if (!pdfReady && !pdfDocRef) initResources(); });
    window.addEventListener('load', function() { if (!pdfReady && !pdfDocRef) initResources(); });
    // Last-resort retry after 2s for slow WebViewer environments
    setTimeout(function() { if (!pdfReady && !pdfDocRef) initResources(); }, 2000);
</script>
