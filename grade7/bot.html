<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Maxi Pie - Grade 7 Science Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
        .page-img { width:100%; border-radius:10px; margin-top:8px; border:1px solid #ddd; display:block; cursor:zoom-in; }
        .page-img-wrap { position:relative; background:#f5f5f5; border-radius:10px; margin-top:8px; min-height:60px; }
        .page-img-label { font-size:11px; color:#aaa; text-align:right; padding:2px 6px; }
        #img-zoom-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        #img-zoom-modal.open { display:flex; }
        #img-zoom-modal img { max-width:96%; max-height:85vh; border-radius:8px; object-fit:contain; touch-action:pinch-zoom; }
        #img-zoom-close { position:absolute; top:16px; right:16px; background:#ef4444; color:white; border:none; border-radius:50%; width:40px; height:40px; font-size:20px; font-weight:bold; cursor:pointer; z-index:10000; }
        #img-zoom-label { color:#ccc; font-size:13px; margin-top:10px; }
        
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        html { height: 100%; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background:#0a1a33; height: 100%; margin:0; overflow:hidden; visibility:hidden; }
        .chat-container { visibility:visible; }

        #maxi-fab { position:fixed; bottom:25px; left:25px; width:60px; height:60px; background:#10b981; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.5); z-index:999; border:3px solid #fff; transition:opacity 0.2s; }
        #maxi-fab img { width:85%; height:85%; border-radius:50%; object-fit: cover; }
        #maxi-fab.hidden { opacity:0; pointer-events:none; }

        #chat-modal { display:flex; flex-direction:column; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(7, 7, 12, 0.95); z-index:1000; }
        .chat-container { display:flex; flex-direction:column; flex:1; width:100%; max-width:500px; margin:0 auto; background:#f0f4f8; visibility:visible; min-height:0; overflow:hidden; }

        .chat-header { background:#0a1a33; padding:15px; display:flex; align-items:center; gap:12px; color:white; border-bottom:3px solid #10b981; }
        .chat-header img { width:45px; height:45px; border-radius:50%; border:2px solid #10b981; }
        .close-btn { margin-left:auto; background:#ef4444; color:white; border:none; border-radius:50%; width:35px; height:35px; font-weight:bold; cursor:pointer; }

        .chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:15px; min-height:0; scroll-behavior: smooth; }
        
        .msg { max-width:85%; padding:12px 16px; border-radius:18px; line-height:1.4; font-size:16px; box-shadow:0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .bot { align-self:flex-start; background:white; color:#333; border-bottom-left-radius:2px; }
        .user { align-self:flex-end; background:#10b981; color:white; border-bottom-right-radius:2px; }
        .timestamp { font-size: 10px; opacity: 0.6; text-align: right; margin-top: 5px; }
        .user .timestamp { color: #e0f2fe; }

        .typing-indicator { display: none; align-self: flex-start; background: #e2e8f0; padding: 12px 16px; border-radius: 18px; border-bottom-left-radius: 2px; gap: 4px; align-items: center; margin-bottom: 15px; }
        .typing-indicator span { width: 6px; height: 6px; background: #888; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        .chat-input-area { padding:15px; background:white; display:flex; gap:10px; border-top:1px solid #ddd; flex-shrink:0; }
        .chat-input-area input { flex:1; padding:12px; border-radius:25px; border:1px solid #ccc; outline:none; font-size:16px; color:#333; background:#fff; -webkit-text-fill-color:#333; }
        .send-btn { background:#10b981; color:white; border:none; padding:10px; height:45px; border-radius:25px; font-weight:bold; cursor:pointer; }

        .chip-row { display:flex; overflow-x:auto; gap:8px; padding:6px 0 2px; }
        .chip-row::-webkit-scrollbar { display: none; }
        .chip { background:#e8f5f0; color:#0a6e50; border:1.5px solid #10b981; border-radius:20px; padding:7px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:background 0.15s, transform 0.1s; white-space:nowrap; }
        .chip:hover { background:#10b981; color:white; transform:scale(1.04); }
        .chip:active { transform:scale(0.97); }
    </style>
</head>
<body>

<div id="maxi-fab" onclick="openChat()"><img src="cat_full.png"></div>

<div id="chat-modal">
    <div class="chat-container">
        <div class="chat-header">
            <img src="cat_full.png">
            <div><h3>Maxi Pie</h3><small style="color:#10b981">Grade 7 Science Chommie 🇿🇦</small></div>
            <button class="close-btn" onclick="closeChat()">×</button>
        </div>
        <div id="messages" class="chat-messages">
            <div class="msg bot">Aweh bru! I'm <strong>Maxi Pie</strong> 🐾, your science sidekick! I’m here to help you conquer the world of science. Ask me anything!</div>
            <div id="typing" class="typing-indicator"><span></span><span></span><span></span></div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask me something, chommie..."
                onkeypress="if(event.key==='Enter') handleSend()"
                onfocus="setTimeout(function(){ document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight; }, 400)">
            <button onclick="handleSend()" class="send-btn">Send</button>
        </div>
    </div>
</div>

<div id="img-zoom-modal" onclick="closeZoom(event)">
    <button id="img-zoom-close" onclick="closeZoom()">×</button>
    <img id="img-zoom-src" src="">
    <div id="img-zoom-label"></div>
</div>

<script>
    function openZoom(src, label) {
        document.getElementById('img-zoom-src').src = src;
        document.getElementById('img-zoom-label').textContent = label || '';
        document.getElementById('img-zoom-modal').classList.add('open');
    }
    function closeZoom(e) {
        if (!e || e.target === document.getElementById('img-zoom-modal') || e.target === document.getElementById('img-zoom-close')) {
            document.getElementById('img-zoom-src').src = '';
            document.getElementById('img-zoom-modal').classList.remove('open');
        }
    }

    function handleDelegatedTap(target) {
        if (!target) return;
        let el = target;
        for (let i = 0; i < 5; i++) {
            if (!el || el === document.body) break;
            if (el.dataset) {
                if (el.dataset.kwsearch) {
                    const kw = el.dataset.kwsearch;
                    addMessage('user', kw);
                    setTimeout(() => handlePDFQuery(kw), 100);
                    return;
                }
                if (el.dataset.term) {
                    lookupTerm(el.dataset.term, parseInt(el.dataset.page) || 0);
                    return;
                }
                if (el.dataset.zoompage) {
                    const pg = parseInt(el.dataset.zoompage);
                    const cached = PAGE_IMAGES[pg];
                    if (cached) { openZoom(cached, el.dataset.zoomlabel || ''); } 
                    else { renderPageImage(pg).then(dataUrl => { if (dataUrl) openZoom(dataUrl, el.dataset.zoomlabel || ''); }); }
                    return;
                }
            }
            el = el.parentElement;
        }
    }
    
    document.addEventListener('click', function(e) { handleDelegatedTap(e.target); });
    document.addEventListener('touchend', function(e) {
        const targetTag = e.target.tagName;
        if (targetTag === 'INPUT' || targetTag === 'BUTTON' || e.target.classList.contains('send-btn')) return; 
        const touch = e.changedTouches && e.changedTouches[0];
        const el = touch ? document.elementFromPoint(touch.clientX, touch.clientY) : e.target;
        if (el) { 
            if (el.closest('[data-kwsearch], [data-term], [data-zoompage], .chip')) { e.preventDefault(); }
            handleDelegatedTap(el); 
        }
    }, { passive: false });
</script>

<script>
    let knowledgeBase = [];
    let fuse = null;
    let pdfReady = false;
    let pendingQuery = null;
    const PAGE_IMAGES = {}; 
    let pdfDocRef = null;

    // ── NEW: Topic Awareness & Memory ──
    let userProfile = { topics: {} };
    let conversationMemory = [];
    let lastQuery = '';
    let lastRawAnswer = '';

    function trackTopic(query) {
        const key = query.toLowerCase().split(' ').slice(0,2).join(' '); // prevent massive strings
        userProfile.topics[key] = (userProfile.topics[key] || 0) + 1;
        if (userProfile.topics[key] === 3) {
            setTimeout(() => addMessage('bot', "Yoh 😄 you really like this topic hey! Future scientist in the making 🔬"), 2000);
        }
    }

    function remember(query, answer) {
        conversationMemory.push({ query, answer });
        if (conversationMemory.length > 5) conversationMemory.shift();
    }

    function getContextualQuery(query) {
        const q = query.toLowerCase();
        if (conversationMemory.length === 0) return query;
        if (/^(more|tell me more|go on|continue|explain more|why|and|also|what else|example)$/.test(q.trim())) {
            return lastQuery + " " + query;
        }
        return query;
    }

    const typingIndicator = document.getElementById('typing');
    function showTyping() {
        typingIndicator.style.display = 'flex';
        const box = document.getElementById('messages');
        box.appendChild(typingIndicator); 
        box.scrollTop = box.scrollHeight;
    }
    function hideTyping() { typingIndicator.style.display = 'none'; }

    async function renderPageImage(pageNum) {
        if (PAGE_IMAGES[pageNum]) return PAGE_IMAGES[pageNum];
        if (!pdfDocRef) return null;
        try {
            const page = await pdfDocRef.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
            PAGE_IMAGES[pageNum] = dataUrl;
            return dataUrl;
        } catch(e) { return null; }
    }

    function showPageImage(pageNum, label) {
        if (!pageNum || pageNum < 1 || !pdfDocRef) return;
        const uid = 'pg' + pageNum + '_' + Date.now();
        const lbl = `📄 Textbook p.${pageNum}${label ? ' · ' + label : ''}`;
        showTyping();
        setTimeout(() => {
            hideTyping();
            const div = document.createElement('div');
            div.className = 'msg bot';
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            div.innerHTML = `<div class="page-img-wrap" id="${uid}"><div class="page-img-label">${lbl}</div><div style="padding:10px;color:#aaa;font-size:13px;">⏳ Rendering p.${pageNum}...</div></div><div class="timestamp">${time}</div>`;
            const box = document.getElementById('messages');
            box.insertBefore(div, typingIndicator);
            box.scrollTop = box.scrollHeight;

            renderPageImage(pageNum).then(dataUrl => {
                const wrap = document.getElementById(uid);
                if (!wrap) return;
                if (dataUrl) {
                    PAGE_IMAGES[pageNum] = dataUrl;
                    const imgEl = document.createElement('img');
                    imgEl.src = dataUrl;
                    imgEl.className = 'page-img';
                    imgEl.title = 'Tap to zoom';
                    imgEl.dataset.zoompage = pageNum;
                    imgEl.dataset.zoomlabel = `p.${pageNum}${label ? ' · '+label : ''}`;
                    wrap.innerHTML = `<div class="page-img-label">${lbl} <span style="color:#10b981;font-size:11px;">🔍 tap to zoom</span></div>`;
                    wrap.appendChild(imgEl);
                } else { wrap.innerHTML = `<div class="page-img-label" style="color:#e88;">📄 ${lbl} — image unavailable</div>`; }
                box.scrollTop = box.scrollHeight;
            });
        }, 500); 
    }

    // ── NEW: Exam Mode & Auto Question Generators ──
    function examAnswer(text) {
        const sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.length > 30).slice(0, 4);
        const bullets = sentences.map(s => `• ${s}`).join('<br>');
        return `🧪 <b>Exam Answer Mode:</b><br><br>${bullets}<br><br>✍️ <b>Tip:</b> Keep it short and use keywords for full marks.`;
    }

    function generateQuestion(text) {
        const sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.length > 40 && !s.includes('?'));
        if(sentences.length > 0) {
            const s = sentences[Math.floor(Math.random()*sentences.length)];
            const blanked = s.replace(/\b(is|are|called|known as|means)\b\s+([a-z]+)/i, "$1 ______");
            return `⚡ <b>Quick question:</b><br><br>${blanked}<br><br>Type your answer 👇`;
        }
        return "Eish I can't think of a question for this right now! Try another topic.";
    }

    function buildNewWordsHTML(words) {
        if (!words || words.length === 0) return '';
        let html = `<br><div style="background:#f3e8ff;border-left:3px solid #a855f7;padding:10px 12px;border-radius:8px;margin-top:6px;"><strong>📝 New Words</strong><br><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">`;
        words.forEach(w => {
            const entry = GLOSSARY[w] || GLOSSARY[w.toLowerCase()];
            const pg = entry ? entry.page : 0;
            html += `<span data-term="${w.replace(/"/g,'&quot;')}" data-page="${pg}" class="chip">${w}${pg ? '<span style=\"color:#10b981;font-size:11px;\"> p.'+pg+'</span>' : ''}</span>`;
        });
        return html + `</div></div>`;
    }

    function showChips(topic) {
        const chips = [ 
            { label:"📖 Explain it simply", action:"explain" }, 
            { label:"💡 Real-life SA example", action:"example" }, 
            { label:"📝 Exam Answer", action:"exam" }, 
            { label:"⚡ Quick Question", action:"auto_quiz" },
            { label:"🔍 Go deeper", action:"deeper" } 
        ];
        const box = document.getElementById('messages');
        const row = document.createElement('div');
        row.className = 'chip-row';
        chips.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'chip';
            btn.textContent = c.label;
            btn.onclick = () => chipAction(c.action, topic);
            row.appendChild(btn);
        });
        box.insertBefore(row, typingIndicator);
        box.scrollTop = box.scrollHeight;
    }

    function chipAction(action, topic) {
        const labels = { explain:"Explain it simply", example:"Give a real-life example", deeper:"Go deeper", exam:"Give me an exam answer", auto_quiz:"Ask me a quick question" };
        addMessage('user', labels[action]);
        showTyping();
        
        setTimeout(() => {
            hideTyping();
            if (!lastRawAnswer) { addMessage('bot', "Eish 😅 ask me a topic question first!"); setTimeout(() => showChips(topic), 600); return; }

            if (action === 'explain') { 
                const summary = lastRawAnswer.split(/(?<=[.!?])\s+/).filter(s => s.length > 20).slice(0,3).join(" ");
                addMessage('bot', `🤔 <b>Let's break it down:</b><br><br>${summary}<br><br>💡 <b>In simple terms:</b> ${simplify(summary)}`); 
            } 
            else if (action === 'example') {
                const saContext = lastQuery.toLowerCase().includes('rock') ? "SA sits on the world's richest mineral deposits! 💎" : "Science is all around us in SA! 🌍";
                addMessage('bot', `💡 <b>Real-life example — ${lastQuery}</b><br><br>🇿🇦 <b>SA Connection:</b><br>${saContext}`);
            } 
            else if (action === 'exam') {
                addMessage('bot', examAnswer(lastRawAnswer));
            }
            else if (action === 'auto_quiz') {
                addMessage('bot', generateQuestion(lastRawAnswer));
            }
            else if (action === 'deeper') {
                if (fuse) {
                    const results = fuse.search(lastQuery, { limit: 6 });
                    if (results.length > 0) {
                        addMessage('bot', `🔍 <b>Going deeper on "${lastQuery}" 👇</b><br><br>${formatAnswer(lastQuery, results.map(r => r.item.text).join(' '))}`);
                    } else { addMessage('bot', "Eish 😅 I couldn't find more detail on that."); }
                }
            }
            setTimeout(() => showChips(topic), 700);
        }, 1200);
    }

    const SYNONYMS = {
        electricity: ["current","power","voltage","electric"], rocks: ["stone","mineral","geology","igneous","metamorphic"],
        fossils: ["prehistoric","remains"], skeleton: ["backbone","spine","skull"], metal: ["iron","copper","steel","rust"],
        plant: ["tree","flower","leaf","photosynthesis"], circuit: ["conductor","switch","bulb"],
        photosynthesis: ["chlorophyll","sunlight","carbon dioxide","glucose"], weathering: ["erosion","breaking down"],
        hydrosphere: ["water cycle", "evaporation", "aquifer", "groundwater"]
    };

    async function initResources() { await initFromLearnerPDF(); }

    let _loadStarted = false;
    async function initFromLearnerPDF() {
        if (_loadStarted) return;
        _loadStarted = true;
        
        let loadTimeout = setTimeout(() => {
            if(!pdfReady) addMessage('bot', "Yoh, big textbook! It's taking a little while to load but we're almost there. Hang tight chommie! ⏳");
        }, 45000); 

        const url = 'resources/logic7.pdf';
        let pdf;
        try {
            pdf = await pdfjsLib.getDocument(url).promise;
            clearTimeout(loadTimeout);
        } catch(e) {
            clearTimeout(loadTimeout);
            addMessage('bot', "Yoh! There was an error loading the textbook file. Check your internet connection or try refreshing the app. 😅");
            _loadStarted = false; 
            return;
        }
        pdfDocRef = pdf;

        const totalPages = pdf.numPages;
        let progressMsg = null;
        for (let i = 1; i <= totalPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const text = textContent.items.map(s => s.str).join(' ');
            knowledgeBase.push({ text: text.replace(/\s+/g, ' '), page: i });
            
            if (i % 5 === 0) { await new Promise(resolve => setTimeout(resolve, 15)); }
            
            if (i === 1) {
                const box = document.getElementById('messages');
                progressMsg = document.createElement('div');
                progressMsg.className = 'msg bot';
                progressMsg.id = 'pdf-progress';
                progressMsg.innerHTML = `📖 Loading textbook... <b>0%</b>`;
                box.insertBefore(progressMsg, typingIndicator);
                box.scrollTop = box.scrollHeight;
            } else if (progressMsg && i % 5 === 0) {
                const pct = Math.round((i / totalPages) * 100);
                progressMsg.innerHTML = `📖 Loading textbook... <b>${pct}%</b> <span style="color:#aaa;font-size:12px;">(${i}/${totalPages} pages)</span>`;
            }
        }
        if (progressMsg) progressMsg.remove();

        fuse = new Fuse(knowledgeBase, { keys: ['text'], threshold: 0.5, ignoreLocation: true, distance: 1000 });
        pdfReady = true;
        buildGlossaryIndex();

        if (pendingQuery) {
            const q = pendingQuery;
            pendingQuery = null;
            showTyping();
            setTimeout(() => {
                hideTyping();
                addMessage('bot', formatAnswer(q, knowledgeBase.map(p => p.text).join(' ').substring(0, 50000)));
                setTimeout(() => showChips(q), 600);
            }, 800);
        }

        addMessage('bot', `Sho! 📚 Textbook loaded and ready chommie!<br><br>
<span onclick="showTopicMenu()" style="background:#e8f5f0;color:#0a6e50;border:1.5px solid #10b981;border-radius:16px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-block;margin:4px 4px 4px 0;">📋 Topic Menu</span>
<span onclick="showGlossary(null)" style="background:#e8f5f0;color:#0a6e50;border:1.5px solid #10b981;border-radius:16px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-block;margin:4px;">📚 Glossary</span>
<span onclick="startQuiz()" style="background:#e8f5f0;color:#0a6e50;border:1.5px solid #10b981;border-radius:16px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-block;margin:4px;">🧪 Quiz me</span>`);
    }

    const SA_ULTRA_FLOW = {
        greetings: [ "Aweh chommie! 👋 What are we tackling today?", "Heita bru! 😎 Brain switched on?", "Sho sho! 🔥 Let's get into it!", "Howzit! Ready to learn some science?" ],
        positive: [ "Lekker! 💪 Let's go!", "Sharp sharp! 🔥 I like that energy!", "Let's do it boet! 💯", "Aweh, we scheme a plan now!" ],
        negative: [ "Eish 😅 not feeling it? Let's start small", "No stress 😎 but your brain is waiting hey", "Hayibo, don't run away from knowledge!" ],
        unsure: [ "Hayi 😅 not sure? Let's test it together", "Aweh 😄 no stress, I'll guide you, just now you'll get it." ],
        praise: [ "🔥 That's it! Lekker!", "💯 Nailed it!", "Aweh 😎 you're sharp!", "Yoh 😄 clever thinking bru!" ],
        encouragement: [ "Don't stress, we build step by step 💪", "Yoh 😅 this one confuses everyone, eishena.", "Aweh 😎 you're close!" ],
        jokes: [ "Yoh imagine asking Linda that 😂", "Lexi would already be on Google 😆", "Sadee would guess and hope 😅", "That question is harder than surviving load shedding! ⚡" ]
    };

    let GLOSSARY = {};
    let TOPIC_INDEX = {};
    const TOPIC_PAGE_MAP = {
        "Life Processes in Plants": { start: 2, end: 18 }, "Life Processes in Animals": { start: 19, end: 36 },
        "Nutrients and Feeding": { start: 37, end: 54 }, "Photosynthesis": { start: 55, end: 70 },
        "The Lithosphere": { start: 249, end: 264 }, "The Atmosphere": { start: 279, end: 292 },
        "The Hydrosphere": { start: 265, end: 278 }, "Electromagnetic Spectrum": { start: 187, end: 202 }
    };
    function getTopicForPage(pageNum) {
        for (const [topic, range] of Object.entries(TOPIC_PAGE_MAP)) {
            if (pageNum >= range.start && pageNum <= range.end) return topic;
        }
        return "General";
    }

    function buildGlossaryIndex() {
        GLOSSARY = {};
        TOPIC_INDEX = {};
        knowledgeBase.forEach(({ text, page }) => {
            const nwMatch = text.match(/New words\s*([\s\S]{0,300}?)(?=KEY|ACTIVITY|NatSci|\d{3}|$)/i);
            if (nwMatch) {
                const rawWords = nwMatch[1].split(/[•\n,]+/).map(w => w.trim()).filter(w => w.length > 2 && w.length < 35 && !/NatSci/i.test(w));
                const topic = getTopicForPage(page);
                rawWords.forEach(term => { if (!GLOSSARY[term]) { GLOSSARY[term] = { page, topic }; } });
            }
        });

        const manualTerms = [
            { term: "transpiration", page: 2, topic: "Life Processes" }, { term: "photosynthesis", page: 55, topic: "Photosynthesis" },
            { term: "atom", page: 87, topic: "Matter" }, { term: "wavelength", page: 187, topic: "Electromagnetic Spectrum" },
            { term: "quarry", page: 249, topic: "The Lithosphere" }, { term: "sedimentary", page: 249, topic: "The Lithosphere" }
        ];
        manualTerms.forEach(({ term, page, topic }) => { if (!GLOSSARY[term]) GLOSSARY[term] = { page, topic }; });
    }

    const FALLBACK_DEFS = {
        "wavelength": "The distance between two consecutive peaks of a wave. In the electromagnetic spectrum, different colors of light have different wavelengths!",
        "quarry": "A place where rocks, sand, or minerals are extracted from the surface of the Earth. It's an open-pit mine.",
        "photosynthesis": "The process where green plants use sunlight, water, and carbon dioxide to make their own food (glucose) and release oxygen.",
        "sedimentary": "Rocks formed by the accumulation and compaction of sediment (sand, mud, pebbles) over millions of years.",
        "transpiration": "The process where plants absorb water through their roots and then give off water vapor through pores in their leaves.",
        "lithosphere": "The solid, outer part of the Earth, consisting of the crust and upper mantle.",
        "atmosphere": "The layer of gases surrounding Earth that protects us and provides the air we breathe.",
        "hydrosphere": "All the waters on the earth's surface, such as lakes and seas, and sometimes including water over the earth's surface, such as clouds."
    };

    function lookupTerm(term, page) {
        addMessage('user', `Tell me about: ${term}`);
        showTyping();

        setTimeout(() => {
            hideTyping();
            const entry = GLOSSARY[term];
            const pageHint = page || (entry ? entry.page : 0);

            if (fuse) {
                let results = fuse.search(term, { limit: 6 });
                
                if (results.length === 0) {
                    const fallback = FALLBACK_DEFS[term.toLowerCase()];
                    if (fallback) {
                        addMessage('bot', `💡 <b>${term}</b><br><br>${fallback}`);
                        if(pageHint) setTimeout(() => showPageImage(pageHint, term), 400);
                        setTimeout(() => showChips(term), 700);
                        return;
                    }
                }

                if (results.length > 0) {
                    const rawText = results.map(r => r.item.text).join(' ');
                    lastQuery = term;
                    lastRawAnswer = rawText;
                    const answer = formatAnswer(term, rawText);
                    addMessage('bot', answer);
                    if (pageHint) { setTimeout(() => showPageImage(pageHint, term), 400); }
                } else {
                    addMessage('bot', `Eish 😅 I couldn't find exact info on "<b>${term}</b>" in the textbook right now. Try asking it differently chommie!`);
                }
                setTimeout(() => showChips(term), 700);
            }
        }, 800);
    }

    const TOPIC_OVERVIEWS = {
        "Life Processes in Plants": { emoji: "🌱", term: "Term 1", intro: "Plants are living things that carry out all life processes.", learn: ["MRS GREN","Roots and stems","Transpiration"], keywords: ["life processes","MRS GREN","transpiration"] },
        "The Lithosphere": { emoji: "🪨", term: "Term 4", intro: "The solid outer layer of Earth is the lithosphere.", learn: ["Earth's structure","Rock cycle","Soil"], keywords: ["lithosphere","crust","mantle","rock cycle","sedimentary"] },
        "The Hydrosphere": { emoji: "🌊", term: "Term 4", intro: "Water covers 71% of Earth.", learn: ["Water cycle","Freshwater vs saltwater","Conservation"], keywords: ["hydrosphere","water cycle","evaporation","aquifer"] },
        "Electromagnetic Spectrum": { emoji: "🌈", term: "Term 3", intro: "Light is just one part of a bigger family.", learn: ["EM spectrum","Radio, microwave, X-ray","Visible light"], keywords: ["electromagnetic spectrum","wavelength","frequency","radiation"] }
    };

    function handleTopicClick(topic) {
        addMessage('user', topic);
        showTyping();
        
        setTimeout(() => {
            hideTyping();
            if (!pdfReady) {
                addMessage('bot', "Eish chommie, the textbook is still loading! I'll fetch the content for this the moment it's ready. 📚");
                return;
            }

            const ov = TOPIC_OVERVIEWS[topic];
            if (ov) {
                let html = `${ov.emoji} <b>${topic}</b> <span style="color:#888;font-size:12px;">${ov.term}</span><br><br>${ov.intro}<br><br><div style="background:#fff8e1;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:8px;margin-bottom:8px;"><strong>📚 What you will learn:</strong><br>` + ov.learn.map(l => `• ${l}`).join('<br>') + `</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">`;
                ov.keywords.forEach(kw => { html += `<span data-kwsearch="${kw.replace(/"/g,'&quot;')}" style="background:#e8f5f0;color:#0a6e50;border:1.5px solid #10b981;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;">${kw}</span>`; });
                html += `</div>`;
                addMessage('bot', html);
            }

            const topicRange = TOPIC_PAGE_MAP[topic];
            let rawText = '';
            if (topicRange) {
                const topicPages = knowledgeBase.filter(p => p.page >= topicRange.start && p.page <= topicRange.end);
                rawText = topicPages.map(p => p.text).join(' ');
            }
            if (!rawText && fuse) {
                const results = fuse.search(topic, { limit: 5 });
                rawText = results.map(r => r.item.text).join(' ');
            }

            if (rawText && rawText.length > 100) {
                lastQuery = topic;
                lastRawAnswer = rawText;
                const topicKeyword = (TOPIC_OVERVIEWS[topic] && TOPIC_OVERVIEWS[topic].keywords[0]) || topic;
                const answer = formatAnswer(topicKeyword, rawText);
                
                setTimeout(() => {
                    addMessage('bot', answer);
                    if (topicRange) { setTimeout(() => showPageImage(topicRange.start, topic), 300); }
                    setTimeout(() => showChips(topic), 1200);
                }, 1000);
            } else {
                addMessage('bot', "Eish 😅 I couldn't pull the exact pages for that topic. Try typing a specific keyword!");
            }
        }, 800);
    }

    function showGlossary(filter) {
        const terms = Object.entries(GLOSSARY);
        if (terms.length === 0) { addMessage('bot', "Eish 😅 still building the glossary. Try again in a sec chommie!"); return; }

        const filtered = filter ? terms.filter(([t]) => t.toLowerCase().startsWith(filter.toLowerCase())) : terms;
        filtered.sort((a, b) => a[0].localeCompare(b[0]));

        let html = `📚 <b>Glossary${filter ? " — " + filter.toUpperCase() : ""}</b> <span style="color:#888;font-size:12px;">${filtered.length} term${filtered.length !== 1 ? 's' : ''}</span><br><br><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;">`;
        [...new Set(Object.keys(GLOSSARY).map(t => t[0].toUpperCase()))].sort().forEach(l => { html += `<span onclick="showGlossary('${l}')" class="chip" style="padding:3px 10px;font-size:12px;">${l}</span>`; });
        html += `</div>`;

        filtered.slice(0, 30).forEach(([term, data]) => {
            html += `<div style="padding:6px 0;border-bottom:1px solid #eee;"><span data-term="${term.replace(/"/g,'&quot;')}" data-page="${data.page}" style="color:#0a6e50;font-weight:600;cursor:pointer;">${term}</span> <span style="color:#aaa;font-size:12px;">p.${data.page}</span></div>`;
        });
        addMessage('bot', html);
    }

    function showTopicMenu() {
        let html = `📋 <b>Grade 7 Science — Topic Menu</b><br><br>`;
        const terms = [
            { term: "Term 1", label: "Life and Living", color: "#e8f5e9", border: "#10b981", topics: ["Life Processes in Plants","Life Processes in Animals","Nutrients and Feeding","Photosynthesis"] },
            { term: "Term 3", label: "Energy and Change", color: "#fff8e1", border: "#f59e0b", topics: ["Electromagnetic Spectrum"] },
            { term: "Term 4", label: "Planet Earth and Beyond", color: "#f3e8ff", border: "#a855f7", topics: ["The Lithosphere","The Hydrosphere","The Atmosphere","The Solar System and Universe"] }
        ];

        terms.forEach(({ term, label, color, border, topics }) => {
            html += `<div style="background:${color};border-left:3px solid ${border};padding:8px 12px;border-radius:8px;margin-bottom:8px;"><strong>${term}: ${label}</strong><br><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">`;
            topics.forEach(t => { html += `<span onclick="handleTopicClick('${t.replace(/'/g,"\\'")}');" style="background:white;border:1px solid ${border};border-radius:14px;padding:4px 10px;font-size:13px;cursor:pointer;color:#333;">${t}</span>`; });
            html += `</div></div>`;
        });
        addMessage('bot', html);
    }

    // ── NEW: Detect Misconceptions, Intents, and Wrap Personality ──
    function detectMisconception(query) {
        const q = query.toLowerCase();
        if (q.includes("plants get food from soil") || q.includes("plant eat soil")) return "⚠️ Small correction chommie: Plants don’t get food from soil — they MAKE their own food using sunlight (photosynthesis) 🌿";
        if (q.includes("electricity is stored") && q.includes("wires")) return "⚠️ Not quite — electricity flows through wires, it doesn’t get stored there ⚡";
        if (q.includes("sun goes around the earth")) return "⚠️ Hold up — the Earth orbits the Sun, not the other way around! 🌍☀️";
        return null;
    }

    function detectIntent(q) {
        if (/what is|define/.test(q)) return "definition";
        if (/why/.test(q)) return "reason";
        if (/how/.test(q)) return "process";
        if (/example/.test(q)) return "example";
        return "general";
    }

    function simplify(text) {
        return text
            .replace(/process/g, "thing that happens")
            .replace(/organism/g, "living thing")
            .replace(/organisms/g, "living things")
            .replace(/obtain/g, "get")
            .replace(/substance/g, "stuff")
            .replace(/characteristics/g, "features");
    }

    function personalityWrap(text, type="normal") {
        const styles = {
            normal: ["Alright chommie 👇", "Check this out 👇", "Let’s break it down 👇"],
            smart: ["Okay now we’re getting serious 😏", "Yoh this one is proper science 👀", "Exam mode activated 📝"],
            fun: ["😂 Okay this is actually cool", "Yoh science is flexing here 🔥"]
        };
        const pick = styles[type][Math.floor(Math.random()*styles[type].length)];
        return `${pick}<br><br>${text}`;
    }

    function saMoments(query) {
        const q = query.toLowerCase();
        if (q.includes("energy") || q.includes("power")) return "⚡ More energy than Stage 6 recovery 😭";
        if (q.includes("brain") || q.includes("think")) return "🧠 Brain working harder than a taxi driver on month-end 😅";
        if (q.includes("test") || q.includes("exam")) return "📄 Yoh this question would silence the whole class 😶";
        return null;
    }

    function suggestFix(query) {
        if(!query || query.length < 2) return null;
        const fuseGlossary = new Fuse(Object.keys(GLOSSARY), { threshold: 0.4 });
        const results = fuseGlossary.search(query);
        if(results.length > 0) {
            const suggestions = results.slice(0, 3).map(r => `<span data-term="${r.item.replace(/"/g,'&quot;')}" class="chip" style="padding:4px 8px;font-size:12px;">${r.item}</span>`);
            return `Did you mean: ${suggestions.join(" ")} ?`;
        }
        return null;
    }

    function handlePDFQuery(q) {
        if (!fuse) {
            if (!pendingQuery) pendingQuery = q;
            addMessage('bot', "Eish chommie, I'm still loading the textbook 📚 Hold on — I'll answer that the moment it's ready! 🔄");
            return;
        }

        // 1. Detect Misconceptions early
        const correction = detectMisconception(q);
        if (correction) {
            addMessage('bot', correction);
            return; 
        }

        // 2. Track the topic frequency
        trackTopic(q);

        showTyping();
        setTimeout(() => {
            hideTyping();
            
            let searchQ = getContextualQuery(q);
            let expandedQ = searchQ;
            if (searchQ.split(' ').length <= 2) {
                const synonymKey = Object.keys(SYNONYMS).find(k => searchQ.toLowerCase().includes(k));
                if (synonymKey) { expandedQ = searchQ + ' ' + SYNONYMS[synonymKey].slice(0, 3).join(' '); }
            }

            const results = fuse.search(expandedQ, { limit: 6 });
            
            if (results.length > 0) {
                const rawText = results.map(r => r.item.text).join(' ');
                lastQuery = q;
                lastRawAnswer = rawText;
                
                // Format and Wrap
                const formattedAnswer = formatAnswer(searchQ, rawText);
                const isSmart = detectIntent(searchQ) === "definition" || searchQ.length > 15;
                addMessage('bot', personalityWrap(formattedAnswer, isSmart ? "smart" : "normal"));

                // Page image
                if (results[0].item.page) setTimeout(() => showPageImage(results[0].item.page, ''), 500);

                // Occasional SA Moment injection
                const moment = saMoments(q);
                if (moment && Math.random() > 0.6) {
                    setTimeout(() => addMessage('bot', moment), 1500);
                }

            } else {
                // 3. Search Recovery / Suggest Fix
                const fix = suggestFix(searchQ);
                if(fix) {
                    addMessage('bot', `Yoh! 😅 I couldn't find exact info on that.<br><br>${fix}`);
                } else {
                    const fallback = Object.keys(FALLBACK_DEFS).find(k => searchQ.toLowerCase().includes(k));
                    if(fallback) {
                        addMessage('bot', `💡 <b>${fallback}</b><br><br>${FALLBACK_DEFS[fallback]}`);
                    } else {
                        addMessage('bot', "Yoh! 😅 I couldn't find exact info on that. Try asking about <strong>cells</strong>, <strong>atoms</strong>, or <strong>photosynthesis</strong> 🔬");
                    }
                }
            }
            setTimeout(() => showChips(q), 1800);
        }, 1100);
    }

    function extractTextbookSections(rawText) {
        const sections = { keyConcepts: [], newWords: [] };
        const kcMatch = rawText.match(/KEY CONCEPTS\s*([\s\S]*?)(?=KEY QUESTIONS|NatSci|ACTIVITY|\n\n\n|$)/i);
        if (kcMatch) sections.keyConcepts = kcMatch[1].split(/[•\n]/).map(s => s.trim()).filter(s => s.length > 8 && !s.startsWith('NatSci'));
        const nwMatch = rawText.match(/New words\s*([\s\S]*?)(?=NatSci|KEY|\n\n|$)/i);
        if (nwMatch) sections.newWords = nwMatch[1].split(/[•\n]/).map(s => s.trim()).filter(s => s.length > 2 && s.length < 30 && !/NatSci/i.test(s));
        return sections;
    }

    // ── Integrating Synthesize Answer & Intent Scoring ──
    function formatAnswer(query, rawText) {
        const q = query.toLowerCase();
        const intent = detectIntent(q);
        const sections = extractTextbookSections(rawText);
        const cleaned = rawText.replace(/NatSci&Tech_Gr5_Book\.indb[^\n]*/g, '').replace(/Chapter \d+:[^.!?\d]{3,60}/g, '').replace(/\b\d{2,3}\b/g, '').replace(/\s{2,}/g, ' ').trim();

        let sentences = cleaned.split(/(?<=[.!?])\s+|\n{2,}/).map(s => s.trim());
        sentences = sentences.filter(s => s.length > 20); 

        const keywords = q.replace(/[^a-z\s]/g, '').split(/\s+/).filter(w => w.length > 2);
        
        const scored = sentences.map(s => {
            const sl = s.toLowerCase();
            const st = s.trim();
            const isJunk = /^(do you|can you|list|find|explain|complete|write|draw|below is)/i.test(st);
            
            let score = keywords.reduce((n, kw) => n + (sl.includes(kw) ? 3 : 0), 0);
            
            // INTENT SCORING BOOST
            if (intent === "definition" && / is | are | defined as /.test(st)) score += 5;
            if (intent === "process" && /(process|occurs|happens|steps)/i.test(st)) score += 5;
            if (intent === "reason" && /(because|therefore|due to|since)/i.test(st)) score += 5;
            
            return { s, score: isJunk ? -10 : score };
        });

        const top = scored.filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 5).map(x => x.s);

        if (top.length === 0) {
            const fallback = Object.keys(FALLBACK_DEFS).find(k => q.includes(k));
            if(fallback) return `💡 <b>${fallback}</b><br><br>${FALLBACK_DEFS[fallback]}`;
            return "Eish chommie! 😅 I don't think that topic is clearly in our Grade 7 textbook. Try asking differently!";
        }

        // SYNTHESIZE ANSWER / THESIS INJECTION
        const summary = top.slice(0, 2).join(" ");
        let html = `🤔 <b>Here’s the idea:</b><br><br>${summary}<br><br>💡 <b>In simple terms:</b> ${simplify(summary)}<br><br>`;
        
        if (top.length > 2) {
            html += `🔍 <b>More detail:</b><br><br>` + top.slice(2).map(s => `📌 ${s}`).join('<br><br>');
        }
        
        if (sections.keyConcepts.length > 0) {
            html += `<br><div style="background:#e8f5e9;border-left:3px solid #10b981;padding:10px 12px;border-radius:8px;margin-top:6px;"><strong>💡 Key Concepts</strong><br>` + sections.keyConcepts.slice(0,3).map(c => `• ${c}`).join('<br>') + `</div>`;
        }
        return html;
    }

    function routeQuery(q) {
        const qClean = q.trim().toLowerCase();
        
        if (qClean === 'explain it simply' || qClean === 'explain') { chipAction('explain', lastQuery); return; }
        if (qClean === 'give an example'   || qClean === 'example') { chipAction('example', lastQuery); return; }
        if (qClean === 'go deeper'         || qClean === 'deeper')  { chipAction('deeper',  lastQuery); return; }
        if (qClean === 'menu' || qClean.includes('topic menu')) { showTopicMenu(); return; }
        if (qClean === 'glossary') { showGlossary(null); return; }

        const questionStarters = ["what","how","why","when","where","which","name","list","define","explain","describe"];
        const isQuestion = questionStarters.some(s => qClean.startsWith(s)) && qClean.split(' ').length >= 2;
        
        const isGlossaryTerm = Object.keys(GLOSSARY).some(k => k.toLowerCase() === qClean);
        const isTopicKeyword = Object.values(TOPIC_OVERVIEWS).some(ov => ov.keywords.some(kw => kw.toLowerCase() === qClean));

        if (isQuestion || isGlossaryTerm || isTopicKeyword || qClean.length > 4) {
            handlePDFQuery(q);
        } else {
            addMessage('bot', SA_ULTRA_FLOW.encouragement[0]);
        }
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        div.innerHTML = text + `<div class="timestamp">${time}</div>`;
        
        const box = document.getElementById('messages');
        box.insertBefore(div, typingIndicator); 
        box.scrollTop = box.scrollHeight; 
        
        if(role === 'bot' && navigator && navigator.vibrate) navigator.vibrate(50);
    }

    function handleSend() {
        const input = document.getElementById('userInput');
        const query = input.value.trim();
        if (!query) return;

        addMessage('user', query);
        input.value = ''; 
        
        const q = query.toLowerCase();
        
        if (q.includes("electricity") || q.includes("power") || q.includes("load shedding") || q.includes("eskom")) {
            showTyping();
            setTimeout(() => {
                hideTyping();
                addMessage('bot', "Yoh, electricity? ⚡ Just don't ask me what time stage 6 load shedding starts, ne? Eskom stresses me out! 😂 Anyway, let's look at the science...");
                setTimeout(() => handlePDFQuery(q), 1500);
            }, 800);
            return;
        }

        if (["hi", "hello", "aweh", "howzit", "heita"].some(g => q.startsWith(g))) { showTyping(); setTimeout(() => { hideTyping(); addMessage('bot', SA_ULTRA_FLOW.greetings[Math.floor(Math.random() * SA_ULTRA_FLOW.greetings.length)]); }, 600); return; }
        if (q.includes("leslee")) {
            showTyping(); setTimeout(() => { hideTyping(); addMessage('bot', "Yoh 😄 Leslee is not just anyone — she's the visionary behind everything here. Big boss vibes! 🔥"); }, 800); return;
        }
        routeQuery(q);
    }

    function openChat() { document.getElementById('chat-modal').style.display = 'flex'; document.getElementById('maxi-fab').classList.add('hidden'); }
    function closeChat() { document.getElementById('chat-modal').style.display = 'none'; document.getElementById('maxi-fab').classList.remove('hidden'); }

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function() {
            const modal = document.getElementById('chat-modal');
            const vvHeight = window.visualViewport.height;
            const windowHeight = window.innerHeight;
            if (windowHeight - vvHeight > 100) { modal.style.height = vvHeight + 'px'; modal.style.top = (windowHeight - vvHeight) + 'px'; } 
            else { modal.style.height = ''; modal.style.top = '0'; }
        });
    }

    (function startLoading() {
        const fab = document.getElementById('maxi-fab');
        if (fab) fab.classList.add('hidden');
        initResources();
    })();
</script>
