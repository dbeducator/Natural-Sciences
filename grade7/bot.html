<html lang="en">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
        .page-img { width:100%; border-radius:10px; margin-top:8px; border:1px solid #ddd; display:block; cursor:zoom-in; }
        .page-img-wrap { position:relative; background:#f5f5f5; border-radius:10px; margin-top:8px; min-height:60px; }
        .page-img-label { font-size:11px; color:#aaa; text-align:right; padding:2px 6px; }

        #img-zoom-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        #img-zoom-modal.open { display:flex; }

        #img-zoom-label { color:#ccc; font-size:13px; margin-top:10px; }

    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        html { height: 100%; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background:#0a1a33; height: 100%; margin:0; overflow:hidden; }

        #maxi-fab { position:fixed; bottom:25px; left:25px; width:60px; height:60px; background:#10b981; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.5); z-index:999; border:3px solid #fff; transition:opacity 0.2s; }
        #maxi-fab img { width:85%; height:85%; border-radius:50%; object-fit: cover; }
        #maxi-fab.hidden { opacity:0; pointer-events:none; }

        #chat-modal { display:flex; flex-direction:column; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(7, 7, 12, 0.95); z-index:1000; }

        .chat-header { background:#0a1a33; padding:15px; display:flex; align-items:center; gap:12px; color:white; border-bottom:3px solid #10b981; }

        .msg { max-width:85%; padding:12px 16px; border-radius:18px; line-height:1.4; font-size:16px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        .bot { align-self:flex-start; background:white; color:#333; border-bottom-left-radius:2px; }
        .user { align-self:flex-end; background:#10b981; color:white; border-bottom-right-radius:2px; }

        .chat-input-area { padding:15px; background:white; display:flex; gap:10px; border-top:1px solid #ddd; flex-shrink:0; }
        .chat-input-area input { flex:1; padding:12px; border-radius:25px; border:1px solid #ccc; outline:none; font-size:16px; color:#333; background:#fff; -webkit-text-fill-color:#333; }
        .send-btn { background:#10b981; color:white; border:none; padding:10px; height:45px; border-radius:25px; font-weight:bold; cursor:pointer; }

        /* Suggestion chips */
        .chip-row { display:flex; flex-wrap:wrap; gap:8px; padding:6px 0 2px; }
        .chip {
            background:#e8f5f0; color:#0a6e50; border:1.5px solid #10b981;
            border-radius:20px; padding:7px 16px; font-size:14px; font-weight:600;

<div id="maxi-fab" onclick="openChat()"><img src="cat_full.png"></div>

<div id="chat-modal">
    <div class="chat-container">
        <div class="chat-header">

<!-- Image zoom modal -->
<div id="img-zoom-modal" onclick="closeZoom(event)">
    <button id="img-zoom-close" onclick="closeZoom()">×</button>
    <img id="img-zoom-src" src="">
    <div id="img-zoom-label"></div>
</div>

<script>
    function openZoom(src, label) {
        document.getElementById('img-zoom-src').src = src;
        document.getElementById('img-zoom-label').textContent = label || '';
        document.getElementById('img-zoom-modal').classList.add('open');
    }
    function closeZoom(e) {
        if (!e || e.target === document.getElementById('img-zoom-modal') || e.target === document.getElementById('img-zoom-close')) {
            document.getElementById('img-zoom-src').src = '';
            document.getElementById('img-zoom-modal').classList.remove('open');
        }
    }
    // Event delegation — handles all dynamically injected interactive elements
    function handleDelegatedTap(target) {
        if (!target) return;
        let el = target;
        for (let i = 0; i < 5; i++) {
            if (!el || el === document.body) break;
            if (el.dataset) {
                // Ready-message action chips
                if (el.dataset.action) {
                    if (el.dataset.action === 'menu')    { showTopicMenu(); return; }
                    if (el.dataset.action === 'glossary'){ showGlossary(null); return; }
                    if (el.dataset.action === 'quiz')    { startQuiz(); return; }
                }
                if (el.dataset.kwsearch) {
                    addMessage('user', el.dataset.kwsearch);
                    setTimeout(() => handlePDFQuery(el.dataset.kwsearch), 100);
                    return;
                }
                if (el.dataset.term) {
                    lookupTerm(el.dataset.term, parseInt(el.dataset.page) || 0);
                    return;
                }
                if (el.dataset.zoompage) {
                    const pg = parseInt(el.dataset.zoompage);
                    const cached = PAGE_IMAGES[pg];
                    if (cached) { openZoom(cached, el.dataset.zoomlabel || ''); }
                    else { renderPageImage(pg).then(d => { if(d) openZoom(d, el.dataset.zoomlabel||''); }); }
                    return;
                }
            }
            el = el.parentElement;
        }
    }
    document.addEventListener('click', function(e) { handleDelegatedTap(e.target); });
    document.addEventListener('touchend', function(e) {
        const touch = e.changedTouches && e.changedTouches[0];
        if (!touch) return;
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (!el) return;
        let node = el;
        for (let i = 0; i < 5; i++) {
            if (!node || node === document.body) break;
            if (node.dataset && (node.dataset.kwsearch || node.dataset.term || node.dataset.zoompage)) {
                e.preventDefault();
                handleDelegatedTap(node);
                return;
            }
            node = node.parentElement;
        }
        // not our element — let browser handle normally
    }, { passive: false });
</script>

<script>
    let knowledgeBase = [];
    let fuse = null;
    let fuseFallback = null;
    let personalInquiryCount = 0;
    let pdfReady = false;
    let pendingQuery = null;   // Queue one question asked before PDF is ready

    // Page image cache — rendered lazily from PDF
    const PAGE_IMAGES = {};   // page number → base64 data URL
    let pdfDocRef = null;     // keep reference to loaded PDF

    async function renderPageImage(pageNum) {
        if (PAGE_IMAGES[pageNum]) return PAGE_IMAGES[pageNum];
        if (!pdfDocRef) return null;
        try {
            const page = await pdfDocRef.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
            PAGE_IMAGES[pageNum] = dataUrl;
            return dataUrl;
        } catch(e) {
            console.warn('Page render failed for page', pageNum, e);
            return null;
        }
    }

    // Show a page image in the chat for a given page number
    function showPageImage(pageNum, label) {
        if (!pageNum || pageNum < 1 || !pdfDocRef) return;
        const uid = 'pg' + pageNum + '_' + Date.now();  // unique ID avoids collisions
        const lbl = `📄 Textbook p.${pageNum}${label ? ' · ' + label : ''}`;

        const div = document.createElement('div');
        div.className = 'msg bot';
        div.innerHTML = `<div class="page-img-wrap" id="${uid}">
            <div class="page-img-label">${lbl}</div>
            <div style="padding:10px;color:#aaa;font-size:13px;">⏳ Rendering p.${pageNum}...</div>
        </div>`;
        const box = document.getElementById('messages');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;

        renderPageImage(pageNum).then(dataUrl => {
            const wrap = document.getElementById(uid);
            if (!wrap) return;
            if (dataUrl) {
                // Store in cache and use page number reference — avoids large data attributes
                PAGE_IMAGES[pageNum] = dataUrl;
                const imgEl = document.createElement('img');
                imgEl.src = dataUrl;
                imgEl.className = 'page-img';
                imgEl.title = 'Tap to zoom';
                imgEl.dataset.zoompage = pageNum;
                imgEl.dataset.zoomlabel = `p.${pageNum}${label ? ' · '+label : ''}`;
                wrap.innerHTML = `<div class="page-img-label">${lbl} <span style="color:#10b981;font-size:11px;">🔍 tap to zoom</span></div>`;
                wrap.appendChild(imgEl);
            } else {
                wrap.innerHTML = `<div class="page-img-label" style="color:#e88;">📄 ${lbl} — image unavailable</div>`;
            }
            box.scrollTop = box.scrollHeight;
        });
    }

    // ── Chip state ────────────────────────────────────────────────────────
    let lastQuery = '';
    let lastRawAnswer = '';

    // Teacher-mode breakdown (called by chip only)
    function teacherExplain(rawText, query) {
        const sections = extractTextbookSections(rawText);
        let html = `📘 <b>Let's break it down chommie 👇</b><br><br>`;

        // Plain-language summary from sentences
        const cleaned = rawText
            .replace(/NatSci&Tech_Gr5_Book\.indb[^\n]*/g,'')
            .replace(/[a-z]{2,5}\/ph[a-z]{3,}\/[^\s]{8,}/g, '')
            .replace(/ckg\/\w+\/[^\s]*/g, '')
            .replace(/F1le:[^\s]*/g, '')
            .replace(/Chapter [A-Za-z\s]+ \d+\.\s*/g, '')
            .replace(/\s{2,}/g,' ');
        const sentences = (cleaned.match(/[^.!?]{20,}[.!?]+/g)||[]).map(s=>s.trim());
        const keywords = (query||lastQuery).toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w=>w.length>2);
        const best = sentences.filter(s => {
            const sl=s.toLowerCase();
            const isJunk=/^(do you|can you|list|find|draw|write|look at|think about|describe|complete)/i.test(s);
            return !isJunk && keywords.some(k=>sl.includes(k));
        }).slice(0, 4);

        html += `🧠 <b>What the textbook says:</b><br>${best.map(s=>`📌 ${s}`).join('<br><br>')}<br><br>`;
        html += `💡 <b>Simple version:</b> Strip away the big words — the key idea is what those sentences describe. That's the concept in a nutshell!<br><br>`;
        // Topic-aware SA example
        const tq = (query || lastQuery || '').toLowerCase();
        const saTeach =
              tq.includes('acid') || tq.includes('base') || tq.includes('ph')
            ? "SA mines produce sulfuric acid from gold processing — your stomach uses hydrochloric acid. Acids are everywhere in SA life! 🧪"
            : tq.includes('biosphere') || tq.includes('atmosphere') ? "SA's 9 biomes show all three components of the biosphere — lithosphere, hydrosphere and atmosphere — working together! 🌍"
            : tq.includes('biodiversity') ? "The Cape Floral Kingdom has more plant species per square km than the Amazon — SA biodiversity is world-class! 🌺"
            : tq.includes('reproduct') || tq.includes('pollinat') ? "Cape sugarbirds pollinate fynbos — without them, hundreds of SA plant species would vanish! 🌸"
            : tq.includes('energy') || tq.includes('renewable') ? "SA's Eskom crisis shows why renewable energy matters — the Karoo has world-class solar and wind resources! ⚡"
            : tq.includes('heat') || tq.includes('conduction') ? "Joburg's Highveld thunderstorms — convection heating air rapidly, creating violent afternoon storms! 🌡️"
            : tq.includes('periodic') || tq.includes('element') ? "SA mines gold (Au), platinum (Pt) and manganese (Mn) — periodic table elements from SA soil every day! ⚗️"
            : tq.includes('moon') || tq.includes('eclipse') || tq.includes('tide') ? "SA's coastlines experience tides twice daily — the Moon pulling the Indian and Atlantic Oceans! 🌕"
            : tq.includes('astronomy') || tq.includes('telescope') ? "SA's SALT telescope in Sutherland and MeerKAT in the Karoo make SA a world astronomy leader! 🔭"
            : "In South Africa you can see this everywhere — from the Karoo to Soweto to the ocean. Science is all around us! 🌍";
                html += `👀 <b>Real-life SA example:</b> ${saTeach}`;

        if (sections.keyQuestions.length > 0) {
            html += `<br><br><div style="background:#fff8e1;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:8px;">`;
            html += `<strong>🔑 Key Questions to Think About</strong><br>`;
            html += sections.keyQuestions.map(q=>`• ${q}`).join('<br>');
            html += `</div>`;
        }
        if (sections.keyConcepts.length > 0) {
            html += `<br><div style="background:#e8f5e9;border-left:3px solid #10b981;padding:10px 12px;border-radius:8px;">`;
            html += `<strong>💡 Key Concepts</strong><br>`;
            html += sections.keyConcepts.map(c=>`• ${c}`).join('<br>');
            html += `</div>`;
        }
        if (sections.newWords.length > 0) {
            html += buildNewWordsHTML(sections.newWords);
        }
        return html;
    }

    // Show clickable suggestion chips
    // Build green chip row for New Words — uses data attributes, no inline onclick
    function buildNewWordsHTML(words) {
        if (!words || words.length === 0) return '';
        let html = `<br><div style="background:#f3e8ff;border-left:3px solid #a855f7;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
        html += `<strong>📝 New Words</strong><br><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">`;
        words.forEach(w => {
            const entry = GLOSSARY[w] || GLOSSARY[w.toLowerCase()] || GLOSSARY[w.charAt(0).toUpperCase() + w.slice(1)];
            const pg = entry ? entry.page : 0;
            // Green chip with data attributes — event delegation handles the tap
            html += `<span data-term="${w.replace(/"/g,'&quot;')}" data-page="${pg}" style="background:#e8f5f0;color:#0a6e50;border:1.5px solid #10b981;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;">${w}${pg ? '<span style=\"color:#10b981;font-size:11px;\"> p.'+pg+'</span>' : ''}</span>`;
        });
        html += `</div></div>`;
        return html;
    }

    function showChips(topic) {
        const chips = [
            { label:"📖 Explain it simply", action:"explain" },
            { label:"💡 Give an example",   action:"example" },
            { label:"🔍 Go deeper",         action:"deeper"  },
            { label:"🧪 Quiz me on this",   action:"quiz"    }
        ];
        const box = document.getElementById('messages');
        const row = document.createElement('div');
        row.className = 'chip-row';
        chips.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'chip';
            btn.textContent = c.label;
            btn.onclick = () => chipAction(c.action, topic);
            row.appendChild(btn);
        });
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
    }

    function chipAction(action, topic) {
        const labels = { explain:"Explain it simply", example:"Give an example", deeper:"Go deeper", quiz:"Quiz me on this" };
        addMessage('user', labels[action]);

        setTimeout(() => {
            if (action === 'quiz') { startQuiz(); return; }

            if (!lastRawAnswer) {
                addMessage('bot', "Eish 😅 ask me a topic question first, then I can do that for you!");
                setTimeout(() => showChips(topic), 600);
                return;
            }

            if (action === 'explain') {
                addMessage('bot', teacherExplain(lastRawAnswer, lastQuery));

            } else if (action === 'example') {
                const lq = lastQuery.toLowerCase();
                const saContext =
                      lq.includes('acid') || lq.includes('base') || lq.includes('ph')
                    ? "SA mines produce sulfuric acid processing gold and platinum ores — and your stomach uses hydrochloric acid to digest food! 🧪"
                    : lq.includes('biosphere') || lq.includes('atmosphere') || lq.includes('lithosphere')
                    ? "SA has 9 biomes — from the lush Garden Route to the dry Karoo. The biosphere here is one of the richest on Earth! 🌍"
                    : lq.includes('biodiversity') || lq.includes('adaptation') || lq.includes('species')
                    ? "SA is a biodiversity hotspot — the Cape Floral Kingdom has more plant species per square km than the Amazon! 🌺"
                    : lq.includes('reproduct') || lq.includes('pollinat') || lq.includes('fertilisa')
                    ? "Cape sugarbirds and sunbirds pollinate fynbos flowers — without them, hundreds of SA plant species would go extinct! 🌸"
                    : lq.includes('energy') || lq.includes('renewable') || lq.includes('eskom') || lq.includes('coal')
                    ? "SA gets 80% of its electricity from coal — but the Karoo has some of the best solar and wind energy resources on Earth! ⚡"
                    : lq.includes('kinetic') || lq.includes('potential')
                    ? "The Gariep Dam converts gravitational potential energy into electricity — water falling 90m powers thousands of SA homes! 🏃"
                    : lq.includes('heat') || lq.includes('conduction') || lq.includes('insulation')
                    ? "SA's Highveld thunderstorms are convection at work — hot ground heats air rapidly, causing violent updrafts! 🌡️"
                    : lq.includes('periodic') || lq.includes('element') || lq.includes('atom')
                    ? "SA mines gold (Au), platinum (Pt) and manganese (Mn) — all real elements on the periodic table mined from SA soil! ⚗️"
                    : lq.includes('mixture') || lq.includes('separat') || lq.includes('filter')
                    ? "SA's water treatment plants use filtration, sedimentation and chlorination to make safe drinking water from rivers! 🔬"
                    : lq.includes('moon') || lq.includes('eclipse') || lq.includes('tide')
                    ? "SA's coastlines experience tides twice daily — the Moon's gravity pulling the Indian and Atlantic Oceans! 🌕"
                    : lq.includes('sun') || lq.includes('season') || lq.includes('orbit')
                    ? "SA experiences opposite seasons to Europe — when it's winter in London it's summer in Cape Town, because of Earth's tilted axis! ☀️"
                    : lq.includes('astronomy') || lq.includes('telescope') || lq.includes('salt') || lq.includes('meerkat')
                    ? "SA is a world astronomy leader — the <b>SALT telescope</b> in Sutherland and <b>MeerKAT</b> in the Karoo are among the most powerful on Earth! 🔭"
                    : "In South Africa you can see science everywhere — from the Karoo to Soweto to the ocean. Science is all around us! 🌍";
                                let html = `💡 <b>Real-life example — ${lastQuery}</b><br><br>🇿🇦 <b>SA Connection:</b><br>${saContext}`;
                if (sections.questions.length > 0) {
                    html += `<br><br><div style="background:#e8f0fe;border-left:3px solid #6366f1;padding:10px 12px;border-radius:8px;">`;
                    html += `<strong>❓ Think About It</strong><br>`;
                    html += sections.questions.slice(0,3).map(q=>`• ${q}`).join('<br>');
                    html += `</div>`;
                }
                addMessage('bot', html);

            } else if (action === 'deeper') {
                if (fuse) {
                    const results = fuse.search(lastQuery, { limit: 6 });
                    if (results.length > 0) {
                        const rawText = results.map(r => r.item.text).join(' ');
                        const deepAnswer = formatAnswer(lastQuery, rawText);
                        addMessage('bot', `🔍 <b>Going deeper on "${lastQuery}" 👇</b><br><br>${deepAnswer}`);
                    } else {
                        addMessage('bot', "Eish 😅 I couldn't find more detail on that. Try rephrasing chommie!");
                    }
                }
            }
            setTimeout(() => showChips(topic), 700);
        }, 350);
    }

    // ── PDF chunk search system ───────────────────────────────────────────
    let PDF_CHUNKS = [];

    const SYNONYMS = {
        electricity: ["current","power","voltage","electric","electrical energy"],
        rocks: ["stone","mineral","rock","geology","igneous","metamorphic"],
        fossils: ["fossil","prehistoric","fossilized","fossilised","remains"],
        skeleton: ["backbone","spine","skull","rib","vertebrae","endoskeleton"],
        metal: ["iron","copper","steel","aluminium","gold","silver","zinc","rust"],
        food: ["eat","feed","nutrition","diet","predator","prey"],
        plant: ["tree","flower","leaf","photosynthesis","seed","root","stem"],
        animal: ["creature","organism","mammal","reptile","bird","fish"],
        circuit: ["electrical circuit","series circuit","parallel circuit","conductor","switch","bulb"],
        fuel: ["coal","petrol","diesel","gas","fossil fuel","burn","combustion"],
        structure: ["frame","shell","support","beam","column","strut","load"],
        surface: ["crust","layer","mantle","core","ground","soil","lithosphere"],
        sediment: ["sedimentary","sand","mud","gravel","deposit","compacted","layer"],
        material: ["substance","raw material","processed","natural","manufactured"],
        ligament: ["joint","tendon","connective","tissue","bone connection"],
        amphibian: ["frog","toad","salamander","newt","tadpole","metamorphosis"],
        reptile: ["snake","lizard","crocodile","tortoise","scales","cold blooded"],
        photosynthesis: ["chlorophyll","sunlight","carbon dioxide","oxygen","glucose","leaves"],
        producer: ["plant","photosynthesis","makes food","autotroph","green plant"],
        consumer: ["herbivore","carnivore","omnivore","eats","feeds on","heterotroph"],
        vertebrate: ["backbone","spine","fish","amphibian","reptile","bird","mammal"],
        invertebrate: ["no backbone","insect","worm","crab","snail","spider"],
        weathering: ["erosion","breaking down","wind","water","rock fragments"],
        conductor: ["copper","metal","allows electricity","low resistance"],
        insulator: ["rubber","plastic","wood","prevents electricity","high resistance"],
        potential: ["stored energy","elastic","spring","compressed","stretched","catapult","movement energy"],
        movement: ["kinetic energy","motion","speed","force","work","input","output"],
        gravity: ["weight","mass","pull","fall","drop","earth pulls"],

    function normalizePDF(text) {
        return text.toLowerCase().replace(/[^\w\s]/g, "").trim();
    }

    function getKeywords(q) {
        const words = normalizePDF(q).split(" ").filter(w => w.length > 2);
        const expanded = [...words];
        words.forEach(w => {
            if (SYNONYMS[w]) expanded.push(...SYNONYMS[w]);
        });
        return [...new Set(expanded)];
    }

    function scoreChunk(chunk, keywords) {
        const text = normalizePDF(chunk);
        const raw = chunk.toLowerCase();

        // Penalise question chunks — they contain keywords but aren't answers
        const trimmed = chunk.trim();
        if (trimmed.endsWith('?')) return -5;
        if (/^(what |how |why |which |give |list |name |describe |explain |below is|now we are|show where|carefully study)/i.test(trimmed)) return -8;

        // Penalise activity/instruction chunks heavily
        const isJunk = /^(now give|do not tell|use the knife|tap gently|cut out|paste|tick|fill in|write the names|perhaps an adult|as such the|they are designed|enabling activities|learners will have|if possible combine|hint what other|indb 20)/i.test(trimmed);
        if (isJunk) return -10;

        let score = 0;
        keywords.forEach(k => { if (text.includes(k)) score += 2; });

        // Bonus: exact phrase
        const joined = keywords.slice(0, 3).join(" ");
        if (joined.length > 3 && text.includes(joined)) score += 5;

        // Bonus: definitive sentences (starts with topic word)
        if (keywords.some(k => raw.startsWith(k))) score += 3;

        // Bonus: contains a definition pattern ("X is..." or "X are...")
        if (/ is | are | means | refers to /i.test(chunk)) score += 2;

        // Bonus: shorter = more precise (but not too short)
        if (chunk.length > 60 && chunk.length < 300) score += 2;

        // Penalise list-like chunks (components, materials lists)
        if (/^[A-Z][a-z]+,\s|,\s[a-z]+ [a-z]+,/i.test(chunk)) score -= 3;

        // Penalise teacher/activity language
        if (/teacher|learner|activity|exercise book|instruction|materials:|question:/i.test(raw)) score -= 3;

        return score;
    }

    function searchPDFChunks(q) {
        if (PDF_CHUNKS.length === 0) return null;
        const keywords = getKeywords(q);
        let bestScore = 0;
        let bestIndex = 0;

        PDF_CHUNKS.forEach((chunk, i) => {
            const score = scoreChunk(chunk, keywords);
            if (score > bestScore) { bestScore = score; bestIndex = i; }
        });

        if (bestScore === 0) return null;

        // Return context window: best chunk + neighbours
        return [
            PDF_CHUNKS[bestIndex - 1] || "",
            PDF_CHUNKS[bestIndex],
            PDF_CHUNKS[bestIndex + 1] || ""
        ].join(" ").trim();
    }

    function preparePDFChunks(fullText) {
        PDF_CHUNKS = fullText
            .split(/(?<=[.!?])\s+/)   // split on sentence boundaries
            .map(t => t.replace(/\s+/g, ' ').trim())
            .filter(t => t.length > 40 && t.length < 600);
    }

    // ── Lookup a single glossary term ─────────────────────────────────────
    function lookupTerm(term, page) {
        addMessage('user', `Tell me about: ${term}`);
        const entry = GLOSSARY[term];
        const pageHint = page || (entry ? entry.page : 0);
        const topicHint = entry ? entry.topic : '';

        // If we have a page number, pull that page directly — most reliable
        if (pageHint && knowledgeBase.length > 0) {
            // Pull the known page + 2 surrounding pages for context
            const pageResults = knowledgeBase.filter(p =>
                p.page >= pageHint - 1 && p.page <= pageHint + 3
            );
            if (pageResults.length > 0) {
                const rawText = pageResults.map(p => p.text).join(' ');
                lastQuery = term;
                lastRawAnswer = rawText;
                const answer = formatAnswer(term, rawText);
                const actualPage = pageResults[0].page || pageHint;
                const pageRef = `<div style="color:#888;font-size:12px;margin-bottom:4px;">📄 p.${actualPage}${topicHint ? ' · ' + topicHint : ''}</div>`;
                addMessage('bot', pageRef + answer);
                setTimeout(() => showPageImage(actualPage, term), 400);
                setTimeout(() => showChips(term), 700);
                return;
            }
        }

        // Always full Fuse search for rich Key Concepts, Questions, New Words
        if (fuse) {
            const tLower = term.toLowerCase();
            // Strategy 1: exact substring
            let results = knowledgeBase
                .filter(p => p.text.toLowerCase().includes(tLower))
                .slice(0, 6).map(p => ({ item: p }));
            // Strategy 2: all words
            if (results.length === 0 && term.includes(' ')) {
                const words = tLower.split(/\s+/).filter(w => w.length > 2);
                results = knowledgeBase
                    .filter(p => words.every(w => p.text.toLowerCase().includes(w)))
                    .slice(0, 6).map(p => ({ item: p }));
            }
            // Strategy 3: longest word
            if (results.length === 0) {
                const longest = term.split(/\s+/).sort((a,b) => b.length-a.length)[0];
                results = knowledgeBase
                    .filter(p => p.text.toLowerCase().includes(longest.toLowerCase()))
                    .slice(0, 4).map(p => ({ item: p }));
            }
            // Strategy 4: Fuse
            if (results.length === 0) results = fuse.search(term, { limit: 6 });
            if (results.length === 0 && fuseFallback) results = fuseFallback.search(term, { limit: 4 });
            if (results.length > 0) {
                const rawText = results.map(r => r.item.text).join(' ');
                lastQuery = term;
                lastRawAnswer = rawText;
                const answer = formatAnswer(term, rawText);
                const pageRef = pageHint ? `<div style="color:#888;font-size:12px;margin-bottom:4px;">📄 p.${pageHint}${topicHint ? ' · ' + topicHint : ''}</div>` : '';
                addMessage('bot', pageRef + answer);
                // Show the actual textbook page image
                const actualPage = (results[0].item && results[0].item.page) || pageHint;
                if (actualPage) {
                    setTimeout(() => showPageImage(actualPage, term), 400);
                }
            } else {
                addMessage('bot', `Eish 😅 I couldn't find info on "<b>${term}</b>" in the textbook. Try asking it differently chommie!`);
            }
            setTimeout(() => showChips(term), 700);
        }
    }

            let html = `${ov.emoji} <b>${topic}</b> <span style="color:#888;font-size:12px;">${ov.term}</span><br><br>`;

            });

            addMessage('bot', html);

            // Then pull real textbook content + page image
            function tryLoadTopic(attempts) {
                const topicRange = TOPIC_PAGE_MAP[topic];
                let rawText = '';
                // Strategy 1: page range (accurate because we have the real TOC)
                if (knowledgeBase.length > 0 && topicRange) {
                    const pages = knowledgeBase.filter(p => p.page >= topicRange.start && p.page <= topicRange.end);
                    rawText = pages.map(p => p.text).join(' ');
                }
                // Strategy 2: keyword scan
                if (rawText.length < 100 && TOPIC_OVERVIEWS[topic]) {
                    const kws = TOPIC_OVERVIEWS[topic].keywords.slice(0, 4);
                    const pages = knowledgeBase.filter(p => kws.some(kw => p.text.toLowerCase().includes(kw.toLowerCase())));
                    rawText = pages.slice(0, 8).map(p => p.text).join(' ');
                }
                // Strategy 3: Fuse
                if (rawText.length < 100 && fuse) {
                    rawText = fuse.search(topic, { limit: 5 }).map(r => r.item.text).join(' ');
                }
                if (rawText.length > 100) {
                    lastQuery = topic;
                    lastRawAnswer = rawText;
                    const topicKw = (TOPIC_OVERVIEWS[topic] && TOPIC_OVERVIEWS[topic].keywords[0]) || topic;
                    addMessage('bot', formatAnswer(topicKw, rawText));
                    if (topicRange) setTimeout(() => showPageImage(topicRange.start, topic), 300);
                    setTimeout(() => showChips(topic), 1000);
                } else if (attempts > 0) {
                    setTimeout(() => tryLoadTopic(attempts - 1), 1500);
                } else {
                    addMessage('bot', "Eish 😅 couldn't load that chapter content right now. Try a keyword from the chips above!");
                    setTimeout(() => showChips(topic), 500);
                }
            }
            setTimeout(() => tryLoadTopic(3), 500);

        } else {
            // Fallback for topics without an overview
            handlePDFQuery(topic);
        }
    }

    function isLikelyLearningIntent(q) {
        q = q.toLowerCase();
        // Must start with a question word AND have a science-like noun
        const questionStarters = ["what","how","why","when","where","which","name","list","define","explain","describe"];
        const startsAsQuestion = questionStarters.some(s => q.startsWith(s));
        if (!startsAsQuestion) return false;
        // Must be more than 2 words to avoid "what?" or "how?"
        if (q.split(' ').length < 2) return false;
        return true;
    }

    // ── PDF query handler ─────────────────────────────────────────────────
    function handlePDFQuery(q) {
        userState.inLearningMode = true;

        if (!fuse) {
            // Queue only the FIRST question asked — don't overwrite with later ones
            if (!pendingQuery) pendingQuery = q;
            addMessage('bot', "Eish chommie, I'm still loading the textbook 📚 Hold on — I'll answer that the moment it's ready! 🔄");
            // Show a typing indicator so they know something is happening
            setTimeout(() => {
                if (!pdfReady) {
                    addMessage('bot', "Still loading... 📖 Hang tight chommie, big textbook! While you wait — try asking about <b>biosphere</b>, <b>acids</b>, or <b>energy</b> once I'm ready.");
                }
            }, 4000);
            return;
        }

        // Skip words guard
        const skipWords = new Set(['nice','good','ok','okay','cool','yes','no','wow','great','lol','haha','sure','thanks','fine','ready','go']);
        if (q.split(' ').length <= 2 && skipWords.has(q.replace(/[^a-z]/g,''))) {
            addMessage('bot', mergedRand('encouragement'));
            return;
        }

        let response;
        // 4-strategy search — works regardless of how the PDF structures its text
        let results = [];
        const qLower = q.toLowerCase();

        // Strategy 1: exact phrase anywhere in any page
        const exact = knowledgeBase.filter(p => p.text.toLowerCase().includes(qLower));
        if (exact.length > 0) results = exact.slice(0, 6).map(p => ({ item: p }));

        // Strategy 2: all individual words present on same page
        if (results.length === 0) {
            const words = qLower.split(/\s+/).filter(w => w.length > 3);
            if (words.length > 1) {
                const allWords = knowledgeBase.filter(p =>
                    words.every(w => p.text.toLowerCase().includes(w))
                );
                results = allWords.slice(0, 6).map(p => ({ item: p }));
            }
        }

        // Strategy 3: Fuse fuzzy search
        if (results.length === 0) results = fuse.search(q, { limit: 6 });

        // Strategy 4: looser Fuse
        if (results.length === 0 && fuseFallback) results = fuseFallback.search(q, { limit: 4 });

        // Strategy 5: match on longest meaningful word (handles compound/hyphenated terms)
        if (results.length === 0) {
            const words = qLower.split(/\s+/).filter(w => w.length > 4);
            const longest = words.sort((a,b) => b.length-a.length)[0];
            if (longest) {
                results = knowledgeBase
                    .filter(p => p.text.toLowerCase().includes(longest))
                    .slice(0, 4).map(p => ({ item: p }));
            }
        }

        // Strategy 6: topic page range — find which topic this query belongs to
        //             and pull directly from those pages
        if (results.length === 0) {
            for (const [topic, range] of Object.entries(TOPIC_PAGE_MAP)) {
                const topicLower = topic.toLowerCase();
                const ov = TOPIC_OVERVIEWS[topic];
                const keywords = ov ? ov.keywords : [];
                if (topicLower.includes(qLower) || qLower.includes(topicLower.split(' ')[0]) ||
                    keywords.some(kw => qLower.includes(kw.toLowerCase()) || kw.toLowerCase().includes(qLower))) {
                    const pages = knowledgeBase.filter(p => p.page >= range.start && p.page <= Math.min(range.start + 5, range.end));
                    if (pages.length > 0) {
                        results = pages.slice(0, 4).map(p => ({ item: p }));
                        break;
                    }
                }
            }
        }
        if (results.length > 0) {
            const rawText = results.map(r => r.item.text).join(' ');
            lastQuery = q;
            lastRawAnswer = rawText;
            response = formatAnswer(q, rawText);
        } else {
            lastRawAnswer = '';
            response = mergedRand('confusion') + "<br><br>Try asking about <strong>biosphere</strong>, <strong>biodiversity</strong>, <strong>acids</strong>, <strong>periodic table</strong>, <strong>energy</strong> or <strong>the solar system</strong> 🔬";
        }

        addMessage('bot', response);

        // Show textbook page image from best matching result
        if (results.length > 0 && results[0].item) {
            const bestPage = results[0].item.page;
            if (bestPage) setTimeout(() => showPageImage(bestPage, q), 500);
        }

        // Personality inserts AFTER answer
        if (Math.random() < 0.35) {
            setTimeout(() => addMessage('bot', rand(SA_ULTRA_FLOW.praise)), 900);
        }
        if (Math.random() < 0.25) {
            setTimeout(() => addMessage('bot', rand(SA_ULTRA_FLOW.encouragement)), 1400);
        }

        // Show clickable suggestion chips
        setTimeout(() => showChips(q), 1800);
    }

    function startQuiz() {
        if (!knowledgeBase.length) {
            addMessage('bot', "Eish, still loading the textbook! 😅 Try again in a sec.");
            return;
        }

        const qaPairs = [];
        knowledgeBase.forEach(chunk => {

            // Match a question followed by answer content
            const matches = text.match(/([A-Z][^?]{15,}[?])\s*([^?]{30,}[.!])/g);
            if (matches) {
                matches.forEach(m => {
                    const parts = m.match(/^([^?]+[?])\s*(.+)$/s);
                    if (parts && parts[1] && parts[2]) {
                        const q = parts[1].trim();
                        const a = parts[2].trim().substring(0, 400);
                        // Skip activity/navigation/diagram instructions
                        const skip = /^(Do you|Can you|Look at|Think about|Draw|After you|Consider|Which cheek|Which direction|Stand facing|Turn to your|ACTIVITY|NatSci)/i.test(q);
                        // Must be a proper science question with substance
                        const hasContent = q.length > 20 && a.length > 30;
                        if (!skip && hasContent) {
                            qaPairs.push({ question: q, answer: a });
                        }
                    }
                });
            }
        });

        if (qaPairs.length === 0) {
            addMessage('bot', "Eish, I couldn't pull a question right now. 😅 Try asking me a topic!");

        addMessage('bot', `🧠 Quiz time chommie!<br><br><strong>${pick.question}</strong><br><br>Type your answer — then I'll show you what the textbook says!`);
    }
    // ── Extract structured textbook sections from raw PDF text ────────────
    function extractTextbookSections(rawText) {
        const sections = { keyQuestions: [], keyConcepts: [], questions: [], newWords: [] };

        // This textbook (Sasol Inzalo) uses various header formats
        // Try multiple patterns for Key Concepts / Keywords

        // Pattern 1: "KEY CONCEPTS" header
        const kcMatch1 = rawText.match(/KEY CONCEPTS\s*([\s\S]*?)(?=KEY QUESTIONS|ACTIVITY|NatSci|Keywords|\n\n\n|$)/i);
        if (kcMatch1) {
            const items = kcMatch1[1].split(/[•\n]/).map(s => s.trim()).filter(s => s.length > 8 && !/^(NatSci|\d+\.)/.test(s));
            sections.keyConcepts.push(...items);
        }

        // Pattern 2: "Keywords" box (this textbook uses this format)
        const kwMatch = rawText.match(/Keywords?\s*([\s\S]*?)(?=KEY QUESTIONS|ACTIVITY|NatSci|Did you know|Take note|\n\n\n|$)/i);
        if (kwMatch) {
            const items = kwMatch[1].split(/[•\n*]/).map(s => s.trim()).filter(s => s.length > 2 && s.length < 40 && !/^(NatSci|\d)/.test(s));
            sections.newWords.push(...items);
        }

        // Pattern 3: "Did you know?" and "Take note" boxes — often have good definition content
        const dykMatch = rawText.match(/Did you know\??[\s\S]*?(?=\n\n|\n[A-Z]|$)/i);
        if (dykMatch) {
            const text = dykMatch[0].replace(/Did you know\??/i, '').trim();
            if (text.length > 20) sections.keyConcepts.push(text.substring(0, 250));
        }
        const takeNoteMatch = rawText.match(/Take note[\s\S]*?(?=\n\n|\n[A-Z]|$)/i);
        if (takeNoteMatch) {
            const text = takeNoteMatch[0].replace(/Take note/i, '').trim();
            if (text.length > 20) sections.keyConcepts.push(text.substring(0, 250));
        }

        // Pattern 4: "Key questions" (lowercase, this textbook style)
        const kqMatch = rawText.match(/Key questions?\s*([\s\S]*?)(?=KEY CONCEPTS|Keywords|ACTIVITY|NatSci|\n\n\n|$)/i);
        if (kqMatch) {
            const items = kqMatch[1].split(/[•\n]/).map(s => s.replace(/^\d+[\.\)]\s*/, '').trim()).filter(s => s.length > 8 && s.endsWith('?'));
            sections.keyQuestions.push(...items);
        }

        // Pattern 5: Numbered questions anywhere in text
        const numbered = rawText.match(/^\d+\.\s+[A-Z][^?]{15,}\?/gm) || [];
        sections.questions.push(...numbered.map(s => s.replace(/^\d+\.\s+/, '').trim()).filter(s => s.length > 15));

        // Pattern 6: "New words" / glossary section
        const nwMatch = rawText.match(/New words?\s*([\s\S]*?)(?=NatSci|KEY|Did you|\n\n|$)/i);
        if (nwMatch) {
            const items = nwMatch[1].split(/[•\n]/).map(s => s.trim()).filter(s => s.length > 2 && s.length < 40 && !/NatSci/i.test(s));
            sections.newWords.push(...items);
        }

        // Deduplicate
        sections.keyConcepts = [...new Set(sections.keyConcepts)].slice(0, 6);
        sections.keyQuestions = [...new Set(sections.keyQuestions)].slice(0, 4);
        sections.newWords = [...new Set(sections.newWords)].slice(0, 8);

        return sections;
    }

    function formatAnswer(query, rawText) {
        const q = query.toLowerCase();

        // ── Step 1: Extract structured sections BEFORE cleaning ──────────
        const sections = extractTextbookSections(rawText);

        // ── Step 2: Clean text for definition sentences ──────────────────
        const cleaned = rawText
            .replace(/NatSci&Tech_Gr5_Book\.indb[^\n]*/g, '')
            .replace(/NatSci&Tech_Gr5_TG_Book\.indb[^\n]*/g, '')
            .replace(/(Life and living|Matter and materials|Energy and change|Planet Earth and beyond|Systems and control)[^\d]*\d+/g, '')
            .replace(/Chapter \d+:[^.!?\d]{3,60}/g, '')
            .replace(/KEY (CONCEPTS|QUESTIONS|WORDS?)[^.!?]*/g, '')
            .replace(/ACTIVITY \d+\.\d+[^.!?]*/g, '')
            .replace(/QUESTIONS?[^.!?]{0,10}(?=\s)/g, '')
            .replace(/REVISION[^.!?]*/g, '')
            .replace(/INSTRUCTIONS?:[^.!?]*/g, '')
            .replace(/New words[^.!?]*/g, '')
            .replace(/indb \d{4}[^.!?]*/g, '')
            // Strip all corrupt URL/path patterns from PDF text layer
            .replace(/[a-z]{2,5}\/ph[a-z]{3,}\/[^\s]{8,}/g, '')
            .replace(/ihm\/[a-z]+\/[^\s]*/g, '')
            .replace(/com\/photos\/[^\s]*/g, '')
            .replace(/ckg\/\w+\/[^\s]*/g, '')
            .replace(/F1le:[^\s]*/g, '')
            .replace(/Chapter [A-Za-z\s]+ \d+\.\s*/g, '')
            .replace(/\b[a-z]{2,3}\/[a-z]{4,}\/[a-z0-9_]{4,}\b/g, '')
            // Strip PDF built-in glossary entries bleeding into answers
            .replace(/Glossary [A-Z][a-z]+ To [^.!?]+[.!?]/g, '')
            .replace(/\bGlossary\b[^.!?]{0,200}/g, '')
            .replace(/\b\d{2,3}\b/g, '')
            .replace(/\s{2,}/g, ' ')
            .trim();

        // ── Step 3: Score and pick best definition sentences ─────────────
        const sentences = (cleaned.match(/[^.!?]{15,}[.!?]+/g) || []).map(s => s.trim());
        const keywords = q.replace(/[^a-z\s]/g, '').split(/\s+/).filter(w => w.length > 2);

        const scored = sentences.map(s => {
            const sl = s.toLowerCase();
            const st = s.trim();
            // Hard reject: pure activity instructions
            const isJunk = /^(do you|can you|list|find|identify|complete|use the|look at|write|draw|think about|give two|give an|now we|show where|carefully|below is|label|choose the|fill in|cut out|paste|tick|using a|you will need|in this activity|copy the|study the following|answer the following)/i.test(st);
            const isFileRef = /F1le:|ckg\/|atuo_|Rcyal|_%28|\.jpg|\.png|indb \d|ihm\/|phctco|pphtho|\/photos\//i.test(st);
            if (isJunk || isFileRef) return { s, score: -10 };

            // Score positively
            let score = 0;
            const kwScore = keywords.reduce((n, kw) => n + (sl.includes(kw) ? 3 : 0), 0);
            score += kwScore;
            // Boost definition-like sentences
            if (/ is | are | means | refers to | defined as | consists of /i.test(s)) score += 4;
            if (st.match(/^[A-Z][a-z]+ (is|are|was|were) /)) score += 3;
            // Reasonable length
            if (s.length > 40 && s.length < 400) score += 1;
            // Penalise questions (we have a separate section for those)
            if (st.endsWith('?')) score -= 3;
            // If nothing else, give a small positive score so we get SOMETHING
            if (score === 0 && s.length > 50 && s.length < 300) score = 1;

            return { s, score };
        });

        const top = scored
            .filter(x => x.score > 0)
            .sort((a, b) => b.score - a.score)
            .slice(0, 5)
            .map(x => x.s);

        if (top.length === 0) {
            // Aggressive fallback — any sentence that isn't obvious instruction junk
            const anyDecent = sentences.filter(s =>
                s.length > 35 && s.length < 400 &&
                !/^(do you|can you|list|find|identify|complete|use the|look at|write|draw|think about|give two|now we|show where|carefully|below is|label|choose|fill in|cut out|paste|tick|copy|study the following)/i.test(s) &&
                !/F1le:|ckg\/|indb \d|phctco/i.test(s)
            ).slice(0, 4);
            top.push(...anyDecent);
            // Also pull in keyConcepts (Keywords, Take note, Did you know)
            sections.keyConcepts.forEach(c => { if (!top.includes(c) && top.length < 5) top.push(c); });
            // Last resort — point to page image
            if (top.length === 0) {
                return `📖 The textbook page is shown above — tap the image to zoom in and read the full explanation. Then ask me something specific like <b>"what is ${q}?"</b> and I'll help explain it!`;
            }
        }
        // Always supplement with keyConcepts (Keywords/Take note/Did you know boxes)
        if (top.length < 3 && sections.keyConcepts.length > 0) {
            sections.keyConcepts.forEach(c => { if (!top.includes(c) && top.length < 5) top.push(c); });
        }

        const emoji = q.includes('rock') || q.includes('sediment') ? '🪨'
                    : q.includes('fossil') ? '🦕'
                    : q.includes('electr') || q.includes('circuit') || q.includes('batter') ? '⚡'
                    : q.includes('metal') ? '🔩'
                    : q.includes('plant') || q.includes('food chain') || q.includes('photosyn') ? '🌿'
                    : q.includes('animal') ? '🐾'
                    : q.includes('skeleton') || q.includes('bone') ? '🦴'
                    : q.includes('earth') || q.includes('season') || q.includes('planet') ? '🌍'
                    : q.includes('energy') || q.includes('fuel') || q.includes('coal') ? '🔥'
                    : q.includes('water') || q.includes('cloud') || q.includes('rain') ? '💧'
                    : q.includes('struct') ? '🏗️'
                    : q.includes('material') ? '🧱'
                    : q.includes('ligament') || q.includes('tendon') || q.includes('joint') ? '🦴'
                    : q.includes('amphibian') || q.includes('reptile') ? '🐸'
                    : q.includes('producer') || q.includes('consumer') ? '🌿'
                    : '🔬';

        // ── Step 4: Build rich structured response ───────────────────────
        let html = `Sho chommie! ${emoji} Here's what the textbook says:<br><br>`;
        html += top.map(s => `📌 ${s}`).join('<br><br>');

        if (sections.keyQuestions.length > 0) {
            html += `<br><br><div style="background:#fff8e1;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
            html += `<strong>🔑 Key Questions</strong><br>`;
            html += sections.keyQuestions.map(q => `• ${q}`).join('<br>');
            html += `</div>`;
        }

        if (sections.keyConcepts.length > 0) {
            html += `<br><div style="background:#e8f5e9;border-left:3px solid #10b981;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
            html += `<strong>💡 Key Concepts</strong><br>`;
            html += sections.keyConcepts.map(c => `• ${c}`).join('<br>');
            html += `</div>`;
        }

        if (sections.questions.length > 0) {
            html += `<br><div style="background:#e8f0fe;border-left:3px solid #6366f1;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
            html += `<strong>❓ Think About It</strong><br>`;
            html += sections.questions.slice(0, 3).map(q => `• ${q}`).join('<br>');
            html += `</div>`;
        }

        if (sections.newWords.length > 0) {
            html += buildNewWordsHTML(sections.newWords);
        }

        return html;
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = text;
        const box = document.getElementById('messages');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight; // Scroll to the latest message
    }

    function openChat() {
        document.getElementById('chat-modal').style.display = 'block';
        document.getElementById('maxi-fab').classList.add('hidden');
    }
    function closeChat() {
        document.getElementById('chat-modal').style.display = 'none';
        document.getElementById('maxi-fab').classList.remove('hidden');
        // Notify parent frame
        try { window.parent.postMessage('closeBot', '*'); } catch(e) {}
        // Navigate back if standalone
        if (window.self === window.top) {
            if (window.history.length > 1) window.history.back();
        }
    }
    // ── Keyboard push-up for Android WebView ─────────────────────────
    // When the virtual keyboard opens, visualViewport shrinks.
    // We shift the chat-modal up so the input stays visible.
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function() {
            const modal = document.getElementById('chat-modal');
            const vvHeight = window.visualViewport.height;
            const windowHeight = window.innerHeight;
            const keyboardHeight = windowHeight - vvHeight;
            if (keyboardHeight > 100) {
                // Keyboard is open — shrink modal to visual viewport height
                modal.style.height = vvHeight + 'px';
                modal.style.top = (windowHeight - vvHeight) + 'px';
                // Scroll messages to bottom so latest is visible
                const box = document.getElementById('messages');
                if (box) box.scrollTop = box.scrollHeight;
            } else {
                // Keyboard closed — restore
                modal.style.height = '';
                modal.style.top = '0';
            }
        });
        window.visualViewport.addEventListener('scroll', function() {
            const modal = document.getElementById('chat-modal');
            modal.style.top = window.visualViewport.offsetTop + 'px';
        });
    }

    // Start PDF loading immediately — don't wait for any event
    // Multiple triggers to handle Niotron WebViewer timing quirks
    (function startLoading() {
        // Hide FAB since chat opens immediately
        const fab = document.getElementById('maxi-fab');
        if (fab) fab.classList.add('hidden');
        // Configure worker (belt-and-suspenders — also done above)
        if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
        initResources();
    })();
    // Fallbacks in case the IIFE ran too early
    document.addEventListener('DOMContentLoaded', function() { if (!pdfReady && !pdfDocRef) initResources(); });
    window.addEventListener('load', function() { if (!pdfReady && !pdfDocRef) initResources(); });
    // Last-resort retry after 2s for slow WebViewer environments
    setTimeout(function() { if (!pdfReady && !pdfDocRef) initResources(); }, 2000);
</script>
