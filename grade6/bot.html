<script>
    function openZoom(src, label) {
        document.getElementById('img-zoom-src').src = src;
        document.getElementById('img-zoom-label').textContent = label || '';
        document.getElementById('img-zoom-modal').classList.add('open');
    }
    function closeZoom(e) {
        if (!e || e.target === document.getElementById('img-zoom-modal') || e.target === document.getElementById('img-zoom-close')) {
            document.getElementById('img-zoom-src').src = '';
            document.getElementById('img-zoom-modal').classList.remove('open');
        }
    }
    // Event delegation — handles all dynamically injected interactive elements
    function handleDelegatedTap(target) {
        // New Word chip tap
        const termEl = target.closest ? target.closest('[data-term]') : (target.dataset && target.dataset.term ? target : null);
        if (termEl && termEl.dataset.term) {
            lookupTerm(termEl.dataset.term, parseInt(termEl.dataset.page) || 0);
            return;
        }
        // Image zoom tap — use PAGE_IMAGES cache by page number instead of data-zoom
        const imgEl = target.closest ? target.closest('[data-zoompage]') : (target.dataset && target.dataset.zoompage ? target : null);
        if (imgEl && imgEl.dataset.zoompage) {
            const pg = parseInt(imgEl.dataset.zoompage);
            const cached = PAGE_IMAGES[pg];
            if (cached) openZoom(cached, imgEl.dataset.zoomlabel || '');
            return;
        }
    }
    document.addEventListener('click', function(e) { handleDelegatedTap(e.target); });
    document.addEventListener('touchend', function(e) {
        handleDelegatedTap(e.target);
    }, { passive: true });
</script>

<script>
    let knowledgeBase = [];
    let fuse = null;
    let personalInquiryCount = 0;
    let pdfReady = false;
    let pendingQuery = null;   // Queue one question asked before PDF is ready

    // Page image cache — rendered lazily from PDF
    const PAGE_IMAGES = {};   // page number → base64 data URL
    let pdfDocRef = null;     // keep reference to loaded PDF

    async function renderPageImage(pageNum) {
        if (PAGE_IMAGES[pageNum]) return PAGE_IMAGES[pageNum];
        if (!pdfDocRef) return null;
        try {
            const page = await pdfDocRef.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
            PAGE_IMAGES[pageNum] = dataUrl;
            return dataUrl;
        } catch(e) {
            console.warn('Page render failed for page', pageNum, e);
            return null;
        }
    }

    // Show a page image in the chat for a given page number
    function showPageImage(pageNum, label) {
        if (!pageNum || pageNum < 1 || !pdfDocRef) return;
        const uid = 'pg' + pageNum + '_' + Date.now();  // unique ID avoids collisions
        const lbl = `📄 Textbook p.${pageNum}${label ? ' · ' + label : ''}`;

        const div = document.createElement('div');
        div.className = 'msg bot';
        div.innerHTML = `<div class="page-img-wrap" id="${uid}">
            <div class="page-img-label">${lbl}</div>
            <div style="padding:10px;color:#aaa;font-size:13px;">⏳ Rendering p.${pageNum}...</div>
        </div>`;
        const box = document.getElementById('messages');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;

        renderPageImage(pageNum).then(dataUrl => {
            const wrap = document.getElementById(uid);
            if (!wrap) return;
            if (dataUrl) {
                // Store in cache and use page number reference — avoids large data attributes
                PAGE_IMAGES[pageNum] = dataUrl;
                const imgEl = document.createElement('img');
                imgEl.src = dataUrl;
                imgEl.className = 'page-img';
                imgEl.title = 'Tap to zoom';
                imgEl.dataset.zoompage = pageNum;
                imgEl.dataset.zoomlabel = `p.${pageNum}${label ? ' · '+label : ''}`;
                wrap.innerHTML = `<div class="page-img-label">${lbl} <span style="color:#10b981;font-size:11px;">🔍 tap to zoom</span></div>`;
                wrap.appendChild(imgEl);
            } else {
                wrap.innerHTML = `<div class="page-img-label" style="color:#e88;">📄 ${lbl} — image unavailable</div>`;
            }
            box.scrollTop = box.scrollHeight;
        });
    }

    // ── Chip state ────────────────────────────────────────────────────────
    let lastQuery = '';
    let lastRawAnswer = '';

    // Teacher-mode breakdown (called by chip only)
    function teacherExplain(rawText, query) {
        const sections = extractTextbookSections(rawText);
        let html = `📘 <b>Let's break it down chommie 👇</b><br><br>`;

        // Plain-language summary from sentences
        const cleaned = rawText
            .replace(/NatSci&Tech_Gr5_Book\.indb[^\n]*/g,'')
            .replace(/[a-z]{2,5}\/ph[a-z]{3,}\/[^\s]{8,}/g, '')
            .replace(/ckg\/\w+\/[^\s]*/g, '')
            .replace(/F1le:[^\s]*/g, '')
            .replace(/Chapter [A-Za-z\s]+ \d+\.\s*/g, '')
            .replace(/\s{2,}/g,' ');
        const sentences = (cleaned.match(/[^.!?]{20,}[.!?]+/g)||[]).map(s=>s.trim());
        const keywords = (query||lastQuery).toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w=>w.length>2);
        const best = sentences.filter(s => {
            const sl=s.toLowerCase();
            const isJunk=/^(do you|can you|list|find|draw|write|look at|think about|describe|complete)/i.test(s);
            return !isJunk && keywords.some(k=>sl.includes(k));
        }).slice(0, 4);

        html += `🧠 <b>What the textbook says:</b><br>${best.map(s=>`📌 ${s}`).join('<br><br>')}<br><br>`;
        html += `💡 <b>Simple version:</b> Strip away the big words — the key idea is what those sentences describe. That's the concept in a nutshell!<br><br>`;
        // Topic-aware SA example
        const tq = (query || lastQuery || '').toLowerCase();
        const saTeach = tq.includes('rock') || tq.includes('sediment') ? "The <b>Karoo</b> has some of the world's best-exposed sedimentary rock layers — geologists come from everywhere to study them! 🪨"
            : tq.includes('fossil') ? "The <b>Cradle of Humankind</b> and <b>Karoo</b> fossil beds make SA one of the most important palaeontology countries on Earth! 🦕"
            : tq.includes('electr') || tq.includes('circuit') || tq.includes('conductor') ? "The copper wire in your home conducts electricity — the plastic coating insulates it. That's Grade 6 science keeping you safe! ⚡"
            : tq.includes('cell') || tq.includes('nucleus') || tq.includes('chloroplast') ? "Every leaf on every SA tree is packed with plant cells doing photosynthesis — millions of tiny solar panels! 🔬"
            : tq.includes('photosyn') || tq.includes('chlorophyll') ? "From Kruger grasslands to Cape forests — all that green is chlorophyll capturing sunlight and making food and oxygen! 🌿"
            : tq.includes('ecosystem') || tq.includes('biodiversity') ? "SA is one of 17 <b>megadiverse</b> countries — the fynbos alone has more plant species than the whole UK! 🌺"
            : tq.includes('mixture') || tq.includes('solution') || tq.includes('dissolv') ? "The ocean surrounding SA is a massive solution — salt dissolved in water. Chemistry happening at our coastline! 🌊"
            : tq.includes('sound') || tq.includes('vibration') || tq.includes('frequency') ? "A <b>vuvuzela</b> at a SA match creates sound by making air vibrate — loud, unmissable, and very Grade 6! 📯"
            : tq.includes('force') || tq.includes('gravity') || tq.includes('friction') ? "The <b>Drakensberg</b> — when water flows down, gravity accelerates it. When a hiker brakes, friction slows them. Forces at work! ⬇️"
            : tq.includes('solar') || tq.includes('planet') || tq.includes('galaxy') ? "The <b>SALT telescope</b> in Sutherland, Northern Cape — one of the world's largest, studying the universe from SA soil! 🔭"
            : tq.includes('igneous') || tq.includes('metamorphic') || tq.includes('rock cycle') ? "The <b>Pilanesberg</b> near Sun City formed from an ancient volcano — you can literally stand on igneous rock! 🌋"
            : tq.includes('classif') || tq.includes('species') || tq.includes('kingdom') ? "The Cape Floral Kingdom has the highest plant density on Earth — Grade 6 biodiversity right here in SA! 🌺"
            : "In South Africa you can see this everywhere — from the Karoo to Soweto to the ocean. Science is all around us! 🌍";
        html += `👀 <b>Real-life SA example:</b> ${saTeach}`;

        if (sections.keyQuestions.length > 0) {
            html += `<br><br><div style="background:#fff8e1;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:8px;">`;
            html += `<strong>🔑 Key Questions to Think About</strong><br>`;
            html += sections.keyQuestions.map(q=>`• ${q}`).join('<br>');
            html += `</div>`;
        }
        if (sections.keyConcepts.length > 0) {
            html += `<br><div style="background:#e8f5e9;border-left:3px solid #10b981;padding:10px 12px;border-radius:8px;">`;
            html += `<strong>💡 Key Concepts</strong><br>`;
            html += sections.keyConcepts.map(c=>`• ${c}`).join('<br>');
            html += `</div>`;
        }
        if (sections.newWords.length > 0) {
            html += buildNewWordsHTML(sections.newWords);
        }
        return html;
    }

    // Show clickable suggestion chips
    // Build green chip row for New Words — uses data attributes, no inline onclick
    function buildNewWordsHTML(words) {
        if (!words || words.length === 0) return '';
        let html = `<br><div style="background:#f3e8ff;border-left:3px solid #a855f7;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
        html += `<strong>📝 New Words</strong><br><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">`;
        words.forEach(w => {
            const entry = GLOSSARY[w] || GLOSSARY[w.toLowerCase()] || GLOSSARY[w.charAt(0).toUpperCase() + w.slice(1)];
            const pg = entry ? entry.page : 0;
            // Green chip with data attributes — event delegation handles the tap
            html += `<span data-term="${w.replace(/"/g,'&quot;')}" data-page="${pg}" style="background:#e8f5f0;color:#0a6e50;border:1.5px solid #10b981;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;">${w}${pg ? '<span style=\"color:#10b981;font-size:11px;\"> p.'+pg+'</span>' : ''}</span>`;
        });
        html += `</div></div>`;
        return html;
    }

    function showChips(topic) {
        const chips = [
            { label:"📖 Explain it simply", action:"explain" },
            { label:"💡 Give an example",   action:"example" },
            { label:"🔍 Go deeper",         action:"deeper"  },
            { label:"🧪 Quiz me on this",   action:"quiz"    }
        ];
        const box = document.getElementById('messages');
        const row = document.createElement('div');
        row.className = 'chip-row';
        chips.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'chip';
            btn.textContent = c.label;
            btn.onclick = () => chipAction(c.action, topic);
            row.appendChild(btn);
        });
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
    }

    function chipAction(action, topic) {
        const labels = { explain:"Explain it simply", example:"Give an example", deeper:"Go deeper", quiz:"Quiz me on this" };
        addMessage('user', labels[action]);

        setTimeout(() => {
            if (action === 'quiz') { startQuiz(); return; }

            if (!lastRawAnswer) {
                addMessage('bot', "Eish 😅 ask me a topic question first, then I can do that for you!");
                setTimeout(() => showChips(topic), 600);
                return;
            }

            if (action === 'explain') {
                addMessage('bot', teacherExplain(lastRawAnswer, lastQuery));

            } else if (action === 'example') {
                const lq = lastQuery.toLowerCase();
                const saContext = lq.includes('rock') || lq.includes('sediment') || lq.includes('granite') || lq.includes('basalt')
                    ? "In the <b>Karoo</b> cliff faces you can see sedimentary layers, while the <b>Drakensberg</b> shows ancient igneous formations! 🪨"
                    : lq.includes('fossil')
                    ? "South Africa's <b>Cradle of Humankind</b> and the <b>Karoo</b> are world-famous fossil sites — ancient life right under SA soil! 🦕"
                    : lq.includes('electr') || lq.includes('circuit') || lq.includes('conductor') || lq.includes('insulator')
                    ? "The copper wire in your home conducts electricity — the plastic coating is the insulator keeping you safe! ⚡"
                    : lq.includes('cell') || lq.includes('nucleus') || lq.includes('chloroplast')
                    ? "Every leaf on a SA tree has millions of plant cells with chloroplasts — tiny solar panels making food from sunlight! 🔬"
                    : lq.includes('photosyn') || lq.includes('chlorophyll') || lq.includes('glucose')
                    ? "From Kruger grasslands to Cape forests — all that green is chlorophyll capturing sunlight and making oxygen for free! 🌿"
                    : lq.includes('ecosystem') || lq.includes('food web') || lq.includes('biodiversity') || lq.includes('classif')
                    ? "SA is one of the world's 17 <b>megadiverse</b> countries — the fynbos biome alone has more plant species than the entire UK! 🌺"
                    : lq.includes('mixture') || lq.includes('solution') || lq.includes('dissolv')
                    ? "The ocean surrounding SA is a massive solution — salt dissolved in water. Chemistry at our coastline! 🌊"
                    : lq.includes('sound') || lq.includes('vibration') || lq.includes('frequency')
                    ? "A <b>vuvuzela</b> at a SA soccer match creates sound by making air vibrate at a specific frequency! 📯"
                    : lq.includes('force') || lq.includes('gravity') || lq.includes('friction')
                    ? "The <b>Drakensberg</b> — water flows downhill (gravity) and hikers brake on descents (friction). Forces in real SA life! ⬇️"
                    : lq.includes('solar') || lq.includes('planet') || lq.includes('orbit')
                    ? "The <b>SALT telescope</b> in Sutherland is one of the world's largest — studying galaxies from SA soil! 🔭"
                    : lq.includes('potential') || lq.includes('kinetic')
                    ? "A ball rolling down <b>Van Reenen's Pass</b> — potential energy at the top becomes kinetic energy at the bottom! 🏔️"
                    : lq.includes('igneous') || lq.includes('metamorphic') || lq.includes('rock cycle')
                    ? "The <b>Pilanesberg</b> near Sun City formed from an ancient volcano — you can stand on igneous rock! 🌋"
                    : "In South Africa you can see this everywhere — from the Karoo to Soweto to the ocean. Science is all around us! 🌍";
                                let html = `💡 <b>Real-life example — ${lastQuery}</b><br><br>🇿🇦 <b>SA Connection:</b><br>${saContext}`;
                if (sections.questions.length > 0) {
                    html += `<br><br><div style="background:#e8f0fe;border-left:3px solid #6366f1;padding:10px 12px;border-radius:8px;">`;
                    html += `<strong>❓ Think About It</strong><br>`;
                    html += sections.questions.slice(0,3).map(q=>`• ${q}`).join('<br>');
                    html += `</div>`;
                }
                addMessage('bot', html);

            } else if (action === 'deeper') {
                if (fuse) {
                    const results = fuse.search(lastQuery, { limit: 6 });
                    if (results.length > 0) {
                        const rawText = results.map(r => r.item.text).join(' ');
                        const deepAnswer = formatAnswer(lastQuery, rawText);
                        addMessage('bot', `🔍 <b>Going deeper on "${lastQuery}" 👇</b><br><br>${deepAnswer}`);
                    } else {
                        addMessage('bot', "Eish 😅 I couldn't find more detail on that. Try rephrasing chommie!");
                    }
                }
            }
            setTimeout(() => showChips(topic), 700);
        }, 350);
    }

    // ── PDF chunk search system ───────────────────────────────────────────
    let PDF_CHUNKS = [];

    const SYNONYMS = {
        electricity: ["current","power","voltage","electric","electrical energy"],

        invertebrate: ["no backbone","insect","worm","crab","snail","spider"],
        weathering: ["erosion","breaking down","wind","water","rock fragments"],
        conductor: ["copper","metal","allows electricity","low resistance"],
        insulator: ["rubber","plastic","wood","prevents electricity","high resistance"],
        potential: ["stored energy","elastic","spring","compressed","stretched","catapult","movement energy"],
        movement: ["kinetic energy","motion","speed","force","work","input","output"],

    function normalizePDF(text) {
        return text.toLowerCase().replace(/[^\w\s]/g, "").trim();
    }

    function getKeywords(q) {
        const words = normalizePDF(q).split(" ").filter(w => w.length > 2);
        const expanded = [...words];
        words.forEach(w => {
            if (SYNONYMS[w]) expanded.push(...SYNONYMS[w]);
        });
        return [...new Set(expanded)];
    }

    function scoreChunk(chunk, keywords) {
        const text = normalizePDF(chunk);
        const raw = chunk.toLowerCase();

        // Penalise question chunks — they contain keywords but aren't answers
        const trimmed = chunk.trim();
        if (trimmed.endsWith('?')) return -5;
        if (/^(what |how |why |which |give |list |name |describe |explain |below is|now we are|show where|carefully study)/i.test(trimmed)) return -8;

        // Penalise activity/instruction chunks heavily
        const isJunk = /^(now give|do not tell|use the knife|tap gently|cut out|paste|tick|fill in|write the names|perhaps an adult|as such the|they are designed|enabling activities|learners will have|if possible combine|hint what other|indb 20)/i.test(trimmed);
        if (isJunk) return -10;

        let score = 0;
        keywords.forEach(k => { if (text.includes(k)) score += 2; });

        // Bonus: exact phrase
        const joined = keywords.slice(0, 3).join(" ");
        if (joined.length > 3 && text.includes(joined)) score += 5;

        // Bonus: definitive sentences (starts with topic word)
        if (keywords.some(k => raw.startsWith(k))) score += 3;

        // Bonus: contains a definition pattern ("X is..." or "X are...")
        if (/ is | are | means | refers to /i.test(chunk)) score += 2;

        // Bonus: shorter = more precise (but not too short)
        if (chunk.length > 60 && chunk.length < 300) score += 2;

        // Penalise list-like chunks (components, materials lists)
        if (/^[A-Z][a-z]+,\s|,\s[a-z]+ [a-z]+,/i.test(chunk)) score -= 3;

        // Penalise teacher/activity language
        if (/teacher|learner|activity|exercise book|instruction|materials:|question:/i.test(raw)) score -= 3;

        return score;
    }

    function searchPDFChunks(q) {
        if (PDF_CHUNKS.length === 0) return null;
        const keywords = getKeywords(q);
        let bestScore = 0;
        let bestIndex = 0;

        PDF_CHUNKS.forEach((chunk, i) => {
            const score = scoreChunk(chunk, keywords);
            if (score > bestScore) { bestScore = score; bestIndex = i; }
        });

        if (bestScore === 0) return null;

        // Return context window: best chunk + neighbours
        return [
            PDF_CHUNKS[bestIndex - 1] || "",
            PDF_CHUNKS[bestIndex],
            PDF_CHUNKS[bestIndex + 1] || ""
        ].join(" ").trim();
    }

    function preparePDFChunks(fullText) {
        PDF_CHUNKS = fullText
            .split(/(?<=[.!?])\s+/)   // split on sentence boundaries
            .map(t => t.replace(/\s+/g, ' ').trim())
            .filter(t => t.length > 40 && t.length < 600);
    }

    // ── Lookup a single glossary term ─────────────────────────────────────
    function lookupTerm(term, page) {
        addMessage('user', `Tell me about: ${term}`);
        const entry = GLOSSARY[term];
        const pageHint = page || (entry ? entry.page : 0);
        const topicHint = entry ? entry.topic : '';

        // Always full Fuse search for rich Key Concepts, Questions, New Words
        if (fuse) {
            // Try exact term first, then with topic hint
            let results = fuse.search(term, { limit: 6 });
            if (results.length === 0 && topicHint && topicHint !== 'General') {
                results = fuse.search(`${term} ${topicHint}`, { limit: 6 });
            }
            // Last resort: search each word of multi-word terms separately
            if (results.length === 0 && term.includes(' ')) {
                const mainWord = term.split(' ').find(w => w.length > 4) || term.split(' ')[0];
                results = fuse.search(mainWord, { limit: 6 });
            }
            if (results.length > 0) {
                const rawText = results.map(r => r.item.text).join(' ');
                lastQuery = term;
                lastRawAnswer = rawText;
                const answer = formatAnswer(term, rawText);
                const pageRef = pageHint ? `<div style="color:#888;font-size:12px;margin-bottom:4px;">📄 p.${pageHint}${topicHint ? ' · ' + topicHint : ''}</div>` : '';
                addMessage('bot', pageRef + answer);
                // Show the actual textbook page image
                if (pageHint) {
                    setTimeout(() => showPageImage(pageHint, topicHint || term), 400);
                }
            } else {
                addMessage('bot', `Eish 😅 I couldn't find info on "<b>${term}</b>" in the textbook. Try asking it differently chommie!`);
            }
            setTimeout(() => showChips(term), 700);
        }
    }

    function isLikelyLearningIntent(q) {
        q = q.toLowerCase();
        // Must start with a question word AND have a science-like noun
        const questionStarters = ["what","how","why","when","where","which","name","list","define","explain","describe"];
        const startsAsQuestion = questionStarters.some(s => q.startsWith(s));
        if (!startsAsQuestion) return false;
        // Must be more than 2 words to avoid "what?" or "how?"
        if (q.split(' ').length < 2) return false;
        return true;
    }

    // ── PDF query handler ─────────────────────────────────────────────────
    function handlePDFQuery(q) {
        userState.inLearningMode = true;

        if (!fuse) {
            // Queue only the FIRST question asked — don't overwrite with later ones
            if (!pendingQuery) pendingQuery = q;
            addMessage('bot', "Eish chommie, I'm still loading the textbook 📚 Hold on — I'll answer that the moment it's ready! 🔄");
            // Show a typing indicator so they know something is happening
            setTimeout(() => {
                if (!pdfReady) {
                    addMessage('bot', "Still loading... 📖 Hang tight chommie, big textbook! While you wait — try asking about <b>cells</b>, <b>photosynthesis</b>, or <b>circuits</b> once I'm ready.");
                }
            }, 4000);
            return;
        }

        // Skip words guard
        const skipWords = new Set(['nice','good','ok','okay','cool','yes','no','wow','great','lol','haha','sure','thanks','fine','ready','go']);
        if (q.split(' ').length <= 2 && skipWords.has(q.replace(/[^a-z]/g,''))) {
            addMessage('bot', mergedRand('encouragement'));
            return;
        }

        let response;
        const results = fuse.search(q, { limit: 4 });
        if (results.length > 0) {
            const rawText = results.map(r => r.item.text).join(' ');
            lastQuery = q;
            lastRawAnswer = rawText;
            response = formatAnswer(q, rawText);
        } else {
            lastRawAnswer = '';
            response = mergedRand('confusion') + "<br><br>Try asking about <strong>rocks</strong>, <strong>fossils</strong>, <strong>electricity</strong>, <strong>metals</strong>, <strong>skeletons</strong> or <strong>food chains</strong> 🔬";
        }

        addMessage('bot', response);

        // Show textbook page image from best matching result
        if (results.length > 0) {
            const bestPage = results[0].item.page;
            if (bestPage) {
                setTimeout(() => showPageImage(bestPage, ''), 500);
            }
        }

        // Personality inserts AFTER answer
        if (Math.random() < 0.35) {
            setTimeout(() => addMessage('bot', rand(SA_ULTRA_FLOW.praise)), 900);
        }
        if (Math.random() < 0.25) {
            setTimeout(() => addMessage('bot', rand(SA_ULTRA_FLOW.encouragement)), 1400);
        }

        // Show clickable suggestion chips
        setTimeout(() => showChips(q), 1800);
    }

    // ── Main router ───────────────────────────────────────────────────────
    const CHAT_PHRASES = new Set([
        "i don't know","idk","i dont know","okay","ok","cool","nice","good","great",
        "wow","amazing","sure","yes","no","nah","maybe","thanks","thank you",
        "lol","haha","okay i will","call my mom","i will try","let's go","ready",
        "not sure","i see","got it","makes sense","interesting","really","seriously",
        "that was quick","that was fast","nice one","good one","sweet","lekker",
        "alright","yebo","sharp","heita","aweh","sho","eish","hayi","yoh"
    ]);

    function routeQuery(q) {
        const qClean = q.trim().toLowerCase();

        // Handle typed chip phrases
        if (qClean === 'explain it simply' || qClean === 'explain') { chipAction('explain', lastQuery); return; }
        if (qClean === 'give an example'   || qClean === 'example') { chipAction('example', lastQuery); return; }
        if (qClean === 'go deeper'         || qClean === 'deeper')  { chipAction('deeper',  lastQuery); return; }
        if (qClean === 'quiz me on this'   || qClean === 'quiz me') { startQuiz(); return; }
        if (qClean === 'menu'    || qClean === 'topic menu')   { showTopicMenu(); return; }
        if (qClean === 'glossary'|| qClean === 'terminology')  { showGlossary(null); return; }
        if (qClean.startsWith('index '))  { showTopicIndex(qClean.replace('index ','')); return; }

        if (CHAT_PHRASES.has(qClean)) { ultraFlowResponse(q); return; }
        if (qClean.split(' ').length <= 3 && !isContentQuery(qClean) && !isLikelyLearningIntent(qClean)) {
            ultraFlowResponse(q); return;
        }
        if (isContentQuery(q) || isLikelyLearningIntent(q)) {
            handlePDFQuery(q);
        } else {
            ultraFlowResponse(q);
        }
    }

    function handleSend() {
        const input = document.getElementById('userInput');
        const query = input.value.trim();
        if (!query) return; // Exit if input is empty

        addMessage('user', query); // Display the user's message
        input.value = ''; // Clear the input box
        
        setTimeout(() => {
            const q = query.toLowerCase();

                    `<a href="https://coach-l-radio.duckdns.org/public/coach-l-radio/podcasts" target="_blank" style="display:flex;align-items:center;gap:10px;background:#0a1a33;color:white;text-decoration:none;padding:12px 14px;border-radius:12px;border:1px solid #a855f7;">` +
                    `<span style="font-size:22px;">🎙️</span><div><div style="font-weight:700;font-size:15px;">Coach L Podcasts</div><div style="font-size:12px;color:#a855f7;">On demand · click to listen</div></div></a>`

            if (q.includes("who is linda") || q === "linda") {

            }
            if (q.includes("lexi") || q.includes("alexis")) {

                setTimeout(() => addMessage('bot', "She's also resourceful 😆 First one to find the answer, first one to finish the worksheet. Lexi moves fast! ⚡"), 900);
                setTimeout(() => addMessage('bot', "But that's the thing about Lexi — she doesn't just do it for herself. She'll turn around and help the person next to her too. Good energy. 💪"), 1800);

            }
            if (q.includes("sadee")) {
                addMessage('bot', "Yoh Sadee 🙏 She's not just a friend — she's the kind of person who makes the whole room feel calmer just by being there.");
                setTimeout(() => addMessage('bot', "Sadee is <b>spiritually grounded</b> and deeply compassionate. She sees the good in people even when they struggle to see it in themselves. 🌿"), 900);
                setTimeout(() => addMessage('bot', "If you're ever feeling down, Sadee's the one who will lift you up — not with noise, but with a quiet kind of strength that just makes sense. 💛"), 1900);
                setTimeout(() => addMessage('bot', "Down to earth. Sweet soul. The real deal. 🇿🇦 We appreciate Sadee around here chommie 😌"), 2800);
                return;
            }

            // ── Index / Glossary / Menu triggers ──────────────────────────
            if (q === 'menu' || q === 'topics' || q.includes('topic menu') || q.includes('show topics') || q.includes('show menu')) {
                showTopicMenu();
                return;
            }

            if (q === 'glossary' || q.includes('show glossary') || q.includes('all terms') || q.includes('terminology')) {
                showGlossary(null);
                return;
            }

            if (q.startsWith('glossary ') && q.length > 9) {
                showGlossary(q.replace('glossary ', '').trim());
                return;
            }

            // "index rocks" / "index fossils" / "index electricity" etc.
            if (q.startsWith('index ') && q.length > 6) {
                showTopicIndex(q.replace('index ', '').trim());

            }
            if (q === 'index' || q.includes('show index') || q.includes('topic index')) {
                showTopicMenu();

            }

            // Quiz
            if (q.includes('quiz') || q.includes('test me') || q.includes('ask me a question') || q.includes('assessment')) {
                startQuiz();
                return;
            }

            // Quiz answer
            if (quizMode && currentQuiz) {
                const qText = currentQuiz.question;
                const aText = currentQuiz.answer;
                quizMode = false;
                currentQuiz = null;
                addMessage('bot', `${rand(SA_ULTRA_FLOW.praise)} Here's what the textbook says:<br><br><strong>Q: ${qText}</strong><br><br>${aText}<br><br>Say <strong>quiz me</strong> for another one!`);
                return;
            }

            // Route everything else through the smart router
            routeQuery(q);

        }, 400); // Delay for simulated processing time
    }

    // Quiz state
    let quizMode = false;
    let currentQuiz = null;

    function startQuiz() {
        if (!knowledgeBase.length) {
            addMessage('bot', "Eish, still loading the textbook! 😅 Try again in a sec.");
            return;
        }

        const qaPairs = [];
        knowledgeBase.forEach(chunk => {
            const text = chunk.text;
            // Match a question followed by answer content
            const matches = text.match(/([A-Z][^?]{15,}[?])\s*([^?]{30,}[.!])/g);
            if (matches) {
                matches.forEach(m => {
                    const parts = m.match(/^([^?]+[?])\s*(.+)$/s);
                    if (parts && parts[1] && parts[2]) {
                        const q = parts[1].trim();
                        const a = parts[2].trim().substring(0, 400);
                        // Skip activity/navigation/diagram instructions
                        const skip = /^(Do you|Can you|Look at|Think about|Draw|After you|Consider|Which cheek|Which direction|Stand facing|Turn to your|ACTIVITY|NatSci)/i.test(q);
                        // Must be a proper science question with substance
                        const hasContent = q.length > 20 && a.length > 30;
                        if (!skip && hasContent) {
                            qaPairs.push({ question: q, answer: a });
                        }
                    }
                });
            }
        });

        if (qaPairs.length === 0) {
            addMessage('bot', "Eish, I couldn't pull a question right now. 😅 Try asking me a topic!");
            return;
        }

        const pick = qaPairs[Math.floor(Math.random() * qaPairs.length)];
        quizMode = true;
        currentQuiz = pick;
        addMessage('bot', `🧠 Quiz time chommie!<br><br><strong>${pick.question}</strong><br><br>Type your answer — then I'll show you what the textbook says!`);
    }
    // ── Extract structured textbook sections from raw PDF text ────────────
    function extractTextbookSections(rawText) {
        const sections = { keyQuestions: [], keyConcepts: [], questions: [], newWords: [] };

        // KEY QUESTIONS — bullet list after "KEY QUESTIONS"
        const kqMatch = rawText.match(/KEY QUESTIONS\s*([\s\S]*?)(?=KEY CONCEPTS|NatSci|ACTIVITY|\n\n\n|$)/i);
        if (kqMatch) {
            sections.keyQuestions = kqMatch[1]
                .split(/[•\n]/)
                .map(s => s.replace(/\?$/, '?').trim())
                .filter(s => s.length > 8 && s.endsWith('?'));
        }

        // KEY CONCEPTS — bullet list after "KEY CONCEPTS"
        const kcMatch = rawText.match(/KEY CONCEPTS\s*([\s\S]*?)(?=KEY QUESTIONS|NatSci|ACTIVITY|\n\n\n|$)/i);
        if (kcMatch) {
            sections.keyConcepts = kcMatch[1]
                .split(/[•\n]/)
                .map(s => s.trim())
                .filter(s => s.length > 8 && !s.startsWith('NatSci') && !/^\d/.test(s));
        }

        // QUESTIONS — numbered or paragraph questions (not KEY QUESTIONS)
        const qMatch = rawText.match(/(?:^|\n)QUESTIONS?\s*([\s\S]*?)(?=KEY|NatSci|ACTIVITY|REVISION|\n\n\n|$)/im);
        if (qMatch) {
            sections.questions = qMatch[1]
                .split(/\n|\d+\.\s+/)
                .map(s => s.trim())
                .filter(s => s.length > 15 && !s.startsWith('NatSci') && !/^(List|Draw|Write|Complete)/i.test(s));
        }

        // New Words
        const nwMatch = rawText.match(/New words\s*([\s\S]*?)(?=NatSci|KEY|\n\n|$)/i);
        if (nwMatch) {
            sections.newWords = nwMatch[1]
                .split(/[•\n]/)
                .map(s => s.trim())
                .filter(s => s.length > 2 && s.length < 30 && !/NatSci/i.test(s));
        }

        return sections;
    }

    function formatAnswer(query, rawText) {
        const q = query.toLowerCase();

        // ── Step 1: Extract structured sections BEFORE cleaning ──────────
        const sections = extractTextbookSections(rawText);

        // ── Step 2: Clean text for definition sentences ──────────────────
        const cleaned = rawText
            .replace(/NatSci&Tech_Gr5_Book\.indb[^\n]*/g, '')
            .replace(/NatSci&Tech_Gr5_TG_Book\.indb[^\n]*/g, '')
            .replace(/(Life and living|Matter and materials|Energy and change|Planet Earth and beyond|Systems and control)[^\d]*\d+/g, '')
            .replace(/Chapter \d+:[^.!?\d]{3,60}/g, '')
            .replace(/KEY (CONCEPTS|QUESTIONS|WORDS?)[^.!?]*/g, '')
            .replace(/ACTIVITY \d+\.\d+[^.!?]*/g, '')
            .replace(/QUESTIONS?[^.!?]{0,10}(?=\s)/g, '')
            .replace(/REVISION[^.!?]*/g, '')
            .replace(/INSTRUCTIONS?:[^.!?]*/g, '')
            .replace(/New words[^.!?]*/g, '')
            .replace(/indb \d{4}[^.!?]*/g, '')
            // Strip all corrupt URL/path patterns from PDF text layer
            .replace(/[a-z]{2,5}\/ph[a-z]{3,}\/[^\s]{8,}/g, '')
            .replace(/ihm\/[a-z]+\/[^\s]*/g, '')
            .replace(/com\/photos\/[^\s]*/g, '')
            .replace(/ckg\/\w+\/[^\s]*/g, '')
            .replace(/F1le:[^\s]*/g, '')
            .replace(/Chapter [A-Za-z\s]+ \d+\.\s*/g, '')
            .replace(/\b[a-z]{2,3}\/[a-z]{4,}\/[a-z0-9_]{4,}\b/g, '')
            // Strip PDF built-in glossary entries bleeding into answers
            .replace(/Glossary [A-Z][a-z]+ To [^.!?]+[.!?]/g, '')
            .replace(/\bGlossary\b[^.!?]{0,200}/g, '')
            .replace(/\b\d{2,3}\b/g, '')
            .replace(/\s{2,}/g, ' ')
            .trim();

        // ── Step 3: Score and pick best definition sentences ─────────────
        const sentences = (cleaned.match(/[^.!?]{15,}[.!?]+/g) || []).map(s => s.trim());
        const keywords = q.replace(/[^a-z\s]/g, '').split(/\s+/).filter(w => w.length > 2);

        const scored = sentences.map(s => {
            const sl = s.toLowerCase();
            const st = s.trim();
            const isJunk = /^(do you|can you|list|find|identify|explain|describe|complete|use the|look at|write|draw|think about|remember|give two|give an|now we|show where|carefully|below is|label|what do|choose the|try to pull|give a reason|throw water|turn off|attend to|if someone|for enrichment|in activity|perhaps you|fill in|cut out|paste|tick|choose correct|using a|you will need|in this activity|notes chapter)/i.test(st);
            const isQuestion = st.endsWith('?');
            const isTooShort = st.length < 35;
            // Diagram captions: many capitalised words, no verb — e.g. "Skull Shoulder blade Ribs Backbone Hip bone"
            const isDiagramCaption = (st.match(/\b[A-Z][a-z]+\b/g) || []).length > 3 && !/ is | are | can | will | has | forms | helps | allows | protects /i.test(st);
            // File/image reference junk — all corrupt URL/path patterns
            const isFileRef = /F1le:|ckg\/|atuo_|Rcyal|_%28|\.jpg|\.png|indb \d|ihm\/|phctco|pphtho|\/photos\//i.test(st);
            const kwScore = keywords.reduce((n, kw) => n + (sl.includes(kw) ? 3 : 0), 0);
            const lengthBonus = (s.length > 50 && s.length < 350) ? 1 : 0;
            const score = (isJunk || isQuestion || isTooShort || isDiagramCaption || isFileRef) ? -10 : kwScore + lengthBonus;
            return { s, score };
        });

        const top = scored
            .filter(x => x.score > 0)
            .sort((a, b) => b.score - a.score)
            .slice(0, 6)
            .map(x => x.s);

        if (top.length === 0) {
            const topicExists = keywords.some(kw => cleaned.toLowerCase().includes(kw));
            if (!topicExists) {
                return "Eish chommie! 😅 I don't think that topic is in our Grade 6 textbook. Try asking about <strong>cells</strong>, <strong>photosynthesis</strong>, <strong>ecosystems</strong>, <strong>circuits</strong>, <strong>forces</strong>, or <strong>the rock cycle</strong>!";
            }
            // When no strong definition sentences found, use Key Concepts as main content
            if (sections.keyConcepts.length > 0) {
                top.push(...sections.keyConcepts.slice(0, 4));
            } else {
                const fallback = sentences.filter(s => s.length > 40 && !/^(do you|can you|list|find|identify|explain|describe|complete|give two|below is)/i.test(s)).slice(0, 3);
                if (fallback.length === 0) return "Eish chommie, I found something but it's a bit messy. 😅 Try asking differently!";
                top.push(...fallback);
            }
        }
        // Always supplement sparse results with Key Concepts
        if (top.length < 3 && sections.keyConcepts.length > 0) {
            const extras = sections.keyConcepts.filter(c => !top.includes(c));
            top.push(...extras.slice(0, 4 - top.length));
        }

        const emoji = q.includes('rock') || q.includes('sediment') ? '🪨'
                    : q.includes('fossil') ? '🦕'
                    : q.includes('electr') || q.includes('circuit') || q.includes('batter') ? '⚡'
                    : q.includes('metal') ? '🔩'
                    : q.includes('plant') || q.includes('food chain') || q.includes('photosyn') ? '🌿'
                    : q.includes('animal') ? '🐾'
                    : q.includes('skeleton') || q.includes('bone') ? '🦴'
                    : q.includes('earth') || q.includes('season') || q.includes('planet') ? '🌍'
                    : q.includes('energy') || q.includes('fuel') || q.includes('coal') ? '🔥'
                    : q.includes('water') || q.includes('cloud') || q.includes('rain') ? '💧'
                    : q.includes('struct') ? '🏗️'
                    : q.includes('material') ? '🧱'
                    : q.includes('ligament') || q.includes('tendon') || q.includes('joint') ? '🦴'
                    : q.includes('amphibian') || q.includes('reptile') ? '🐸'
                    : q.includes('producer') || q.includes('consumer') ? '🌿'
                    : '🔬';

        // ── Step 4: Build rich structured response ───────────────────────
        let html = `Sho chommie! ${emoji} Here's what the textbook says:<br><br>`;
        html += top.map(s => `📌 ${s}`).join('<br><br>');

        if (sections.keyQuestions.length > 0) {
            html += `<br><br><div style="background:#fff8e1;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
            html += `<strong>🔑 Key Questions</strong><br>`;
            html += sections.keyQuestions.map(q => `• ${q}`).join('<br>');
            html += `</div>`;
        }

        if (sections.keyConcepts.length > 0) {
            html += `<br><div style="background:#e8f5e9;border-left:3px solid #10b981;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
            html += `<strong>💡 Key Concepts</strong><br>`;
            html += sections.keyConcepts.map(c => `• ${c}`).join('<br>');
            html += `</div>`;
        }

        if (sections.questions.length > 0) {
            html += `<br><div style="background:#e8f0fe;border-left:3px solid #6366f1;padding:10px 12px;border-radius:8px;margin-top:6px;">`;
            html += `<strong>❓ Think About It</strong><br>`;
            html += sections.questions.slice(0, 3).map(q => `• ${q}`).join('<br>');
            html += `</div>`;
        }

        if (sections.newWords.length > 0) {
            html += buildNewWordsHTML(sections.newWords);
        }

        return html;
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = text;
        const box = document.getElementById('messages');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight; // Scroll to the latest message
    }

    function openChat() {
        document.getElementById('chat-modal').style.display = 'block';
        document.getElementById('maxi-fab').classList.add('hidden');
    }
    function closeChat() {
        document.getElementById('chat-modal').style.display = 'none';
        document.getElementById('maxi-fab').classList.remove('hidden');
        // Notify parent frame
        try { window.parent.postMessage('closeBot', '*'); } catch(e) {}
        // Navigate back if standalone
        if (window.self === window.top) {
            if (window.history.length > 1) window.history.back();
        }
    }
    // ── Keyboard push-up for Android WebView ─────────────────────────
    // When the virtual keyboard opens, visualViewport shrinks.
    // We shift the chat-modal up so the input stays visible.
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function() {
            const modal = document.getElementById('chat-modal');
            const vvHeight = window.visualViewport.height;
            const windowHeight = window.innerHeight;
            const keyboardHeight = windowHeight - vvHeight;
            if (keyboardHeight > 100) {
                // Keyboard is open — shrink modal to visual viewport height
                modal.style.height = vvHeight + 'px';
                modal.style.top = (windowHeight - vvHeight) + 'px';
                // Scroll messages to bottom so latest is visible
                const box = document.getElementById('messages');
                if (box) box.scrollTop = box.scrollHeight;
            } else {
                // Keyboard closed — restore
                modal.style.height = '';
                modal.style.top = '0';
            }
        });
        window.visualViewport.addEventListener('scroll', function() {
            const modal = document.getElementById('chat-modal');
            modal.style.top = window.visualViewport.offsetTop + 'px';
        });
    }

    // Start PDF loading immediately — don't wait for any event
    // Multiple triggers to handle Niotron WebViewer timing quirks
    (function startLoading() {
        // Hide FAB since chat opens immediately
        const fab = document.getElementById('maxi-fab');
        if (fab) fab.classList.add('hidden');
        // Configure worker (belt-and-suspenders — also done above)
        if (typeof pdfjsLib !== 'undefined' && pdfjsLib.GlobalWorkerOptions) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
        initResources();
    })();
    // Fallbacks in case the IIFE ran too early
    document.addEventListener('DOMContentLoaded', function() { if (!pdfReady && !pdfDocRef) initResources(); });
    window.addEventListener('load', function() { if (!pdfReady && !pdfDocRef) initResources(); });
    // Last-resort retry after 2s for slow WebViewer environments
    setTimeout(function() { if (!pdfReady && !pdfDocRef) initResources(); }, 2000);
</script>
