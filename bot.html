<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Maxi Pie - Grade 7 Science Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker immediately — must happen before any getDocument() call
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0a1a33;
            overflow: hidden;
        }
        #maxi-fab {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            z-index: 999;
        }
        #maxi-fab img {
            width: 85%;
            height: 85%;
            border-radius: 50%;
            object-fit: cover;
        }
        #chat-modal {
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(7, 7, 12, 0.95);
            z-index: 1000;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #f0f4f8;
            min-height: 0;
            overflow: hidden;
        }
        .chat-header {
            background: #0a1a33;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            border-bottom: 3px solid #10b981;
        }
        .chat-header img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #10b981;
        }
        .close-btn {
            margin-left: auto;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px; 
            height: 35px;
            font-weight: bold;
            cursor: pointer;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .bot {
            align-self: flex-start;
            background: white;
            color: #333;
        }
        .user {
            align-self: flex-end;
            background: #10b981;
            color: white;
        }
        .chat-input-area {
            padding: 15px;
            background: white;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 16px;
            color: #333;
        }
        .send-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px;
            height: 45px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
        #img-zoom-modal {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.92); 
            z-index: 9999; 
            justify-content: center; 
            align-items: center; 
        }
        #img-zoom-modal.open { 
            display: flex; 
        }
        #img-zoom-modal img { 
            max-width: 96%; 
            max-height: 85vh; 
        }
        #img-zoom-close {
            position: absolute; 
            top: 16px; 
            right: 16px; 
            background: #ef4444; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<div id="maxi-fab" onclick="openChat()">
    <img src="cat_full.png" alt="Open chat with Maxi Pie">
</div>

<div id="chat-modal">
    <div class="chat-container">
        <div class="chat-header">
            <img src="cat_full.png" alt="Maxi Pie">
            <div>
                <h3>Maxi Pie</h3>
                <small style="color:#10b981">Grade 7 Science Chommie 🇿🇦</small>
            </div>
            <button class="close-btn" onclick="closeChat()">×</button>
        </div>
        <div id="messages" class="chat-messages">
            <div class="msg bot">Sho! I'm <strong>Maxi Pie</strong> 🐾, your Grade 7 science sidekick! Ask me about cells, nutrition, atoms, reactions, electricity, magnetism, the atmosphere, and more!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask me something, chommie..."
                onkeypress="if(event.key==='Enter') handleSend()"
                onfocus="setTimeout(function(){ document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight; }, 400)">
            <button class="send-btn" onclick="handleSend()">Send</button>
        </div>
    </div>
</div>

<div id="img-zoom-modal" onclick="closeZoom(event)">
    <button id="img-zoom-close" onclick="closeZoom()">×</button>
    <img id="img-zoom-src" src="" alt="Zoomed image">
</div>

<script>
// ─────────────────────────────────────────
// GLOBALS
let knowledgeBase = [];
let fuse = null;
let PDF_CHUNKS = [];
let pdfReady = false;

// 🧠 MEMORY SYSTEM
let USER_MEMORY = {
    topicsAsked: {},
    weakTopics: {},
    lastTopic: null
};

// ─────────────────────────────────────────
// EXPANDED PERSONALITY
const EXTRA_PERSONALITY = {
    praise: [
        "🔥 That’s it!",
        "💯 Nailed it chommie!",
        "Aweh 😎 you’re getting sharp now!",
        "Yoh that’s clever hey!"
    ],
    encouragement: [
        "Don’t stress chommie 💪 we build it step by step",
        "You’re close 👀 adjust it slightly",
        "Eish 😅 this one confuses everyone"
    ],
    hints: [
        "📚 Try asking about <b>rocks</b>, <b>fossils</b>, <b>electricity</b>",
        "📘 You can ask for definitions or examples",
        "🧪 Say <b>quiz me</b> to test yourself",
        "📖 Ask anything from the textbook 😎"
    ]
};

// ─────────────────────────────────────────
// HELPERS
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function normalize(text){
    return text.toLowerCase().replace(/[^\w\s]/g,"");
}

// ─────────────────────────────────────────
// SYNONYMS
const SYNONYMS = {
    electricity: ["current","power","voltage"],
    rocks: ["stone","mineral"],
    fossils: ["bones","remains"]
};

function getKeywords(q){
    let words = normalize(q).split(" ");
    let expanded = [...words];

    words.forEach(w=>{
        if(SYNONYMS[w]) expanded.push(...SYNONYMS[w]);
    });

    return [...new Set(expanded)];
}

// ─────────────────────────────────────────
// MEMORY TRACKING
function trackTopic(q){
    let topics = ["rock","fossil","electric"];

    topics.forEach(t=>{
        if(q.includes(t)){
            USER_MEMORY.topicsAsked[t] = (USER_MEMORY.topicsAsked[t] || 0) + 1;
            USER_MEMORY.lastTopic = t;
        }
    });
}

// ─────────────────────────────────────────
// CHUNK ENGINE
function prepareChunks(text){
    PDF_CHUNKS = text.split(/(?<=[.!?])\s+/)
    .filter(t => t.length > 40 && t.length < 400);
}

function scoreChunk(chunk, keywords){
    let score = 0;
    let text = normalize(chunk);

    keywords.forEach(k=>{
        if(text.includes(k)) score += 3;
    });

    if(/ is | are /i.test(chunk)) score += 5;
    if(chunk.length < 200) score += 2;

    if(/activity|question|exercise/i.test(chunk)) score -= 10;

    return score;
}

function searchChunks(q){
    let keywords = getKeywords(q);

    let best = null;
    let bestScore = 0;

    PDF_CHUNKS.forEach(chunk=>{
        let s = scoreChunk(chunk, keywords);
        if(s > bestScore){
            bestScore = s;
            best = chunk;
        }
    });

    return bestScore > 0 ? best : null;
}

// ─────────────────────────────────────────
// PDF LOAD
async function initPDF(){

    const url = "resources/logic2.pdf";
    const pdf = await pdfjsLib.getDocument(url).promise;

    for(let i=1;i<=pdf.numPages;i++){
        let page = await pdf.getPage(i);
        let txt = await page.getTextContent();
        let str = txt.items.map(s=>s.str).join(" ");

        knowledgeBase.push({text:str});
    }

    fuse = new Fuse(knowledgeBase,{
        keys:["text"],
        threshold:0.5
    });

    prepareChunks(knowledgeBase.map(p=>p.text).join(" "));

    pdfReady = true;

    addMessage('bot',"📚 Textbook ready chommie! Ask anything 🔬");
}

// ─────────────────────────────────────────
// TEACHER MODE
function teacherExplain(answer){
    return `
    📘 Let’s break it down chommie 👇

    🧠 ${answer}

    💡 Simple:
    This is how it works in real life.

    👀 Example:
    Think of something you see daily — that’s how it behaves.
    `;
}

// ─────────────────────────────────────────
// FORMAT ANSWER
function formatAnswer(q, text){
    let sentences = text.match(/[^.!?]+[.!?]+/g) || [];
    let best = sentences.slice(0,2).join("<br><br>");

    if(Math.random() < 0.6){
        best = teacherExplain(best);
    }

    return `${best}`;
}

// ─────────────────────────────────────────
// QUIZ SYSTEM
function miniQuiz(q){
    let quiz = "";

    if(q.includes("rock")) quiz = "🧪 Which rock forms from lava?";
    else if(q.includes("fossil")) quiz = "🧪 What do fossils tell us?";
    else if(q.includes("electric")) quiz = "🧪 What flows in a circuit?";

    if(quiz){
        setTimeout(()=>addMessage('bot',quiz),1500);
    }
}

// ─────────────────────────────────────────
// SMART FOLLOW-UP
function followUp(){
    setTimeout(()=>{
        addMessage('bot',"👉 Want an example, explanation, or quiz? 😎");
    },1200);
}

// ─────────────────────────────────────────
// MAIN ANSWER ENGINE
function handlePDF(q){
    if(!pdfReady){
        addMessage('bot',"Still loading 😅");
        return;
    }

    trackTopic(q);

    let chunk = searchChunks(q);
    let response;

    if(chunk){
        response = formatAnswer(q, chunk);
    } else {
        let res = fuse.search(q,{limit:2});
        if(res.length){
            response = formatAnswer(q, res[0].item.text);
        } else {
            response = "Eish 😅 try rocks, fossils or electricity 🔬";
        }
    }

    addMessage('bot',response);

    // personality inserts
    if(Math.random() < 0.5){
        setTimeout(()=>addMessage('bot',rand(EXTRA_PERSONALITY.praise)),800);
    }

    if(Math.random() < 0.3){
        setTimeout(()=>addMessage('bot',rand(SA_PERSONALITY.jokes)),1200);
    }

    if(Math.random() < 0.4){
        setTimeout(()=>addMessage('bot',rand(EXTRA_PERSONALITY.hints)),1600);
    }

    followUp();
    miniQuiz(q);
}

// ─────────────────────────────────────────
// ROUTER
function route(q){
    q = q.toLowerCase();

    if(q.includes("quiz")){
        miniQuiz(q);
        return;
    }

    handlePDF(q);
}

// ─────────────────────────────────────────
// UI (UNCHANGED)
function addMessage(role,text){
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = text;

    const box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function handleSend(){
    let input = document.getElementById("userInput");
    let q = input.value.trim();
    if(!q) return;

    addMessage('user',q);
    input.value="";

    setTimeout(()=>route(q),300);
}

// ─────────────────────────────────────────
window.onload = initPDF;

</script>

</body>
</html>
